name: Research market gate and Asian settlement tests
on:
  pull_request:
    paths:
      - 'research/market_gate.py'
      - 'research/asian_settlement.py'
      - 'tests/test_research_market_gate.py'
      - 'tests/test_asian_settlement.py'
      - '.github/workflows/research-market-tests.yml'
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research regression tests
        run: python -m unittest discover -s tests -p 'test_*market_gate.py' -v && python -m unittest discover -s tests -p 'test_asian_settlement.py' -v
