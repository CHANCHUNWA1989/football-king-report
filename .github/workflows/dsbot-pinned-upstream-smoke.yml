name: DS Bot pinned upstream smoke (research only)

# Draft-PR-only ephemeral checks. No real model, production or bookmaker access.
on:
  pull_request:
    paths:
      - '.github/workflows/dsbot-pinned-upstream-smoke.yml'
      - 'docs/DS_BOT_PINNED_UPSTREAM_SMOKE_20261115.md'

permissions:
  contents: read

concurrency:
  group: dsbot-research-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
      THE_ODDS_API_KEY: ''
      API_FOOTBALL_KEY: ''
      FOOTBALL_DATA_ORG_TOKEN: ''
      SPORTMONKS_API_TOKEN: ''
      OPENFOOT_API_KEY: ''
      DSH_PERMISSION_MODE: read-only
      CI: 'true'
    steps:
      - name: Checkout SHA-pinned DS Bot upstream without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Fei2411/DS-Bot
          ref: a66cc737cfb6c3d8a2597e748cded6cab1206dd3
          persist-credentials: false
          path: dsbot-upstream
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify upstream commit, license, version and lockfile
        working-directory: dsbot-upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a66cc737cfb6c3d8a2597e748cded6cab1206dd3"
          test "$(node -p "require('./ds-bot/package.json').version")" = "0.3.6"
          test -f ds-bot/package-lock.json
          grep -q 'Apache License' LICENSE
          grep -q 'DeepSeek Harness' NOTICE
          echo 'Pinned upstream DS Bot v0.3.6, Apache-2.0, NOTICE and lockfile verified.'
      - name: Install upstream locked packages with lifecycle scripts disabled
        working-directory: dsbot-upstream/ds-bot
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install locked upstream phone-link dependencies (required by upstream unit suite)
        working-directory: dsbot-upstream/link
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install pinned mock DSH test harness
        working-directory: dsbot-upstream/ds-bot
        shell: bash
        run: |
          set -euo pipefail
          npm run harness -- --ignore-scripts --no-save \
            '@deepseek-ai/dsh@0.2.2-rc.1' \
            '@deepseek-ai/dsh-agent-loop-testkit@0.2.2-rc.1'
      - name: Execute upstream mock-model unit tests
        working-directory: dsbot-upstream/ds-bot
        run: npm test
      - name: Verify shipped web-client build is consistent
        working-directory: dsbot-upstream/ds-bot
        run: node scripts/build-client.mjs --check

  vnext-handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
      THE_ODDS_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout VNext draft PR without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline DS Bot bridge regression tests
        run: |
          python -m compileall -q ops/ds_bot_handoff_gate.py
          python -m unittest discover -s ops/tests -p 'test_ds_bot_handoff_gate.py' -v
      - name: Exercise CLI using strictly synthetic research-only input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).replace(microsecond=0)
          stamp = lambda t: t.strftime("%Y-%m-%dT%H:%M:%SZ")
          payload = {
              "schema": "football-king-dsbot-handoff-v1",
              "origin": "ds-bot",
              "run_id": "synthetic-ci-check",
              "generated_at_utc": stamp(now),
              "as_of_utc": stamp(now - timedelta(minutes=1)),
              "status": "RESEARCH_ONLY",
              "production_recommendations": "DISABLED",
              "observations": [
                  {"role": "model_challenge",
                   "note": "Synthetic CI check, not an actual bot response",
                   "references": []}
              ]
          }
          Path(os.environ["RUNNER_TEMP"], "dsbot-synthetic.json").write_text(json.dumps(payload))
          PY
          python -m ops.ds_bot_handoff_gate --input "$RUNNER_TEMP/dsbot-synthetic.json" > "$RUNNER_TEMP/dsbot-gate-output.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "dsbot-gate-output.json").read_text())
          assert result["status"] == "HOLD"
          assert result["production_recommendations"] == "DISABLED"
          assert result["independent_source_authentication"] is False
          assert result["eligible_for_prediction_or_betting"] is False
          assert result["authenticated_forward_samples"] == 0
          assert result["verified_positive_ev"] is False
          assert "observations" not in result
          print("Synthetic handoff remains HOLD/DISABLED; no source or EV certification.")
          PY
