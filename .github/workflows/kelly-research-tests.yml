name: Kelly paper-only research CI
on:
  pull_request:
    paths:
      - 'ops/kelly_research.py'
      - 'ops/tests/test_kelly_research.py'
      - '.github/workflows/kelly-research-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ops/kelly_research.py'
      - 'ops/tests/test_kelly_research.py'
      - '.github/workflows/kelly-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kelly-math-and-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q ops/kelly_research.py
      - name: Kelly full and Asian quarter settlement tests
        run: python -m unittest discover -s ops/tests -p 'test_kelly_research.py' -v
