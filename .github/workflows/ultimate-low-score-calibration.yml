name: Ultimate low-score historical calibration
on:
  pull_request:
    paths:
      - 'ops/live_core_low_score_calibration.py'
      - 'ops/live_core_halftime_dynamics.py'
      - 'ops/live_core_statsbomb_cohort.py'
      - 'ops/tests/test_live_core_statsbomb_cohort.py'
      - 'ops/tests/test_live_core_halftime_dynamics.py'
      - 'ops/tests/test_live_core_low_score_calibration.py'
      - '.github/workflows/ultimate-low-score-calibration.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Combined offline core regression
        run: python -m unittest discover -s ops/tests -p 'test_live_core_*.py' -v
      - name: Pinned historical training and later-season assessment
        run: python ops/live_core_low_score_calibration.py
      - name: Frozen halftime score-state and comeback assessment
        run: python ops/live_core_halftime_dynamics.py
