name: 足球王者 V4.1｜免費賠率市場研究及配額保護

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-odds.yml'
  schedule:
    # 香港時間 09:07、21:07。GitHub cron 可能延遲。
    - cron: '7 1,13 * * *'

concurrency:
  group: football-king-free-market-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout source (no API secret at this stage)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent safety tests without any API secret
        run: python -m unittest discover -s ops/tests -q

      - name: Read free quota and fetch EU three-way market (max six credits)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          # Credentials are visible to this ONE collection step only.
          # /v4/sports is free; only region=eu, market=h2h is billable.
          # Market snapshot as_of_utc is the END of the complete batch.
          # The archive job verifies time ordering and refuses stale overwrites.
          python ops/odds_market.py --mode collect --output market-result.json
          test -s market-result.json

      - name: Transfer derived probabilities, never raw bookmaker prices
        uses: actions/upload-artifact@v4
        with:
          name: football-king-derived-market
          path: market-result.json
          retention-days: 7
          if-no-files-found: error

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout security policy only (never access the API key)
        uses: actions/checkout@v4

      - name: Download derived market report without the API key
        uses: actions/download-artifact@v4
        with:
          name: football-king-derived-market
          path: market

      - name: Validate and save market research without allowing stale overwrites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s market/market-result.json
          # Zero-charge validation: no secret exists in this job.
          python ops/market_archive_guard.py \
            --current "$RUNNER_TEMP/nonexistent-market.json" \
            --incoming market/market-result.json
          today="$(date -u +'%Y/%m/%d')"
          gzip -n -c market/market-result.json > "$RUNNER_TEMP/market.json.gz"
          history_target="market/history/$today/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.gz"
          archived=false
          for attempt in 1 2 3 4 5; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$history_target" --jq '.sha' 2>/dev/null || true)"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then sha=""; fi
            body="$(base64 -w0 "$RUNNER_TEMP/market.json.gz")"
            if [ -n "$sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$history_target" \
                -f message="Archive compressed research-only market consensus" \
                -f sha="$sha" -f content="$body" >/dev/null 2>&1; then
                archived=true
                break
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$history_target" \
                -f message="Archive compressed research-only market consensus" \
                -f content="$body" >/dev/null 2>&1; then
                archived=true
                break
              fi
            fi
            echo "Market-history Git commit conflict: retry $attempt"
            sleep "$((attempt*2))"
          done
          if [ "$archived" != true ]; then
            echo "MARKET_HISTORY_ARCHIVE_FAILED" >&2
            exit 1
          fi
          echo "Saved market historical snapshot: $history_target"
          latest_updated=false
          for attempt in 1 2 3 4 5; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/market/latest.json" --jq '.sha' 2>/dev/null || true)"
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/market/latest.json" \
                --jq '.content' | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/current-market.json"
            else
              sha=""
              rm -f "$RUNNER_TEMP/current-market.json"
            fi
            decision="$(python ops/market_archive_guard.py \
              --current "$RUNNER_TEMP/current-market.json" \
              --incoming market/market-result.json | \
              python -c 'import json,sys; print("yes" if json.load(sys.stdin)["safe_update"] else "no")')"
            if [ "$decision" = no ]; then
              echo "Current market snapshot is already same or newer; no overwrite"
              latest_updated=true
              break
            fi
            body="$(base64 -w0 market/market-result.json)"
            if [ -n "$sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/market/latest.json" \
                  -f message="Refresh verified derived 1X2 market probabilities" \
                  -f sha="$sha" -f content="$body" >/dev/null 2>&1; then
                latest_updated=true
                break
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/market/latest.json" \
                  -f message="Create verified derived 1X2 market probabilities" \
                  -f content="$body" >/dev/null 2>&1; then
                latest_updated=true
                break
              fi
            fi
            echo "Market latest changed during upload; re-fetch/re-validate ($attempt)"
            sleep "$((attempt*2))"
          done
          if [ "$latest_updated" != true ]; then
            echo "LATEST_MARKET_COMMIT_FAILED" >&2
            exit 1
          fi

  alert:
    needs: [collect, archive]
    if: ${{ always() && (needs.collect.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：免費賠率 API 接駁或配額異常"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費賠率 API 接駁或配額異常") | .number' | head -n1)"
          description="The Odds API 步驟未完成；冇任何 Key 會顯示。請查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$description"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$description"
          fi

  clear_alert:
    needs: [collect, archive]
    if: ${{ needs.collect.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close recovered market alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費賠率 API 接駁或配額異常") | .number' | head -n1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "真實免費市場採集及存檔重新通過驗收。"
          fi
