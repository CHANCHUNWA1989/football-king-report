name: 足球王者 V4.1｜免費賠率市場研究及配額保護

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-odds.yml'
  schedule:
    # 香港時間 09:07、21:07。GitHub cron 可能延遲。
    - cron: '7 1,13 * * *'

concurrency:
  group: football-king-free-market-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout source (no API secret at this stage)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent safety tests without any API secret
        run: python -m unittest discover -s ops/tests -q

      - name: Read free quota and fetch EU three-way market (max six credits)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          # Credentials are visible to this ONE collection step only.
          # /v4/sports is free; only region=eu, market=h2h is billable.
          python ops/odds_market.py --mode collect --output market-result.json
          test -s market-result.json

      - name: Transfer derived probabilities, never raw bookmaker prices
        uses: actions/upload-artifact@v4
        with:
          name: football-king-derived-market
          path: market-result.json
          retention-days: 7
          if-no-files-found: error

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download derived market report without the API key
        uses: actions/download-artifact@v4
        with:
          name: football-king-derived-market
          path: market

      - name: Store history and latest derived consensus snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s market/market-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path("market/market-result.json").read_text(encoding="utf-8"))
          assert value["production_recommendations"]=="DISABLED"
          assert value["status"] in ("RESEARCH_ONLY", "HOLD")
          assert not any("bookmakers" in item or "price" in item
                         for item in value.get("events", []))
          PY
          today="$(date -u +'%Y/%m/%d')"
          encoded="$(base64 -w0 market/market-result.json)"
          for dest in "market/latest.json" "market/history/$today/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f message="Update non-executable derived 1X2 research snapshot" \
                -f sha="$sha" -f content="$encoded" >/dev/null
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f message="Archive derived 1X2 probabilities, no sportsbook prices" \
                -f content="$encoded" >/dev/null
            fi
            echo "Saved derived-only market file: $dest"
          done

  alert:
    needs: [collect, archive]
    if: ${{ always() && (needs.collect.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：免費賠率 API 接駁或配額異常"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費賠率 API 接駁或配額異常") | .number' | head -n1)"
          description="The Odds API 步驟未完成；冇任何 Key 會顯示。請查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$description"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$description"
          fi

  clear_alert:
    needs: [collect, archive]
    if: ${{ needs.collect.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close recovered market alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費賠率 API 接駁或配額異常") | .number' | head -n1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "真實免費市場採集及存檔重新通過驗收。"
          fi
