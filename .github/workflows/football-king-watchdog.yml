name: 足球王者｜網站更新與健康監控

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-watchdog.yml'
      - 'ops/watchdog.py'
      - 'ops/tests/test_watchdog.py'
      - 'ops/market_pair.py'
      - 'ops/release_guard.py'
      - 'ops/source_overlay.py'
      - 'ops/source_publish_guard.py'
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 取得監控程式
        uses: actions/checkout@v4

      - name: 測試監控防護邏輯
        run: python -m unittest discover -s ops/tests -q

      - name: 檢查網站、新鮮度、免費賠率及嚴格配對完整性
        run: |
          python ops/watchdog.py \
            --base "https://${{ github.repository_owner }}.github.io/football-king-report/" \
            --max-age-hours 10

      - name: 開立或更新網站異常通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：網站更新或品質異常"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：網站更新或品質異常") | .number' | head -n 1)"
          detail="網站監控未通過；可能是網站不可用、報告超過10小時未更新、來源處於HOLD或品質檢查異常。請查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$detail"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$detail"
          fi

      - name: 恢復後關閉網站異常通知
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：網站更新或品質異常") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "網站品質與更新時間已重新通過監控。"
          fi
