name: Research paired bootstrap benchmark tests

on:
  pull_request:
    paths:
      - "ops/open_source_paired_benchmark.py"
      - "ops/tests/test_open_source_paired_benchmark.py"
      - ".github/workflows/research-paired-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s ops/tests -p test_open_source_paired_benchmark.py -v
      - name: Verify offline benchmark on sealed evidence
        run: python -m ops.open_source_paired_benchmark --input evidence/settled.json
