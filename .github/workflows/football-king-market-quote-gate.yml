name: 足球王者｜即時賠率時間戳品質門檻
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/market_quote_gate.py'
      - 'ops/market_coverage_audit.py'
      - 'ops/tests/test_market_coverage_audit.py'
      - 'ops/private_multi_market_audit.py'
      - 'ops/opt_in_multi_market_sample.py'
      - 'ops/tests/test_market_quote_gate.py'
      - 'ops/tests/test_private_multi_market_audit.py'
      - 'ops/tests/test_opt_in_multi_market_sample.py'
      - '.github/workflows/football-king-market-quote-gate.yml'
permissions:
  contents: read
jobs:
  quote_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify market-level quote freshness and quarter-line guards
        run: |
          python -m unittest discover -s ops/tests -p 'test_market_quote_gate.py' -v
          python -m unittest discover -s ops/tests -p 'test_market_coverage_audit.py' -v
          python -m unittest discover -s ops/tests -p 'test_live_market_research.py' -v
          python -m unittest discover -s ops/tests -p 'test_private_multi_market_audit.py' -v
          python -m unittest discover -s ops/tests -p 'test_opt_in_multi_market_sample.py' -v
      - name: Check archived live market coverage without using provider credits
        run: |
          python ops/market_coverage_audit.py --market market/latest.json \
            --summary market/private_summary_latest.json \
            --output "$RUNNER_TEMP/market-coverage.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "market-coverage.json").read_text())
          assert report["production_recommendations"] == "DISABLED"
          assert report["market_coverage_complete"] is False
          assert report["handicap_available"] is False
          assert report["totals_available"] is False
          assert not report["raw_prices_verified"]
          assert "spreads" in report["missing_markets"]
          assert "totals" in report["missing_markets"]
          print("Observed markets:", report["public_consensus_observed_markets"])
          print("Not actually observed:", report["missing_markets"])
          PY
      - name: Assert no network access, bet advice, or API credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path("ops/market_quote_gate.py").read_text()
          assert "urllib.request" not in c
          assert "requests.get" not in c
          assert "production_recommendations" in c
          assert "market_last_update_utc" in c
          PY
