name: Research archived raw cohort replay (HOLD)
on:
  pull_request:
    branches:
      - research/intelligence-x-ten-case-linkage-gate-20261125
    paths:
      - 'research/intelligence_x/replay_archived_raw_cohort.py'
      - '.github/workflows/research-archived-raw-cohort-replay.yml'
permissions:
  contents: read
  attestations: read
jobs:
  archived-raw-replay:
    if: github.head_ref == 'research/intelligence-x-raw-cohort-replay-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e8054c34708295aae7227bc6c08429fdb8f02d30
          path: archive-input
          sparse-checkout: openliga_capture_provenance/2026/11/21/44886279496-1
          persist-credentials: false
      - name: Compile fixed replay helper
        run: python -m py_compile research/intelligence_x/replay_archived_raw_cohort.py
      - name: Reverify historical signature and replay original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python research/intelligence_x/replay_archived_raw_cohort.py
