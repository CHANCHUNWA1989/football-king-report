name: Football forecast settlement report
on:
  schedule:
    - cron: '40 1 * * *' # 09:40 Hong Kong time (UTC+8)
  workflow_dispatch:
    inputs:
      ledger_path:
        description: 'Committed relative JSONL forecast ledger'
        required: true
        type: string
      results_path:
        description: 'Committed relative CSV results'
        required: true
        type: string
permissions:
  contents: read
jobs:
  offline-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate paths and score forecasts
        env:
          LEDGER_PATH: ${{ inputs.ledger_path || 'data/forecasts.jsonl' }}
          RESULTS_PATH: ${{ inputs.results_path || 'data/results.csv' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ops.offline_1x2_ledger_settlement import settle_ledger
          root=Path.cwd().resolve()
          scheduled=os.environ.get("GITHUB_EVENT_NAME")=="schedule"
          validated={}
          for key,suffix in (("LEDGER_PATH",".jsonl"),("RESULTS_PATH",".csv")):
              value=Path(os.environ[key])
              if value.is_absolute() or ".." in value.parts or value.suffix.lower()!=suffix:
                  raise SystemExit(f"{key}: unsafe file path")
              resolved=value.resolve()
              if not resolved.is_relative_to(root):
                  raise SystemExit(f"{key}: file outside repository")
              if not resolved.is_file():
                  if scheduled:
                      Path("football-settlement-report.json").write_text(json.dumps({"status":"NO_DATA","reason":"Committed forecast ledger or results missing","real_betting_enabled":False},indent=2))
                      raise SystemExit(0)
                  raise SystemExit(f"{key}: missing file in repository")
              validated[key]=resolved
          report=settle_ledger(validated["LEDGER_PATH"],validated["RESULTS_PATH"])
          Path("football-settlement-report.json").write_text(json.dumps(report,indent=2,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-settlement-report
          path: football-settlement-report.json
          retention-days: 14
