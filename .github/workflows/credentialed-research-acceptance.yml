name: Credentialed research acceptance (manual main only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-king-six-free-upgrade
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline safety tests without credentials
        run: python -m unittest discover -s ops/tests -p 'test_live_core_credentialed_acceptance.py' -v
      - name: Read-only provider acceptance (no publication)
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python ops/live_core_credentialed_acceptance.py
