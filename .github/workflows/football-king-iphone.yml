name: Football King V4.1 iPhone Daily Report
# 賠率 API Key 只供獨立免費賠率流程使用；此網站發佈流程絕不取得密鑰。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-iphone.yml'
      - 'packages/football_king_v4_1_iphone_verified.zip'
      - 'ops/**'
      - '!ops/tests/**'
  schedule:
    - cron: '17 1,7,13,19 * * *'  # 香港時間每日 09:17、15:17、21:17、03:17

concurrency:
  group: football-king-iphone-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout trusted program and safety modules
        uses: actions/checkout@v4

      - name: Verify original V4.1 package against known SHA-256
        run: |
          set -euo pipefail
          test -s packages/football_king_v4_1_iphone_verified.zip
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -

      - name: Unpack actual V4.1 project
        run: |
          set -euo pipefail
          mkdir -p app _unpacked
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d _unpacked
          test -f _unpacked/football_king_v4_1/daily_publish.py
          cp -a _unpacked/football_king_v4_1/. app/
          test -f app/healthcheck.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run original V4.1 unit tests
        working-directory: app
        run: python -m unittest discover -s tests -q

      - name: Run all independent fail-closed protection tests
        run: python -m unittest discover -s ops/tests -q

      - name: Fetch public fixtures and build research site
        shell: bash
        working-directory: app
        run: |
          set +e
          python daily_publish.py --site site --report data/daily_report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s site/index.html
          test -s site/status.json
          test -s site/report.json

      - name: Audit public fixture quality
        run: python ops/quality_gate.py --site app/site

      - name: Cross-check Bundesliga finished scores against a separate public publisher
        run: python ops/source_crosscheck.py --site app/site

      - name: Score market comparison evidence without fabricated quotes
        run: python ops/model_evidence.py --site app/site --input inputs/shadow_predictions.csv

      - name: Generate strictly pre-match shadow probabilities
        run: |
          python ops/shadow_forecast.py --output app/site/shadow.json \
            --finished-output "$RUNNER_TEMP/finished_results.json"
          test -s "$RUNNER_TEMP/finished_results.json"

      - name: Freeze fixed candidate B on exact same pre-match probabilities and clock
        run: python ops/model_ab.py --site app/site

      - name: Pair only preceding valid market snapshots with model research
        run: |
          python ops/market_pair.py --site app/site --market market/latest.json
          test -s app/site/market_status.json
          test -s app/site/market_comparison.json

      - name: Independently audit six-league scheduled kickoffs (not final scores)
        run: python ops/league_coverage.py --site app/site --market market/latest.json

      - name: Score archived strictly pre-match research only after confirmed finals
        run: |
          python ops/forward_validation.py --site app/site \
            --archives research_pairs --previous evidence/settled.json \
            --output "$RUNNER_TEMP/settled.json" \
            --result-input "$RUNNER_TEMP/finished_results.json"
          test -s "$RUNNER_TEMP/settled.json"

      - name: Build complete six-league accuracy, calibration, A/B and coverage dashboard data
        run: python ops/research_center.py --site app/site --evidence "$RUNNER_TEMP/settled.json"

      - name: Enforce nine independent production qualification conditions
        run: python ops/production_gate.py --site app/site --evidence "$RUNNER_TEMP/settled.json"

      - name: Add iPhone league filters, market comparison and HOLD status
        run: python ops/mobile_dashboard.py --site app/site

      - name: Make freshness and visible warning fail-closed
        run: python ops/release_guard.py --site app/site

      - name: Seal public as-of research snapshot
        run: |
          python ops/snapshot.py --site app/site \
            --output "$RUNNER_TEMP/asof.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          cp app/site/shadow.json "$RUNNER_TEMP/shadow.json"
          cp app/site/market_comparison.json "$RUNNER_TEMP/paired.json"
          test -s "$RUNNER_TEMP/asof.json"
          test -s "$RUNNER_TEMP/shadow.json"
          test -s "$RUNNER_TEMP/paired.json"
          test -s "$RUNNER_TEMP/settled.json"

      - name: Validate V4.1 public site safety
        shell: bash
        working-directory: app
        run: |
          set +e
          python healthcheck.py --site site
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Explain current observed coverage honestly
        working-directory: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('site/status.json').read_text(encoding='utf-8'))
          quality = json.loads(Path('site/quality.json').read_text(encoding='utf-8'))
          model = json.loads(Path('site/shadow.json').read_text(encoding='utf-8'))
          validated = json.loads(Path('site/validation.json').read_text(encoding='utf-8'))
          print('=== 實際來源與預測證據（研究用途）===')
          for name, obj in [('status', state), ('quality', quality), ('shadow', model), ('validation', validated)]:
              if name == 'shadow':
                  obj = {k: v for k, v in obj.items() if k != 'predictions'}
              print(name, json.dumps(obj, ensure_ascii=False))
          assert state['production_recommendations'] == 'DISABLED'
          assert validated['status'] == 'HOLD'
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile report and public quality evidence
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/site

      - name: Deploy mobile site
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Transfer research snapshots to least-privilege archive job
        uses: actions/upload-artifact@v4
        with:
          name: football-king-research-snapshots
          path: |
            ${{ runner.temp }}/asof.json
            ${{ runner.temp }}/shadow.json
            ${{ runner.temp }}/paired.json
            ${{ runner.temp }}/settled.json
          if-no-files-found: error
          retention-days: 7

      - name: Archive internal diagnostics temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-king-v4-1-diagnostics
          path: |
            app/data/daily_report.json
            app/site/status.json
            app/site/quality.json
            app/site/validation.json
            app/site/market_status.json
            app/site/research_center.json
            app/site/production_gate.json
            app/site/league_coverage.json
            app/site/ab_status.json
          if-no-files-found: warn
          retention-days: 14

  archive:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout trusted evidence-merging code
        uses: actions/checkout@v4

      - name: Download immutable run-scoped research observations
        uses: actions/download-artifact@v4
        with:
          name: football-king-research-snapshots
          path: snapshot

      - name: Archive research snapshots with optimistic concurrency retries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in asof shadow paired settled; do
            test -s "snapshot/$name.json"
          done
          # Separate the three immutable run files from cumulative evidence writes.
          upload_commit() {
            local target="$1"
            local payload="$2"
            local message="$3"
            local sha
            for attempt in 1 2 3 4 5; do
              sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$target" --jq '.sha' 2>/dev/null || true)"
              if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then sha=""; fi
              if [ -n "$sha" ]; then
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$target" \
                  -f message="$message" -f sha="$sha" -f content="$payload" >/dev/null 2>&1; then
                  echo "Saved research file: $target"
                  return 0
                fi
              else
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$target" \
                  -f message="$message" -f content="$payload" >/dev/null 2>&1; then
                  echo "Saved research file: $target"
                  return 0
                fi
              fi
              echo "Concurrent write retry $attempt for $target"
              sleep "$((attempt * 2))"
            done
            echo "Failed to archive after five retries: $target" >&2
            return 1
          }
          archive_day="$(date -u +'%Y/%m/%d')"
          for kind in asof shadow paired; do
            gzip -n -c "snapshot/$kind.json" > "$RUNNER_TEMP/$kind.json.gz"
            if [ "$kind" = asof ]; then
              folder="history"
            elif [ "$kind" = paired ]; then
              folder="research_pairs"
            else
              folder="shadow"
            fi
            archive_path="$folder/$archive_day/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.gz"
            upload_commit "$archive_path" "$(base64 -w0 "$RUNNER_TEMP/$kind.json.gz")" \
              "Save research observation for run $GITHUB_RUN_ID ($kind)"
          done
          # Merge against the latest branch version on EVERY retry. Never overwrite
          # a newer settled record with a stale workflow checkout copy.
          saved=false
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" --jq '.sha' 2>/dev/null || true)"
            if [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                --jq '.content' | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/current-settled.json"
              python ops/evidence_merge.py \
                --current "$RUNNER_TEMP/current-settled.json" \
                --incoming snapshot/settled.json \
                --output "$RUNNER_TEMP/merged-settled.json"
            else
              current_sha=""
              rm -f "$RUNNER_TEMP/current-settled.json"
              python ops/evidence_merge.py \
                --current "$RUNNER_TEMP/current-settled.json" \
                --incoming snapshot/settled.json \
                --output "$RUNNER_TEMP/merged-settled.json"
            fi
            added="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["newly_settled"])' "$RUNNER_TEMP/merged-settled.json")"
            if [ "$added" -eq 0 ] && [ -n "$current_sha" ]; then
              echo "Evidence already includes all sealed observations"
              saved=true
              break
            fi
            encoded="$(base64 -w0 "$RUNNER_TEMP/merged-settled.json")"
            if [ -n "$current_sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                  -f message="Safely merge forward-only research settlements" \
                  -f sha="$current_sha" -f content="$encoded" >/dev/null 2>&1; then
                saved=true
                break
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                  -f message="Initialize protected forward-only research settlements" \
                  -f content="$encoded" >/dev/null 2>&1; then
                saved=true
                break
              fi
            fi
            echo "Settled evidence concurrently changed: re-fetching, merging and retrying ($attempt)"
            sleep "$((attempt * 2))"
          done
          if [ "$saved" != true ]; then
            echo "Failed to merge cumulative evidence after five attempts" >&2
            exit 1
          fi

  notify_failure:
    needs: [publish, archive]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：每日研究或歷史存檔失敗"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：每日研究或歷史存檔失敗") | .number' | head -n 1)"
          detail="資料採集、網站發布或歷史封存出錯。請查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID 。正式投注仍然停用。"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$detail"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$detail"
          fi

  close_resolved_incident:
    needs: [publish, archive]
    if: ${{ needs.publish.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close recovered incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：每日研究或歷史存檔失敗") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "完整研究、發布和封存已經恢復正常。"
          fi
