name: Football King V4.1 iPhone Daily Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-iphone.yml'
      - 'packages/football_king_v4_1_iphone_verified.zip'
  schedule:
    - cron: '17 1,7,13,19 * * *'  # 香港時間 09:17、15:17、21:17、03:17

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: football-king-iphone-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check original V4.1 package from repository
        run: |
          test -s packages/football_king_v4_1_iphone_verified.zip
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -

      - name: Unpack actual Python project
        run: |
          mkdir -p app _unpacked
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d _unpacked
          test -f _unpacked/football_king_v4_1/daily_publish.py
          cp -a _unpacked/football_king_v4_1/. app/
          test -f app/healthcheck.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run V4.1 unit tests
        working-directory: app
        run: python -m unittest discover -s tests -q

      - name: Check quality and snapshot regression tests
        run: python -m unittest discover -s ops/tests -q

      - name: Fetch public fixtures and build report (HOLD is allowed)
        shell: bash
        working-directory: app
        run: |
          set +e
          python daily_publish.py --site site --report data/daily_report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s site/index.html
          test -s site/status.json
          test -s site/report.json

      - name: Show actual data collection results
        working-directory: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('site/status.json').read_text(encoding='utf-8'))
          print('=== V4.1 VERIFIED RUN (NOT BETTING RECOMMENDATIONS) ===')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          for row in json.loads(Path('data/daily_report.json').read_text(encoding='utf-8')).get('fixture_source_records', []):
              print('LEAGUE:', row.get('league'), 'SOURCE:', row.get('source'),
                    'STATUS:', row.get('status'), 'REASON:', row.get('reason'),
                    'WINDOW_MATCHES:', row.get('window_matches'))
          print('NETWORK_DATA_PASS:', bool(status.get('public_fixture_sources_success', 0) > 0
                                           and status.get('window_matches', 0) > 0))
          PY

      - name: Audit source quality and fail closed if needed
        run: python ops/quality_gate.py --site app/site

      - name: Prepare point-in-time public research snapshot
        run: |
          python ops/snapshot.py --site app/site \
            --output "$RUNNER_TEMP/football-king-asof.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate published report safety
        shell: bash
        working-directory: app
        run: |
          set +e
          python healthcheck.py --site site
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload phone website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Save internal diagnostics (do not publish to Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-king-v4-1-diagnostics
          path: |
            app/data/daily_report.json
            app/site/status.json
          if-no-files-found: warn

      - name: Archive point-in-time public research observation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/football-king-asof.json"
          archive_day="$(date -u +'%Y/%m/%d')"
          archive_path="history/$archive_day/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          encoded="$(base64 -w0 "$RUNNER_TEMP/football-king-asof.json")"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$archive_path" \
            -f message="Archive public research snapshot for run $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null
          echo "Public research-only as-of saved to $archive_path"

      - name: Open or update failure alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：雲端自動流程異常"
          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：雲端自動流程異常") | .number' | head -n 1)"
          detail="自動流程出現失敗。請檢查：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$detail"
          else
            gh issue create --title "$title" --body "$detail"
          fi
