name: Football King V4.1 iPhone Daily Report
# 賠率 API Key 只供獨立免費賠率流程使用；此網站發佈流程絕不取得密鑰。

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Football King private all-market research']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-iphone.yml'
      - 'packages/football_king_v4_1_iphone_verified.zip'
      - 'ops/**'
      - '!ops/tests/**'
      - 'sources/latest.json'
      - 'sources/bsd_status_latest.json'
      - 'sources/bsd_market_latest.json'
      - 'sources/weather_latest.json'  # no-key MET Norway city-centre context; GITHUB_TOKEN archive won't auto-chain Actions  # 額外合法資料更新後刷新 iPhone 網站；無任何API密鑰
      - 'sources/wide_latest.json'  # 全球大小聯賽免費來源自動更新手機研究檢視
      - 'sources/research_extensions_latest.json'  # 新增免費研究來源審核後更新網站，不需要任何Key
      - 'market/private_summary_latest.json'  # public, de-identified private feed counts only
      - 'market/japan_free_status.json'  # 僅 J1 免費 API 合法公開元數據，不含 bookmaker raw prices
  schedule:
    - cron: '17 1,7,13,19 * * *'  # 香港時間每日 09:17、15:17、21:17、03:17

concurrency:
  group: football-king-iphone-pages
  cancel-in-progress: false

jobs:
  publish:
    # A failed/outage private-collector run may not trigger an apparent successful refresh.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout trusted program and safety modules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify original V4.1 package against known SHA-256
        run: |
          set -euo pipefail
          test -s packages/football_king_v4_1_iphone_verified.zip
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -

      - name: Unpack actual V4.1 project
        run: |
          set -euo pipefail
          mkdir -p app _unpacked
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d _unpacked
          test -f _unpacked/football_king_v4_1/daily_publish.py
          cp -a _unpacked/football_king_v4_1/. app/
          test -f app/healthcheck.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Align outdated V4.1 stale-report test with fail-closed HOLD
        run: python ops/legacy_v41_test_compat.py --app app

      - name: Run all V4.1 unit tests with explicitly corrected stale-report expectation
        working-directory: app
        run: python -m unittest discover -s tests -q

      - name: Run all independent fail-closed protection tests
        run: python -m unittest discover -s ops/tests -q

      - name: Fetch public fixtures and build research site
        shell: bash
        working-directory: app
        run: |
          set +e
          python daily_publish.py --site site --report data/daily_report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s site/index.html
          test -s site/status.json
          test -s site/report.json

      - name: Audit public fixture quality
        run: python ops/quality_gate.py --site app/site

      - name: Cross-check Bundesliga finished scores against a separate public publisher
        run: python ops/source_crosscheck.py --site app/site

      - name: Score market comparison evidence without fabricated quotes
        run: python ops/model_evidence.py --site app/site --input inputs/shadow_predictions.csv

      - name: Generate strictly pre-match shadow probabilities
        run: |
          python ops/shadow_forecast.py --output app/site/shadow.json \
            --finished-output "$RUNNER_TEMP/finished_results.json"
          test -s "$RUNNER_TEMP/finished_results.json"

      - name: Show newly integrated optional free-source coverage on research site
        run: |
          python ops/source_overlay.py --site app/site --input sources/latest.json
          test -s app/site/extra_sources.json

      - name: Reflect extra legal free API readiness and historical catalog on mobile
        run: |
          python ops/free_extension_overlay.py --site app/site \
            --input sources/research_extensions_latest.json
          test -s app/site/free_research_extensions.json
          # Output is research metadata only; no raw API secrets, market odds or
          # 2026 live xG claims are admitted by the release guard.

      - name: Add two no-key worldwide and lower-league research sources (no model training)
        run: |
          python ops/wide_overlay.py --site app/site --input sources/wide_latest.json
          test -s app/site/wide_leagues.json

      - name: Publish audited free schedule failover status
        run: |
          python ops/free_source_failover.py --site app/site
          test -s app/site/free_source_failover.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/site/free_source_failover.json').read_text())
          assert data['production_recommendations'] == 'DISABLED'
          assert data['executable_odds_fallback_available'] is False
          assert data['status'] in ('PRIMARY_SCHEDULE_ONLY', 'BACKUP_SCHEDULE_ONLY', 'NO_VERIFIED_SCHEDULE_SOURCE')
          PY

      - name: Freeze fixed candidate B on exact same pre-match probabilities and clock
        run: python ops/model_ab.py --site app/site

      - name: Publish sourced free Norwegian city weather context (never a model input)
        run: |
          python ops/met_weather_overlay.py --site app/site --input sources/weather_latest.json
          test -s app/site/weather_context.json

      - name: Add isolated BSD free-consensus market backup research (never replace original)
        run: |
          python ops/bsd_overlay.py --site app/site --input sources/bsd_market_latest.json --status sources/bsd_status_latest.json
          test -s app/site/bsd_backup.json

      - name: Pair only preceding valid market snapshots with model research
        run: |
          python ops/market_pair.py --site app/site --market market/latest.json
          test -s app/site/market_status.json
          test -s app/site/market_comparison.json

      - name: Publish Japan J1 free source readiness without exposing commercial raw odds
        run: |
          python ops/japan_market_overlay.py --site app/site \
            --source market/japan_free_status.json
          test -s app/site/japan_free_market.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("app/site/japan_free_market.json").read_text())
          assert d["production_recommendations"]=="DISABLED"
          assert d["bet_recommendation_count"]==0
          assert d["public_market_prices_or_recommendations_available"] is False
          assert d["raw_bookmaker_prices_or_names_redistributed"] is False
          assert len(d["j1_free_prematch_sources"])==3
          PY

      - name: Publish fail-closed research market consensus fallback diagnostic
        run: |
          python ops/research_market_failover.py --site app/site
          test -s app/site/research_market_failover.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("app/site/research_market_failover.json").read_text())
          assert data["production_recommendations"]=="DISABLED"
          assert data["executable_bookmaker_quote_available"] is False
          assert data["positive_ev_verified"] is False
          assert data["automatic_primary_market_substitution"] is False
          PY

      - name: Discover worldwide public football leagues without treating metadata as verified forecasts
        run: |
          python ops/global_league_catalog.py --site app/site
          test -s app/site/global_league_catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("app/site/global_league_catalog.json").read_text())
          assert c["schema"]=="football-king-global-league-catalog-v1"
          assert c["production_recommendations"]=="DISABLED"
          assert c["executable_odds_confirmed"] is False
          assert c["all_world_leagues_complete"] is False
          assert c["catalogued_leagues"] >= 20
          PY

      - name: Collect real worldwide historical results and two-publisher fixture observations
        run: |
          python ops/worldwide_source_builder.py --site app/site \
            --catalogue app/site/global_league_catalog.json \
            --market market/latest.json \
            --output "$RUNNER_TEMP/worldwide_verified_latest.json"
          test -s "$RUNNER_TEMP/worldwide_verified_latest.json"
          test -s app/site/worldwide_source_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("app/site/worldwide_source_status.json").read_text())
          assert status["schema"]=="football-king-worldwide-source-build-status-v1"
          assert status["production_recommendations"]=="DISABLED"
          assert status["request_count"] <= status["request_budget"]
          inputs=json.loads(Path(__import__("os").environ["RUNNER_TEMP"]).joinpath(
              "worldwide_verified_latest.json").read_text())
          assert inputs["production_recommendations"]=="DISABLED"
          PY

      - name: Run separate league-agnostic Shadow model only with corroborated timestamps
        run: |
          python ops/worldwide_shadow.py --site app/site \
            --input "$RUNNER_TEMP/worldwide_verified_latest.json"
          test -s app/site/worldwide_shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("app/site/worldwide_shadow.json").read_text())
          assert x["production_recommendations"]=="DISABLED"
          assert x["model_calibrated"] is False
          assert x["market_odds_available"] is False
          assert x["positive_ev_verified"] is False
          PY

      - name: Merge global Shadow output into searchable league catalogue without another API query
        run: |
          python ops/global_league_catalog.py --site app/site --merge-worldwide
          test -s app/site/global_league_catalog.json

      - name: Independently audit six-league scheduled kickoffs (not final scores)
        run: python ops/league_coverage.py --site app/site --market market/latest.json

      - name: Score archived strictly pre-match research only after confirmed finals
        run: |
          python ops/forward_validation.py --site app/site \
            --archives research_pairs --previous evidence/settled.json \
            --output "$RUNNER_TEMP/settled.json" \
            --result-input "$RUNNER_TEMP/finished_results.json"
          test -s "$RUNNER_TEMP/settled.json"

      - name: Independently cross-check finished scores using only safe free-source observations
        run: |
          python ops/independent_results.py --site app/site \
            --evidence "$RUNNER_TEMP/settled.json" --sources sources/latest.json
          test -s app/site/independent_results.json

      - name: Build complete six-league accuracy, calibration, A/B and coverage dashboard data
        run: python ops/research_center.py --site app/site --evidence "$RUNNER_TEMP/settled.json"

      - name: Enforce nine independent production qualification conditions
        run: python ops/production_gate.py --site app/site --evidence "$RUNNER_TEMP/settled.json"

      - name: Audit sealed pre-match Asian spread prices versus exact two-publisher FT scores
        run: |
          # Never commit proprietary bookmaker quote bodies or redistribute raw odds.
          # Only a permitted, private runner-local sanitized quote snapshot can be read.
          python ops/handicap_forward_pipeline.py --site app/site \
            --quotes "$RUNNER_TEMP/authorized_asian_quote_audit.json" \
            --sources sources/latest.json
          test -s app/site/handicap_forward_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('app/site/handicap_forward_audit.json').read_text())
          assert d["production_recommendations"]=="DISABLED"
          assert d["licensed_executable_prices_confirmed"] is False
          assert d["genuine_forward_market_roi_verified"] is False
          assert d["no_raw_bookmaker_quotes_redistributed"] is True
          assert d["bets_authorized"]==0
          PY

      - name: Publish evidence gaps without upgrading research into a betting tip
        run: |
          python ops/evidence_progress.py --site app/site
          test -s app/site/evidence_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("app/site/evidence_progress.json").read_text())
          assert d["schema"]=="football-king-evidence-progress-v1"
          assert d["status"]=="HOLD"
          assert d["positive_ev_betting_confirmed"] is False
          assert d["automatic_bets_allowed"] is False
          assert d["production_recommendations"]=="DISABLED"
          PY

      - name: Cross-check fresh free independent UTC kickoffs and quarantine discrepancies
        run: |
          python ops/fixture_consensus.py --site app/site \
            --secondary sources/latest.json --wide sources/wide_latest.json
          test -s app/site/fixture_integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("app/site/fixture_integrity.json").read_text(encoding="utf-8"))
          extra=json.loads(Path("app/site/extra_sources.json").read_text(encoding="utf-8"))
          assert audit["production_recommendations"] == "DISABLED"
          assert audit["blocked_from_research_recommendations"] is True
          assert audit["no_independent_result_verification_claim"] is True
          assert extra["can_replace_market_1x2"] is False
          print("Independent fixture audit:", audit["status"],
                "agreed observations:", audit["independent_kickoff_agreement_observations"],
                "affected fixtures:", audit["affected_fixtures"])
          print("No-key/API-key extra sources:",
                {p["provider"]: p["sampled_fixture_count"] for p in extra["providers"]})
          PY

      - name: Rank explainable HOME DRAW AWAY research candidates from time-verified forecasts
        run: |
          python ops/research_recommender.py --site app/site
          test -s app/site/research_selections.json

      - name: Audit research shortlist versus executable betting eligibility without inventing odds
        run: |
          python ops/betting_readiness.py --site app/site
          test -s app/site/betting_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("app/site/betting_readiness.json").read_text())
          assert audit["schema"]=="football-king-betting-readiness-audit-v1"
          assert audit["status"]=="HOLD"
          assert audit["production_recommendations"]=="DISABLED"
          assert audit["bet_recommendation_count"]==0
          assert audit["genuine_positive_expected_value_verified"] is False
          assert audit["bookmaker_executable_1x2_price_available"] is False
          assert audit["never_infer_decimal_odds_from_consensus_probabilities"] is True
          PY

      - name: Add iPhone league filters, market comparison and HOLD status
        run: python ops/mobile_dashboard.py --site app/site

      - name: Render searchable global league directory with honest source qualification
        run: |
          python ops/global_league_widget.py --site app/site
          test -s app/site/global_league_catalog.js
          test -s app/site/global_league_catalog.css
          grep -q 'id="fk-worldwide-directory"' app/site/index.html
          grep -q '未通過核實' app/site/index.html

      - name: Add independently labeled German near-live community score board
        run: |
          python ops/german_live_widget.py --site app/site
          test -s app/site/german_live.js
          test -s app/site/german_live.css
          grep -q 'id="fk-german-live"' app/site/index.html

      - name: Publish source-grounded official recommendation readiness and remaining gaps
        run: |
          python -m ops.public_readiness_site --site app/site \
            --settled evidence/settled.json \
            --gates sources/seven_quality_gates_latest.json \
            --market market/latest.json
          test -s app/site/official_readiness.json
          grep -q 'id="fk-official-readiness"' app/site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          progress=json.loads(Path("app/site/official_readiness.json").read_text(encoding="utf-8"))
          assert progress["production_recommendations"] == "DISABLED"
          assert progress["status"] == "HOLD"
          assert progress["official_recommendation_count"] == 0
          assert progress["result_rows_marked_independently_verified"] <= progress["recorded_settled_cases"]
          PY

      - name: Publish six-league hypothetical Asian handicap and totals research (not actual bookmaker lines)
        run: |
          python -m ops.all_market_scenarios --site app/site
          test -s app/site/all_market_scenarios.json
          grep -q 'id="fk-all-market-hypotheses"' app/site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("app/site/all_market_scenarios.json").read_text(encoding="utf-8"))
          assert report["production_recommendations"]=="DISABLED"
          assert report["model_calibrated"] is False
          assert report["hypothetical_lines_only"] is True
          assert report["market_quotes_observed"] is False
          assert report["recommended_bets"]==[]
          PY

      - name: Make freshness and visible warning fail-closed
        run: python ops/release_guard.py --site app/site

      - name: Seal public as-of research snapshot
        run: |
          python ops/snapshot.py --site app/site \
            --output "$RUNNER_TEMP/asof.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          cp app/site/shadow.json "$RUNNER_TEMP/shadow.json"
          cp app/site/worldwide_shadow.json "$RUNNER_TEMP/worldwide.json"
          cp app/site/market_comparison.json "$RUNNER_TEMP/paired.json"
          test -s "$RUNNER_TEMP/asof.json"
          test -s "$RUNNER_TEMP/shadow.json"
          test -s "$RUNNER_TEMP/worldwide.json"
          test -s "$RUNNER_TEMP/paired.json"
          test -s "$RUNNER_TEMP/settled.json"

      - name: Validate V4.1 public site safety
        shell: bash
        working-directory: app
        run: |
          set +e
          python healthcheck.py --site site
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Explain current observed coverage honestly
        working-directory: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('site/status.json').read_text(encoding='utf-8'))
          quality = json.loads(Path('site/quality.json').read_text(encoding='utf-8'))
          model = json.loads(Path('site/shadow.json').read_text(encoding='utf-8'))
          validated = json.loads(Path('site/validation.json').read_text(encoding='utf-8'))
          print('=== 實際來源與預測證據（研究用途）===')
          for name, obj in [('status', state), ('quality', quality), ('shadow', model), ('validation', validated)]:
              if name == 'shadow':
                  obj = {k: v for k, v in obj.items() if k != 'predictions'}
              print(name, json.dumps(obj, ensure_ascii=False))
          assert state['production_recommendations'] == 'DISABLED'
          assert validated['status'] == 'HOLD'
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload mobile report and public quality evidence
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: app/site

      - name: Deploy mobile site
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Transfer research snapshots to least-privilege archive job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-research-snapshots
          path: |
            ${{ runner.temp }}/asof.json
            ${{ runner.temp }}/shadow.json
            ${{ runner.temp }}/worldwide.json
            ${{ runner.temp }}/paired.json
            ${{ runner.temp }}/settled.json
          if-no-files-found: error
          retention-days: 7

      - name: Archive internal diagnostics temporarily
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-v4-1-diagnostics
          path: |
            app/data/daily_report.json
            app/site/status.json
            app/site/quality.json
            app/site/validation.json
            app/site/market_status.json
            app/site/research_center.json
            app/site/production_gate.json
            app/site/league_coverage.json
            app/site/ab_status.json
            app/site/research_selections.json
            app/site/betting_readiness.json
            app/site/fixture_integrity.json
            app/site/independent_results.json
            app/site/handicap_forward_audit.json
            app/site/evidence_progress.json
            app/site/japan_free_market.json
            app/site/extra_sources.json
            app/site/weather_context.json
            app/site/bsd_backup.json
            app/site/free_research_extensions.json
            app/site/wide_leagues.json
            app/site/free_source_failover.json
            app/site/research_market_failover.json
            app/site/global_league_catalog.json
            app/site/worldwide_shadow.json
            app/site/worldwide_source_status.json
            app/site/global_league_catalog.js
            app/site/global_league_catalog.css
          if-no-files-found: warn
          retention-days: 14

  archive:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout trusted evidence-merging code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download immutable run-scoped research observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: football-king-research-snapshots
          path: snapshot

      - name: Archive research snapshots with optimistic concurrency retries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in asof shadow worldwide paired settled; do
            test -s "snapshot/$name.json"
          done
          # One fast-forward commit for all three archives, not three API commits.
          archive_saved=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            worktree="$RUNNER_TEMP/archive-worktree-$attempt"
            git worktree add --detach "$worktree" refs/remotes/origin/main
            python ops/archive_prepare.py \
              --snapshot snapshot --destination "$worktree" \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
              > "$RUNNER_TEMP/archive-paths.json"
            mapfile -t changed < <(python -c 'import json,sys; [print(p) for p in json.load(open(sys.argv[1]))["created"]]' "$RUNNER_TEMP/archive-paths.json")
            if [ "${#changed[@]}" -eq 0 ]; then
              archive_saved=true
            else
              git -C "$worktree" add -- "${changed[@]}"
              git -C "$worktree" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Archive research snapshots for run $GITHUB_RUN_ID (atomic)"
              if git -C "$worktree" push origin HEAD:refs/heads/main; then
                archive_saved=true
              else
                echo "Concurrent archive update; retrying with latest main ($attempt)"
              fi
            fi
            git worktree remove --force "$worktree"
            if [ "$archive_saved" = true ]; then break; fi
            sleep "$((attempt * 2))"
          done
          if [ "$archive_saved" != true ]; then
            echo "Unable to atomically archive snapshots after five retries" >&2
            exit 1
          fi
          # Merge against the latest branch version on EVERY retry. Never overwrite
          # a newer settled record with a stale workflow checkout copy.
          saved=false
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" --jq '.sha' 2>/dev/null || true)"
            if [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                --jq '.content' | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/current-settled.json"
              python ops/evidence_merge.py \
                --current "$RUNNER_TEMP/current-settled.json" \
                --incoming snapshot/settled.json \
                --output "$RUNNER_TEMP/merged-settled.json"
            else
              current_sha=""
              rm -f "$RUNNER_TEMP/current-settled.json"
              python ops/evidence_merge.py \
                --current "$RUNNER_TEMP/current-settled.json" \
                --incoming snapshot/settled.json \
                --output "$RUNNER_TEMP/merged-settled.json"
            fi
            added="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["newly_settled"])' "$RUNNER_TEMP/merged-settled.json")"
            if [ "$added" -eq 0 ] && [ -n "$current_sha" ]; then
              echo "Evidence already includes all sealed observations"
              saved=true
              break
            fi
            encoded="$(base64 -w0 "$RUNNER_TEMP/merged-settled.json")"
            if [ -n "$current_sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                  -f message="Safely merge forward-only research settlements" \
                  -f sha="$current_sha" -f content="$encoded" >/dev/null 2>&1; then
                saved=true
                break
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/evidence/settled.json" \
                  -f message="Initialize protected forward-only research settlements" \
                  -f content="$encoded" >/dev/null 2>&1; then
                saved=true
                break
              fi
            fi
            echo "Settled evidence concurrently changed: re-fetching, merging and retrying ($attempt)"
            sleep "$((attempt * 2))"
          done
          if [ "$saved" != true ]; then
            echo "Failed to merge cumulative evidence after five attempts" >&2
            exit 1
          fi

  notify_failure:
    needs: [publish, archive]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="足球王者：每日研究或歷史存檔失敗"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：每日研究或歷史存檔失敗") | .number' | head -n 1)"
          detail="資料採集、網站發布或歷史封存出錯。請查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID 。正式投注仍然停用。"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$detail"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$detail"
          fi

  close_resolved_incident:
    needs: [publish, archive]
    if: ${{ needs.publish.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close recovered incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="足球王者：每日研究或歷史存檔失敗") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "完整研究、發布和封存已經恢復正常。"
          fi
