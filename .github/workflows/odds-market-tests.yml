name: Football odds market unit tests
on:
  push:
    paths:
      - 'ops/odds_market.py'
      - 'ops/tests/test_odds_market.py'
      - '.github/workflows/odds-market-tests.yml'
  pull_request:
    paths:
      - 'ops/odds_market.py'
      - 'ops/tests/test_odds_market.py'
      - '.github/workflows/odds-market-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m compileall -q ops
      - name: Offline odds connector tests (no API key)
        run: python -m unittest discover -s ops/tests -p 'test_odds_market.py' -v
