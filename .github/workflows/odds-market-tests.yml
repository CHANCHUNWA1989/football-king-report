name: Football odds market unit tests
on:
  push:
    paths:
      - 'ops/odds_market.py'
      - 'ops/tests/test_odds_market.py'
      - '.github/workflows/odds-market-tests.yml'
  pull_request:
    paths:
      - 'ops/odds_market.py'
      - 'ops/tests/test_odds_market.py'
      - '.github/workflows/odds-market-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline odds connector tests (no API key)
        run: python -m unittest discover -s ops/tests -p 'test_odds_market.py' -v
