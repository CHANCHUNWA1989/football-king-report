name: Archive proof CI audit artifact (research only)

on:
  pull_request:
    paths:
      - '.github/workflows/archive-proof-ci-audit.yml'
      - 'ops/research_archive_proof_*.py'
      - 'ops/tests/test_research_archive_proof_*.py'
      - 'ops/research_external_evidence_gate_v1.py'
      - 'ops/research_forecast_artifact_integrity_v1.py'
      - 'ops/research_forecast_receipt_claim_v1.py'
      - 'ops/research_receipt_trust_prerequisites_v1.py'
      - 'ops/research_receipt_signature_ed25519_v1.py'
      - 'ops/research_trusted_key_lifecycle_v1.py'
      - 'ops/research_composed_receipt_verification_v1.py'
      - 'ops/research_key_revocation_history_v1.py'
      - 'ops/research_receipt_replay_inventory_v1.py'
      - 'ops/research_receipt_inventory_transition_v1.py'
      - 'ops/research_external_checkpoint_claim_v1.py'
      - 'ops/research_retrieved_checkpoint_bytes_v1.py'
      - 'ops/research_checkpoint_locator_policy_v1.py'
      - 'ops/research_checkpoint_dns_policy_v1.py'
      - 'ops/research_checkpoint_connection_binding_v1.py'
      - 'ops/research_checkpoint_redirect_policy_v1.py'
      - 'ops/research_checkpoint_tls_metadata_v1.py'
      - 'ops/research_checkpoint_transport_claim_v1.py'
      - 'ops/research_receipt_report_projection_v1.py'
      - 'ops/tests/test_research_external_evidence_gate_v1.py'
      - 'ops/tests/test_research_forecast_artifact_integrity_v1.py'
      - 'ops/tests/test_research_forecast_receipt_claim_v1.py'
      - 'ops/tests/test_research_receipt_trust_prerequisites_v1.py'
      - 'ops/tests/test_research_receipt_signature_ed25519_v1.py'
      - 'ops/tests/test_research_trusted_key_lifecycle_v1.py'
      - 'ops/tests/test_research_composed_receipt_verification_v1.py'
      - 'ops/tests/test_research_key_revocation_history_v1.py'
      - 'ops/tests/test_research_receipt_replay_inventory_v1.py'
      - 'ops/tests/test_research_receipt_inventory_transition_v1.py'
      - 'ops/tests/test_research_external_checkpoint_claim_v1.py'
      - 'ops/tests/test_research_retrieved_checkpoint_bytes_v1.py'
      - 'ops/tests/test_research_checkpoint_locator_policy_v1.py'
      - 'ops/tests/test_research_checkpoint_dns_policy_v1.py'
      - 'ops/tests/test_research_checkpoint_connection_binding_v1.py'
      - 'ops/tests/test_research_checkpoint_redirect_policy_v1.py'
      - 'ops/tests/test_research_checkpoint_tls_metadata_v1.py'
      - 'ops/tests/test_research_checkpoint_transport_claim_v1.py'
      - 'ops/tests/test_research_receipt_report_projection_v1.py'
  workflow_run:
    workflows: ['足球王者｜安全回歸測試']
    types: [completed]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Archive-proof-pilot GitHub Actions job ID'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Ed25519 test dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Verify archive proof parser and report CLI
        env:
          FOOTBALL_KING_REQUIRE_CRYPTO: '1'
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/tests -p 'test_research_archive_proof_*.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_missing_witness_locator_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_external_evidence_gate_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_forecast_artifact_integrity_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_forecast_receipt_claim_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_receipt_trust_prerequisites_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_receipt_signature_ed25519_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_trusted_key_lifecycle_v1.py' -q
          python -c 'import cryptography; print("Ed25519 dependency:", cryptography.__version__)'
          python -m unittest discover -s ops/tests -p 'test_research_composed_receipt_verification_v1.py' -v 2>&1 | tee /tmp/composed-receipt-tests.log
          ! grep -E 'skipped|SKIP' /tmp/composed-receipt-tests.log
          python -m unittest discover -s ops/tests -p 'test_research_key_revocation_history_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_receipt_replay_inventory_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_receipt_inventory_transition_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_external_checkpoint_claim_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_retrieved_checkpoint_bytes_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_locator_policy_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_dns_policy_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_connection_binding_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_redirect_policy_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_tls_metadata_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_checkpoint_transport_claim_v1.py' -q
          python -m unittest discover -s ops/tests -p 'test_research_receipt_report_projection_v1.py' -q
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve completed archive-proof job log (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          MANUAL_JOB: ${{ inputs.job_id }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$MANUAL_JOB" =~ ^[0-9]+$ ]] || exit 2
            job_id="$MANUAL_JOB"
          else
            mapfile -t matches < <(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name=="archive-proof-pilot" and .status=="completed") | .id')
            [[ "${#matches[@]}" -eq 1 ]] || { echo 'Expected exactly one completed archive-proof-pilot job'; exit 2; }
            job_id="${matches[0]}"
          fi
          [[ "$job_id" =~ ^[0-9]+$ ]] || { echo 'No archive-proof-pilot job found'; exit 2; }
          job_name="$(gh api "repos/$REPO/actions/jobs/$job_id" --jq '.name')"
          job_status="$(gh api "repos/$REPO/actions/jobs/$job_id" --jq '.status')"
          [[ "$job_name" == "archive-proof-pilot" && "$job_status" == "completed" ]] || { echo 'Job identity or completion mismatch'; exit 2; }
          job_run="$(gh api "repos/$REPO/actions/jobs/$job_id" --jq '.run_id')"
          if [[ "$EVENT" != "workflow_dispatch" ]]; then
            [[ "$job_run" == "$SOURCE_RUN" ]] || { echo 'Job belongs to another workflow run'; exit 2; }
          fi
          gh api "repos/$REPO/actions/jobs/$job_id/logs" > archive-proof-job.log
          test -s archive-proof-job.log
      - name: Generate strict audit report
        run: python -m ops.research_archive_proof_ci_report_v1 --log archive-proof-job.log --output archive-proof-audit.json
      - name: Upload diagnostic JSON only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-proof-audit-${{ github.run_id }}
          path: archive-proof-audit.json
          if-no-files-found: ignore
          retention-days: 7
