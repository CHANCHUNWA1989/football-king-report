name: Football King Agent Shadow Audit
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Football King private all-market research"
      - "足球王者｜四個免費後備來源獨立採集"
      - "足球王者 V4.1｜免費賠率市場研究及配額保護"
    types: [completed]
  schedule:
    - cron: '23 1,13 * * *'
permissions:
  contents: read
jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Agent safety tests
        run: python -m unittest discover -s ops/tests -p test_agent_orchestrator.py -v
      - name: Read-only audit
        run: |
          rc=0
          python ops/agent_orchestrator.py --output agent-audit.json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s agent-audit.json
      - name: Build iPhone-readable report
        run: python ops/agent_report.py --input agent-audit.json --output agent-report.html
      - name: Verify report artifact integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ops.agent_report import render
          audit = json.loads(Path("agent-audit.json").read_text(encoding="utf-8"))
          assert audit["schema"] == "football-king-agent-audit-v2"
          assert audit["mode"] == "SHADOW_READ_ONLY"
          assert audit["production_recommendations"] == "DISABLED"
          assert audit["automatic_bets"] is False
          assert audit["actions_performed"] == []
          assert audit["status"] in ("HOLD", "READY_FOR_MANUAL_REVIEW")
          assert audit["next_action"] == (
              "MANUAL_REVIEW_ONLY" if audit["status"] == "READY_FOR_MANUAL_REVIEW"
              else "REFRESH_OR_REPAIR_INPUTS"
          )
          html = Path("agent-report.html").read_text(encoding="utf-8")
          assert html == render(audit)
          assert len(html) > 200
          print("AGENT_REPORT_VERIFIED", audit["status"])
          PY
      - name: Publish audit summary to GitHub Actions
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          source = Path("agent-audit.json")
          lines = ["## 足球王者 Agent｜唯讀驗收", ""]
          if source.is_file():
              try:
                  data = json.loads(source.read_text(encoding="utf-8"))
                  status = data.get("status", "HOLD")
                  if status not in ("HOLD", "READY_FOR_MANUAL_REVIEW"):
                      status = "HOLD"
                  progress = data.get("six_pillar_progress") or {}
                  if not isinstance(progress, dict):
                      progress = {}
                  settlement = progress.get("settlement") or {}
                  if not isinstance(settlement, dict):
                      settlement = {}
                  coverage = progress.get("provider_coverage") or {}
                  if not isinstance(coverage, dict):
                      coverage = {}
                  lines += [
                      f"- Agent 狀態：`{status}`",
                      f"- 下一步：`{data.get('next_action', 'REFRESH_OR_REPAIR_INPUTS')}`",
                      f"- 資料異常數：{len(data.get('diagnostics', [])) if isinstance(data.get('diagnostics'), list) else '未知'}",
                      f"- 結算樣本：{settlement.get('observations', '未核實')}",
                      f"- 距離1000場：{progress.get('remaining_to_target', '未核實')}",
                      f"- 結算證據狀態：{settlement.get('status', 'HOLD')}",
                      f"- 可用免費來源：{coverage.get('usable_provider_count', '未核實')}",
                      f"- 端到端驗證：{progress.get('end_to_end_workflow_verified', False)}",
                  ]
              except (OSError, ValueError, TypeError):
                  lines.append("- 報告無法讀取：HOLD")
          else:
              lines.append("- 未產生 Agent JSON 報告：HOLD")
          lines += ["- 正式推薦：停用", "- 自動投注：停用", "",
                    "請到本次工作流程 Artifacts 檢查完整 JSON / HTML 報告。"]
          with path.open("a", encoding="utf-8") as f:
              f.write(chr(10).join(lines) + chr(10))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-agent-audit
          path: |
            agent-audit.json
            agent-report.html
          if-no-files-found: error
          retention-days: 14
