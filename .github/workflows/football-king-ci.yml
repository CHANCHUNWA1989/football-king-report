name: 足球王者｜安全回歸測試

on:
  pull_request:
    paths:
      - 'ops/**'
      - 'app/**'
      - '.github/workflows/football-king-*.yml'
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'app/**'
      - '.github/workflows/football-king-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-king-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      THE_ODDS_API_KEY: ''
      API_FOOTBALL_KEY: ''
      FOOTBALL_DATA_ORG_TOKEN: ''
      SPORTMONKS_API_TOKEN: ''
      OPENFOOT_API_KEY: ''
      BSD_FREE_API_TOKEN: ''
    steps:
      - name: Checkout without provider secrets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile repository source scripts
        run: python -m compileall -q ops
      - name: Run all zero-cost synthetic regression tests
        run: python -m unittest discover -s ops/tests -v
      - name: Verify immutable original V4.1 distribution
        run: |
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -
          mkdir -p app
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d /tmp/football_king_ci
          cp -a /tmp/football_king_ci/football_king_v4_1/. app/
          python -m compileall -q app
      - name: Adapt exact obsolete V4.1 stale-report assertion to require safe HOLD
        run: python ops/legacy_v41_test_compat.py --app app
      - name: Run V4.1 application tests with documented safety-compatible assertion
        working-directory: app
        run: python -m unittest discover -s tests -v

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      THE_ODDS_API_KEY: ''
      API_FOOTBALL_KEY: ''
      FOOTBALL_DATA_ORG_TOKEN: ''
      SPORTMONKS_API_TOKEN: ''
      OPENFOOT_API_KEY: ''
      BSD_FREE_API_TOKEN: ''
      FIVEDOLLAR_FOOTBALL_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline stress and concurrent reliability tests
        run: python ops/stress_test.py --records 1500 --output stress-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-offline-stress
          path: stress-result.json
          if-no-files-found: error
          retention-days: 14
