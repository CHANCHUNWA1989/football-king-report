name: Asian EV research tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/asian_ev_research.py'
      - 'tests/test_asian_ev_research.py'
      - 'tests/test_asian_ev_input_hardening.py'
      - '.github/workflows/asian-ev-research-tests.yml'
  pull_request:
    paths:
      - 'ops/asian_ev_research.py'
      - 'tests/test_asian_ev_research.py'
      - 'tests/test_asian_ev_input_hardening.py'
      - '.github/workflows/asian-ev-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asian-ev-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Asian EV research engine
        run: |
          python -m unittest discover -s tests -p 'test_asian_ev_research.py' -v
          python -m unittest discover -s tests -p 'test_asian_ev_input_hardening.py' -v
