name: Asian EV research tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
      - integration/asian-ev-ci-green-20261021
      - integration/asian-ev-rebased-20261021
    paths:
      - 'ops/asian_ev_research.py'
      - 'tests/test_asian_ev_research.py'
      - 'tests/test_asian_ev_input_hardening.py'
      - '.github/workflows/asian-ev-research-tests.yml'
  pull_request:
    paths:
      - 'ops/asian_ev_research.py'
      - 'tests/test_asian_ev_research.py'
      - 'tests/test_asian_ev_input_hardening.py'
      - '.github/workflows/asian-ev-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asian-ev-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test Asian EV research engine
        run: |
          python -m unittest discover -s tests -p 'test_asian_ev_research.py' -v
          python -m unittest discover -s tests -p 'test_asian_ev_input_hardening.py' -v
