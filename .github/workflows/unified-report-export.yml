name: Export football research report
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate research-only report from stored market snapshot
        run: python export_unified_report.py
      - name: Check real report is available
        id: check
        shell: bash
        run: |
          if [ -f "integration/outbox/football.json" ]; then
            python -c 'import json; from ops.report_contract import validate_report; from pathlib import Path; p=Path("integration/outbox/football.json"); assert not p.is_symlink() and p.stat().st_size <= 1048576, "UNSAFE_REPORT_FILE"; report=validate_report(json.loads(p.read_text(encoding="utf-8"))); assert report["system"] == "football", "WRONG_SYSTEM"'
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No real football report exists. No fabricated artifact will be uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload real report only
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-football-report
          path: integration/outbox/football.json
          if-no-files-found: error
          retention-days: 3
