name: 足球王者｜挪威官方免費天氣研究資料

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-weather.yml'
  schedule:
    # 香港時間每日06:47；正式首次接入前需全部驗收；僅查6個城市中心，遵守 MET Norway 流量規則
    - cron: '47 22 * * *'

concurrency:
  group: football-king-metno-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout read-only Norwegian Meteorological Institute client
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed full research tests before contacting free API
        run: python -m unittest discover -s ops/tests -q
      - name: Fetch at most six credited city-centre forecasts (no secret required)
        run: |
          set -euo pipefail
          python ops/met_weather.py --output weather-result.json
          python ops/met_weather_guard.py --input weather-result.json
          test -s weather-result.json
      - name: Transfer only sourced, bounded public forecast values
        uses: actions/upload-artifact@v4
        with:
          name: football-king-metno-city-weather
          path: weather-result.json
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: collect
    if: github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fixed weather archive policy without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download sanitized weather forecast artifact only
        uses: actions/download-artifact@v4
        with:
          name: football-king-metno-city-weather
          path: data
      - name: Archive to pinned MET Norway research branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python ops/met_weather_guard.py --input data/weather-result.json
          python ops/met_weather_isolated_archive.py publish \
            --input data/weather-result.json \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT"

  notify_failure:
    needs: [collect, archive]
    if: ${{ always() && (needs.collect.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Optional weather issue, never disturb betting HOLD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="足球王者：免費MET天氣研究同步異常"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費MET天氣研究同步異常") | .number' | head -n 1)"
          info="額外免費天氣資料異常，不會改動預測、賠率及推薦資格：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$info"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$info"
          fi

  close_incident:
    needs: [collect, archive]
    if: ${{ needs.collect.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close weather incident when archiving recovers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：免費MET天氣研究同步異常") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "免費天氣研究收集及封存恢復；對原有賠率／模型冇影響。"
          fi
