name: Football King P0 real one-source pre-match identity A/B probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ops/identity_ab_openliga_probe.py
      - ops/tests/test_identity_ab_openliga_probe.py
      - ops/identity_ab_compare.py
      - .github/workflows/football-king-openliga-forward-ab.yml
  push:
    branches:
      - fix/model-role-history-guard-20261108
    paths:
      - .github/workflows/football-king-openliga-forward-ab.yml

permissions:
  contents: read

concurrency:
  group: football-king-one-source-forward-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  input-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: No outcome leakage or native fixture ambiguity tests
        run: |
          python -m compileall -q ops
          python -m unittest ops.tests.test_identity_ab_openliga_probe \
            ops.tests.test_identity_ab_compare -v

  single-live-get:
    if: github.event_name != 'pull_request'
    needs: input-normalization
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact A/B model source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read one bounded current Bundesliga season from pinned public OpenLigaDB
        shell: bash
        run: |
          set -euo pipefail
          python -m ops.identity_ab_openliga_probe --source-commit "$GITHUB_SHA"
          echo "UNVERIFIED_SINGLE_SOURCE_PREMATCH_AB_ONLY; NO_MODEL_ACCURACY_CLAIM; NO_BETS"
