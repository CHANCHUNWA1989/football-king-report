name: Pinned historical replay acceptance
on:
  pull_request:
    paths:
      - 'ops/consolidated_historical_replay.py'
      - 'ops/live_core_*.py'
      - 'ops/score_distribution_vnext.py'
      - 'ops/tests/test_consolidated_historical_replay.py'
      - '.github/workflows/pinned-historical-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify replay contract
        run: python -m unittest discover -s ops/tests -p 'test_consolidated_historical_replay.py' -v
      - name: Execute fixed historical replay (public pinned scores only)
        run: python ops/consolidated_historical_replay.py
      - name: Execute fixed cross-season team strength research
        run: python ops/live_core_walkforward_strength.py
      - name: Execute fixed three-league schedule density and Elo replay
        run: python ops/live_core_three_league_schedule.py
      - name: Execute pinned three-league venue-bias replay
        run: python ops/live_core_venue_bias_replay.py
      - name: Execute opponent-adjusted team strength replay
        run: python ops/live_core_opponent_strength.py
