name: Football King | Private Seal Sigstore Attestation (Manual Only)
# This produces a public Sigstore provenance for a SANITIZED seal only.
# NEVER send raw bookmaker quotes, private fixture IDs, score distributions,
# credentials, proprietary API responses or sensitive metadata through inputs.
# The caller is responsible for licensing and explicitly accepting that
# workflow_dispatch metadata/attestations are NOT a private transport channel.
on:
  workflow_dispatch:
    inputs:
      sanitized_seal_base64:
        description: 'Base64 of sanitized, research-only seal.json (PUBLIC METADATA; no raw odds)'
        required: true
        type: string
      expected_sha256:
        description: 'SHA-256 of exact sanitized seal.json bytes'
        required: true
        type: string
      acknowledge_public_metadata:
        description: 'I approve public metadata attestation (never raw odds)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: football-king-private-seal-signer-main
  cancel-in-progress: false

jobs:
  attest_sanitized_research_seal:
    # No pull_request / push / cron / workflow_run entry and no non-main signer.
    # Merely adding this workflow to a Draft PR cannot trigger attestation.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/main' && inputs.acknowledge_public_metadata == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout trusted default-branch validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail closed unless public-safe seal bytes and claimed time pass
        env:
          SANITIZED_SEAL_BASE64: ${{ inputs.sanitized_seal_base64 }}
          EXPECTED_SEAL_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          python ops/private_quote_signer_intake.py --output "${RUNNER_TEMP}/seal.json"
          test -s "${RUNNER_TEMP}/seal.json"
      - name: Sign exactly the validated sanitized seal file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/seal.json
          show-summary: 'false'
      # No artifact upload, Pages deploy, bet, API-key access, or approval bypass.
      # Independently download bundle and reverify in a PRIVATE environment:
      # gh attestation download seal.json -R CHANCHUNWA1989/football-king-report
      # Only independent pinned GitHub metadata + Rekor time may create witness
      # observations, never verified bookmaker prices or certified predictions.
