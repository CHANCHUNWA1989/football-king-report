name: Asian EV quote gate tests
on:
  push:
    paths:
      - 'ops/asian_ev_quote_gate.py'
      - 'tests/test_asian_ev_quote_gate.py'
      - '.github/workflows/asian-ev-quote-gate-tests.yml'
  pull_request:
    paths:
      - 'ops/asian_ev_quote_gate.py'
      - 'tests/test_asian_ev_quote_gate.py'
      - '.github/workflows/asian-ev-quote-gate-tests.yml'
jobs:
  quote-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run quote gate tests
        run: python -m unittest discover -s tests -p 'test_asian_ev_quote_gate.py' -v
