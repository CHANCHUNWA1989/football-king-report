name: Asian EV quote gate tests
on:
  push:
    paths:
      - 'ops/asian_ev_quote_gate.py'
      - 'tests/test_asian_ev_quote_gate.py'
      - '.github/workflows/asian-ev-quote-gate-tests.yml'
  pull_request:
    paths:
      - 'ops/asian_ev_quote_gate.py'
      - 'tests/test_asian_ev_quote_gate.py'
      - '.github/workflows/asian-ev-quote-gate-tests.yml'
jobs:
  quote-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run quote gate tests
        run: python -m unittest discover -s tests -p 'test_asian_ev_quote_gate.py' -v
