name: S0 main archive writer and candidate reader map (offline)

on:
  pull_request:
    paths:
      - 'ops/main_branch_writer_preflight.py'
      - 'ops/tests/test_main_branch_writer_preflight.py'
      - 'ops/main_writer_git_lineage.py'
      - 'ops/tests/test_main_writer_git_lineage.py'
      - 'ops/main_workflow_job_lineage.py'
      - 'ops/pages_artifact_readback.py'
      - 'ops/pages_deploy_log_link.py'
      - 'ops/tests/test_pages_deploy_log_link.py'
      - 'ops/tests/test_pages_artifact_readback.py'
      - 'ops/tests/test_main_workflow_job_lineage.py'
      - 'docs/s0_runtime_main_commit_lineage_20261103.md'
      - '.github/workflows/release-main-archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated fail-closed writer-graph tests
        run: python -m unittest ops.tests.test_main_branch_writer_preflight -v
      - name: Build read-only static report from PR checkout (not production main)
        shell: bash
        run: |
          set -euo pipefail
          python ops/main_branch_writer_preflight.py --root . --output "$RUNNER_TEMP/main-writer-graph.json" > "$RUNNER_TEMP/main-writer-graph.stdout.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'main-writer-graph.json').read_text(encoding='utf-8'))
          assert r['production_recommendations']=='DISABLED'
          assert r['main_branch_protection_independently_verified'] is False
          assert r['all_indirect_writes_excluded'] is False
          assert r['consumer_directions_and_write_targets_verified'] is False
          assert r['workflow_count']>0
          assert r['scan_coverage']=='WORKFLOW_FILES_AND_DIRECTLY_MENTIONED_OPS_PYTHON_ONLY'
          print('S0 OFFLINE STATIC CANDIDATES ONLY; NO LIVE BRANCH-RULE VERIFICATION')
          print('Workflows scanned:',r['workflow_count'])
          print('Potential writer workflows:',r['potential_repo_writer_count'])
          print('Shared literal-path candidates:',r['candidate_cross_workflow_path_overlap_count'])
          print('Direct ops scripts scanned:',r['direct_ops_scripts_scanned'])
          print('Direct script mutation candidates:',r['direct_ops_script_mutation_candidate_count'])
          print('Writer workflow names:', ', '.join(x['workflow'] for x in r['potential_repo_writers']))
          print('Explicit repository content mutation candidates:', ', '.join(r['explicit_content_mutation_workflow_candidates']))
          print('Artifact-only deletion workflows:', ', '.join(r['artifact_delete_only_workflow_candidates']))
          print('Direct ops mutation script candidates:', ', '.join(x['path'] for x in r['direct_ops_script_mutation_candidates']))
          print('Test-fixture-only mutation text:', ', '.join(x['path'] for x in r['test_only_script_mutation_markers']))
          PY
      - name: Retain static dependency graph for authorized manual reviewer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s0-main-writer-candidate-map
          path: ${{ runner.temp }}/main-writer-graph.json
          if-no-files-found: error
          retention-days: 14


  runtime_main_git_lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited PR code without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout LIVE main in separate read-only sparse worktree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: main
          path: s0-main-live
          fetch-depth: 60
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test local Git lineage fail-closed behavior with real local Git commits
        run: python -m unittest ops.tests.test_main_writer_git_lineage -v
      - name: Inspect actual main Git commits and changed paths (no GitHub writes)
        shell: bash
        run: |
          set -euo pipefail
          python ops/main_writer_git_lineage.py \
            --main-checkout s0-main-live \
            --max-commits 60 \
            --output "$RUNNER_TEMP/s0-main-live-commits.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"s0-main-live-commits.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["status"]=="PARTIAL_REAL_MAIN_GIT_COMMIT_LINEAGE_CAPTURED"
          assert r["main_branch_checkout_verified"] is True
          assert r["concrete_git_file_changes_observed"] is True
          assert r["writer_workflow_attribution_independently_verified"] is False
          assert r["all_dynamic_writers_and_readers_audited"] is False
          assert r["branch_protection_independently_verified"] is False
          assert r["independent_reviewer_approved"] is False
          assert r["full_s0_acceptance"] is False
          assert r["permission_to_merge"] is False
          assert r["verified_positive_ev"] is False
          assert r["production_recommendations"]=="DISABLED"
          assert 1 <= r["sampled_commit_count"] <= 60
          print("S0_REAL_MAIN_GIT_PATH_LINEAGE_PARTIAL_ONLY")
          print("main_commit_sha:",r["main_head_sha"])
          print("observed_main_commits:",r["sampled_commit_count"])
          print("commits_with_research_data_path_changes:",r["matching_commit_count"])
          print("matching_changed_paths_total:",r["matching_changed_path_count"])
          print("commit_path_lists_truncated:",r["matching_commit_path_lists_truncated"])
          print("main_data_path_categories:",r["main_write_path_categories"])
          print("No direct attribution of individual writers, review or release permission")
          PY
      - name: Retain live main Git-path evidence for external human reviewer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s0-real-main-git-commit-lineage
          path: ${{ runner.temp }}/s0-main-live-commits.json
          if-no-files-found: error
          retention-days: 14


  runtime_job_correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout PR verifier without persisted GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout real main Git commit objects only, never execute archive code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: main
          path: s0-main-job-evidence
          fetch-depth: 70
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated forged-log / wrong-commit / wrong-run refusal tests
        run: python -m unittest ops.tests.test_main_workflow_job_lineage -v
      - name: Fetch exactly ONE pinned historical GitHub Actions run and its two writer job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # API calls are ALL GET and the job token grants ONLY contents/actions
          # read. Never upload raw logs (which may include unwanted details).
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41603036531" > "$RUNNER_TEMP/s0-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41603036531/jobs?per_page=100" > "$RUNNER_TEMP/s0-jobs.json"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/125806924489/logs" > "$RUNNER_TEMP/s0-archive-job.log"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/125807102939/logs" > "$RUNNER_TEMP/s0-provenance-job.log"
          python ops/main_workflow_job_lineage.py \
            --main-checkout s0-main-job-evidence \
            --run "$RUNNER_TEMP/s0-run.json" \
            --jobs "$RUNNER_TEMP/s0-jobs.json" \
            --archive-log "$RUNNER_TEMP/s0-archive-job.log" \
            --provenance-log "$RUNNER_TEMP/s0-provenance-job.log" \
            --output "$RUNNER_TEMP/s0-two-job-main-correspondence.json"
      - name: Retain only redacted main-commit and job-metadata correspondence (no raw job logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s0-two-verified-main-writer-job-links
          path: ${{ runner.temp }}/s0-two-job-main-correspondence.json
          if-no-files-found: warn
          retention-days: 14


  live_pages_artifact_readback:
    # Uses only public HTTP GET + actions:read. No market API, writes, deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout read-only research verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run 15 offline archive + website admission tests
        run: python -m unittest ops.tests.test_pages_artifact_readback -v
      - name: Run 14 deploy-run identity and forged log negative tests
        run: python -m unittest ops.tests.test_pages_deploy_log_link -v
      - name: Select latest completed successful main iPhone Pages run (GET only)
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/football-king-iphone.yml/runs?status=success&per_page=15" > "$RUNNER_TEMP/s0-candidate-runs.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((p/"s0-candidate-runs.json").read_text())
          accepted=[x for x in data.get("workflow_runs",[])
                    if x.get("head_branch")=="main"
                    and x.get("name")=="Football King V4.1 iPhone Daily Report"
                    and x.get("status")=="completed"
                    and x.get("conclusion")=="success"
                    and x.get("event") in ("schedule","workflow_run")
                    and x.get("run_attempt")==1]
          if not accepted:
              raise SystemExit("S0_NO_QUALIFYING_COMPLETED_PAGES_RUN")
          selected=max(accepted,key=lambda x:x["created_at"])
          (p/"s0-pages-run.json").write_text(json.dumps(selected),encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a") as fp:
              fp.write("run_id="+str(selected["id"])+"\n")
          print("S0_READ_ONLY_PAGES_RUN_SELECTED",selected["id"])
          PY
      - name: Download this run Pages artifact, not a separate version
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: s0-downloaded-pages
      - name: Compare GitHub Pages deploy log against exact run, artifact ID and SHA (GET only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.select.outputs.run_id }}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/s0-pages-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$RUNNER_TEMP/s0-pages-artifacts.json"
          job_id="$(python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((p/"s0-pages-jobs.json").read_text(encoding="utf-8"))
          if not isinstance(data.get("jobs"),list) or data.get("total_count")!=len(data["jobs"]):
              raise SystemExit("S0_INCOMPLETE_DEPLOY_JOBS_METADATA")
          found=[v for v in data["jobs"] if v.get("name")=="publish" and v.get("conclusion")=="success"]
          if len(found)!=1 or type(found[0].get("id")) is not int:
              raise SystemExit("S0_DEPLOY_PUBLISH_JOB_MISSING")
          print(found[0]["id"])
          PY
          )"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/s0-pages-publish.log"
          python ops/pages_deploy_log_link.py \
            --run "$RUNNER_TEMP/s0-pages-run.json" \
            --jobs "$RUNNER_TEMP/s0-pages-jobs.json" \
            --artifacts "$RUNNER_TEMP/s0-pages-artifacts.json" \
            --publish-log "$RUNNER_TEMP/s0-pages-publish.log" \
            --output "$RUNNER_TEMP/s0-pages-deploy-link.json" \
            --require-link
      - name: Verify artifact tar member SHA256 equals four public JSON bytes
        shell: bash
        run: |
          set -euo pipefail
          python ops/pages_artifact_readback.py \
            --artifact s0-downloaded-pages/artifact.tar \
            --run "$RUNNER_TEMP/s0-pages-run.json" \
            --output "$RUNNER_TEMP/s0-pages-byte-readback.json" \
            --require-content-match
      - name: Retain non-release readback digest receipt for independent reviewer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s0-pages-byte-for-byte-readback
          path: |
            ${{ runner.temp }}/s0-pages-byte-readback.json
            ${{ runner.temp }}/s0-pages-deploy-link.json
          if-no-files-found: warn
          retention-days: 7
