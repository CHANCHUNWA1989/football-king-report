name: 足球王者｜每週六聯賽研究可靠性報告

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-weekly.yml'
  schedule:
    # 香港時間逢星期五 18:20，GitHub 排程可能稍有延誤
    - cron: '20 10 * * 5'

concurrency:
  group: football-king-weekly-audit
  cancel-in-progress: false

jobs:
  weekly-report:
    if: github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evidence and weekly research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run all fail-closed audit tests
        run: python -m unittest discover -s ops/tests -q

      - name: Build Friday research-only six-league report
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Hong_Kong date +%F)"
          echo "REPORT_DAY=$today" >> "$GITHUB_ENV"
          python ops/weekly_digest.py --evidence evidence/settled.json \
            --market market/latest.json --out "$RUNNER_TEMP/weekly.md"
          test -s "$RUNNER_TEMP/weekly.md"

      - name: Archive only on isolated weekly research branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          python ops/weekly_isolated_archive.py \
            --input "$RUNNER_TEMP/weekly.md" --day "$REPORT_DAY"

      - name: Read back isolated archive and prepare verified Issue body (read only)
        shell: bash
        run: |
          set -euo pipefail
          python ops/weekly_isolated_reader.py \
            --input "$RUNNER_TEMP/weekly.md" --day "$REPORT_DAY" \
            --output "$RUNNER_TEMP/weekly-notification.md"

      - name: Create or verify the matching weekly GitHub Issue notification
        shell: bash
        run: |
          set -euo pipefail
          title="足球王者每週研究驗證｜$REPORT_DAY"
          # No issue is posted until fixed-branch readback matches original
          # bytes and SHA. Never read a stale weekly markdown file from main.
          test -s "$RUNNER_TEMP/weekly-notification.md"
          gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --limit 1000 --json number,title \
            > "$RUNNER_TEMP/weekly-existing-list.json"
          previous="$(python - "$RUNNER_TEMP/weekly-existing-list.json" "$title" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              entries = json.load(source)
          if not isinstance(entries, list) or len(entries) >= 1000:
              raise SystemExit("HOLD: WEEKLY_ISSUE_LIST_INCOMPLETE")
          exact = [x["number"] for x in entries if isinstance(x, dict)
                   and x.get("title") == sys.argv[2]]
          if len(exact) > 1 or any(type(n) is not int or n < 1 for n in exact):
              raise SystemExit("HOLD: AMBIGUOUS_WEEKLY_ISSUE")
          print(exact[0] if exact else "", end="")
          PY
          )"
          if [ -z "$previous" ]; then
            issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/weekly-notification.md")"
            issue_number="${issue_url##*/}"
          else
            issue_number="$previous"
          fi
          if ! [[ "$issue_number" =~ ^[0-9]{1,9}$ ]]; then
            echo "HOLD: INVALID_WEEKLY_ISSUE_ID" >&2
            exit 1
          fi
          # A successful create call is not proof the notified bytes match
          # the fixed GitHub archive. Verify the actual Issue body.
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --json body > "$RUNNER_TEMP/weekly-posted-issue.json"
          python - "$RUNNER_TEMP/weekly-posted-issue.json" \
            > "$RUNNER_TEMP/weekly-posted-issue.md" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              obj = json.load(source)
          body = obj.get("body") if isinstance(obj, dict) else None
          if not isinstance(body, str) or not body:
              raise SystemExit("HOLD: INVALID_WEEKLY_ISSUE_BODY")
          sys.stdout.buffer.write(body.encode("utf-8"))
          PY
          if ! cmp -s "$RUNNER_TEMP/weekly-notification.md" \
                "$RUNNER_TEMP/weekly-posted-issue.md"; then
            echo "HOLD: WEEKLY_ISSUE_ARCHIVE_BODY_MISMATCH" >&2
            exit 1
          fi
          echo "Weekly Issue verified against fixed isolated branch readback; no release/EV claim"
          # Issues require user notification settings for delivery to iPhone.
