name: 足球王者｜每週六聯賽研究可靠性報告

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-weekly.yml'
  schedule:
    # 香港時間逢星期五 18:20，GitHub 排程可能稍有延誤
    - cron: '20 10 * * 5'

concurrency:
  group: football-king-weekly-audit
  cancel-in-progress: false

jobs:
  weekly-report:
    if: github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evidence and weekly research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run all fail-closed audit tests
        run: python -m unittest discover -s ops/tests -q

      - name: Build Friday research-only six-league report
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Hong_Kong date +%F)"
          echo "REPORT_DAY=$today" >> "$GITHUB_ENV"
          python ops/weekly_digest.py --evidence evidence/settled.json \
            --market market/latest.json --out "$RUNNER_TEMP/weekly.md"
          test -s "$RUNNER_TEMP/weekly.md"

      - name: Archive only on isolated weekly research branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          python ops/weekly_isolated_archive.py \
            --input "$RUNNER_TEMP/weekly.md" --day "$REPORT_DAY"

      - name: Create weekly GitHub issue as a notification option
        run: |
          set -euo pipefail
          title="足球王者每週研究驗證｜$REPORT_DAY"
          previous="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --limit 100 --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -n 1)"
          if [ -z "$previous" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/weekly.md"
          else
            echo "Already posted weekly report to issue $previous"
          fi
          # Issues require user notification settings for delivery to iPhone.
