name: Football material quote alert tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/quote_alert_policy.py'
      - 'tests/test_quote_alert_policy.py'
      - 'ops/quote_snapshot_compare.py'
      - 'ops/free_odds_intake.py'
      - '.github/workflows/quote-alert-policy-tests.yml'
  pull_request:
    paths:
      - 'ops/quote_alert_policy.py'
      - 'tests/test_quote_alert_policy.py'
      - 'ops/quote_snapshot_compare.py'
      - 'ops/free_odds_intake.py'
      - '.github/workflows/quote-alert-policy-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test material quote alert decisions
        run: python -m unittest discover -s tests -p 'test_quote_alert_policy.py' -v
