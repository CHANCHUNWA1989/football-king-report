name: DHE historical real-file compatibility
on:
  pull_request:
    paths:
      - 'ops/deep_handicap_historical_inputs.py'
      - 'ops/deep_handicap_historical_smoke.py'
      - '.github/workflows/deep-handicap-historical-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python ops/deep_handicap_historical_smoke.py
