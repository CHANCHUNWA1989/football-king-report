name: European provider live catalogue smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: european-live-catalogue-smoke
  cancel-in-progress: false

jobs:
  live-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify provider catalogue only, no billable odds calls
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python -m ops.european_live_catalogue
