name: Liga MX paired historical model comparison
on:
  pull_request:
    paths:
      - 'ops/live_core_liga_mx_walkforward.py'
      - 'ops/tests/test_live_core_liga_mx_walkforward.py'
      - 'ops/live_core_multi_source.py'
      - 'ops/score_distribution_vnext.py'
      - '.github/workflows/liga-mx-walkforward.yml'
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline contracts
        run: python -m unittest discover -s ops/tests -p test_live_core_liga_mx_walkforward.py -v
      - name: Pinned historical paired comparison
        run: python ops/live_core_liga_mx_walkforward.py
