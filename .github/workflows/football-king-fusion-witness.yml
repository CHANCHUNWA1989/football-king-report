name: Football King prospective fusion witness (research)
on:
  workflow_dispatch:
    inputs:
      fusion_json:
        description: "Public research JSON only; no credentials or private data"
        required: true
        type: string
      public_input_confirmed:
        description: "I confirm this input is public research data"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  witness:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'CHANCHUNWA1989/football-king-report' && inputs.public_input_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate outcome-free research receipt with runner clock
        env:
          FUSION_DISPATCH_JSON: ${{ inputs.fusion_json }}
          PUBLIC_INPUT_CONFIRMED: ${{ inputs.public_input_confirmed }}
        run: python -m ops.research_fusion_signer_v44
      - name: Attest exact research receipt
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: fusion-receipt.json
          push-to-registry: false
          create-storage-record: false
      - name: Preserve bundle and verify exact receipt before upload
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" fusion.sigstore.json
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          from ops.research_fusion_witness_v39 import verify
          result=verify(Path("fusion-input.json").read_bytes(),
                        Path("fusion-receipt.json").read_bytes(),
                        Path("fusion.sigstore.json").read_bytes(),
                        source_sha=os.environ["GITHUB_SHA"],
                        workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
                        run_id=os.environ["GITHUB_RUN_ID"],
                        attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                        as_of=datetime.now(timezone.utc).isoformat())
          if result["verification_completed"] is not True:
              raise SystemExit("research witness rejected")
          PY
      - name: Preserve public research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fusion-research-witness
          path: |
            fusion-input.json
            fusion-receipt.json
            fusion.sigstore.json
          if-no-files-found: error
          retention-days: 90
