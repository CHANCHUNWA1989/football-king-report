name: Football King prospective fusion witness (research only)
on:
  workflow_dispatch:
    inputs:
      input_sha256:
        description: SHA256 of sanitized committed research/fusion-inputs/<sha256>.json
        required: true
        type: string
permissions: {}
jobs:
  witness:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'CHANCHUNWA1989/football-king-report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare strictly validated research receipt using runner UTC
        env:
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          set -euo pipefail
          python -m ops.research_fusion_signer_v40 prepare --digest "$INPUT_SHA256" --output "$RUNNER_TEMP/fusion-proof"
      - name: Attest exact receipt bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/fusion-proof/fusion-receipt.json
          push-to-registry: false
          create-storage-record: false
      - name: Reverify exact receipt against run identity and external clock
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/fusion-proof/fusion.sigstore.json"
          python -m ops.research_fusion_signer_v40 verify --proof "$RUNNER_TEMP/fusion-proof" \
            --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve successful research witness only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fusion-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fusion-proof/
          if-no-files-found: error
          retention-days: 90
