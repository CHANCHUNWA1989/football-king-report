name: European competition coverage audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/european_competitions_2026_27.json'
      - 'ops/european_coverage.py'
      - 'ops/european_sports_catalogue.py'
      - 'ops/european_catalogue_cli.py'
      - 'ops/european_live_catalogue.py'
      - 'ops/tests/test_european_coverage.py'
      - 'ops/tests/test_european_sports_catalogue.py'
      - 'ops/tests/test_european_catalogue_cli.py'
      - 'ops/tests/test_european_live_catalogue.py'
      - 'ops/tests/test_european_catalogue_stress.py'
      - 'ops/tests/test_european_catalogue_concurrency.py'
      - 'ops/tests/test_european_provider_faults.py'
      - 'ops/tests/test_european_market_stress.py'
      - 'ops/tests/test_european_market_integrity.py'
      - 'ops/tests/test_european_collector_quota.py'
      - 'ops/tests/test_european_collector_integrity.py'
      - 'ops/tests/test_european_collector_batch_stress.py'
      - 'ops/tests/test_european_market_fuzz.py'
      - 'ops/tests/test_european_quota_circuit_breaker.py'
      - 'ops/tests/test_european_market_throughput.py'
      - '.github/workflows/european-coverage-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run European coverage audit and offline tests
        run: |
          python -m ops.european_coverage
          python -m unittest discover -s ops/tests -p 'test_european_*.py' -v
