name: European competition coverage audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/european_competitions_2026_27.json'
      - 'ops/european_coverage.py'
      - 'ops/tests/test_european_coverage.py'
      - '.github/workflows/european-coverage-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit coverage without API requests
        run: |
          python -m ops.european_coverage
          python -m unittest ops.tests.test_european_coverage -v
