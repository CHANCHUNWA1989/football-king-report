name: Penaltyblog two-model research pipeline

on:
  pull_request:
    paths:
      - "ops/penaltyblog_two_model_pipeline.py"
      - "ops/tests/test_penaltyblog_two_model_pipeline.py"
      - "ops/tests/penaltyblog_two_model_pipeline_real_smoke.py"
      - ".github/workflows/penaltyblog-two-model-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test integrated fail-closed pipeline
        run: python -m unittest discover -s ops/tests -p test_penaltyblog_two_model_pipeline.py -v
  real-penaltyblog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional dependency
        run: python -m pip install penaltyblog==1.13.1
      - name: Run real Poisson and Dixon-Coles integrated smoke
        run: python -m ops.tests.penaltyblog_two_model_pipeline_real_smoke
