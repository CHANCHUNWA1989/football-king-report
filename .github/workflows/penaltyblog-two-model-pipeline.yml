name: Penaltyblog two-model research pipeline

on:
  pull_request:
    paths:
      - "ops/penaltyblog_two_model_pipeline.py"
      - "ops/penaltyblog_a_dual_prematch_capture.py"
      - "ops/penaltyblog_a_shadow_native_handoff.py"
      - "ops/shadow_forecast.py"
      - "ops/original_a_same_get_private_seal.py"
      - "ops/original_a_same_get_shadow_pair.py"
      - "ops/original_a_dual_attestation_preflight.py"
      - "ops/vnext_live_main_signer_blocker_inventory.py"
      - "ops/tests/test_vnext_live_main_signer_blocker_inventory.py"
      - "docs/VNEXT_LIVE_MAIN_SIGNER_READINESS_20261115.md"
      - "ops/tests/test_original_a_dual_attestation_preflight.py"
      - "docs/VNEXT_A_DUAL_SIGNER_REKOR_POLICY_20261115.md"
      - "ops/tests/test_original_a_same_get_shadow_pair.py"
      - "docs/VNEXT_ORIGINAL_A_SHADOW_SOURCE_LINK_20261115.md"
      - "ops/tests/test_original_a_same_get_private_seal.py"
      - "docs/VNEXT_ORIGINAL_A_SAME_GET_PRIVATE_CAPTURE_20261115.md"
      - "ops/original_a_openliga_raw_replay_gap.py"
      - "ops/tests/test_original_a_openliga_raw_replay_gap.py"
      - "ops/research_manifests/openliga_original_a_crossrun_20261115_pinned.json"
      - "docs/VNEXT_A_OPENLIGA_CROSSRUN_PROVENANCE_20261115.md"
      - "ops/tests/test_penaltyblog_a_shadow_native_handoff.py"
      - "ops/tests/penaltyblog_shadow_native_real_smoke.py"
      - "docs/PENALTYBLOG_SHADOW_NATIVE_HANDOFF_20261115.md"
      - "ops/tests/test_penaltyblog_a_dual_prematch_capture.py"
      - "ops/tests/penaltyblog_a_dual_real_smoke.py"
      - "docs/PENALTYBLOG_A_DUAL_PREMATCH_HANDOFF_20261115.md"
      - "ops/penaltyblog_paired_uncertainty.py"
      - "ops/tests/test_penaltyblog_two_model_pipeline.py"
      - "ops/tests/test_penaltyblog_paired_uncertainty.py"
      - "ops/tests/penaltyblog_two_model_pipeline_real_smoke.py"
      - ".github/workflows/penaltyblog-two-model-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  live-readonly-signer-inventory:
    # Reads the actual current GitHub main/protection/rulesets and this PR's
    # current-HEAD reviews. It CANNOT authorize a signer, merge or upload data.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test read-only governance inventory fail-closed contract
        run: python -m unittest discover -s ops/tests -p test_vnext_live_main_signer_blocker_inventory.py -v
      - name: Inspect ACTUAL GitHub main governance and signer absence via read-only API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m ops.vnext_live_main_signer_blocker_inventory --live > "$RUNNER_TEMP/vnext-real-signer-blockers.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "vnext-real-signer-blockers.json").read_text())
          assert report["live_github_api_observed"] is True
          assert report["status"] == "HOLD"
          assert report["production_recommendations"] == "DISABLED"
          assert report["signer_authorized"] is False
          assert report["attested_original_a_and_source"] is False
          assert report["source_rights_independently_approved"] is False
          assert report["certified_prospective_samples"] == 0
          assert report["positive_ev_verified"] is False
          print("ACTUAL READ-ONLY GITHUB API GOVERNANCE:", 
                ", ".join(report["blockers"]))
          print("main_protected:", report["observations"].get("main_protected_flag"))
          print("actual signer workflow on main:",
                report["observations"].get("main_signer_workflow_exists", False))
          print("independent current-HEAD review candidates:",
                report["observations"].get("current_head_distinct_review_candidates"))
          print("Signatures, provider rights, source truth and EV NOT authenticated.")
          PY

  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test integrated fail-closed pipeline
        run: python -m unittest discover -s ops/tests -p test_penaltyblog_two_model_pipeline.py -v
      - name: Verify A/Poisson/Dixon-Coles local pre-kickoff handoff
        run: python -m unittest discover -s ops/tests -p test_penaltyblog_a_dual_prematch_capture.py -v
      - name: Validate native original A shadow source-time and identity handoff
        run: python -m unittest discover -s ops/tests -p test_penaltyblog_a_shadow_native_handoff.py -v
      - name: Check raw publisher-byte vs A shadow original Git object safety
        run: python -m unittest discover -s ops/tests -p test_original_a_openliga_raw_replay_gap.py -v
      - name: Reconcile real Nov 15 pinned OpenLigaDB vs A source bytes (HOLD expected)
        run: |
          set -euo pipefail
          python -m ops.original_a_openliga_raw_replay_gap \
            --manifest ops/research_manifests/openliga_original_a_crossrun_20261115_pinned.json \
            --repo-root . > "$RUNNER_TEMP/original-a-source-replay-gap.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                          "original-a-source-replay-gap.json").read_text())
          assert r["byte_pins_checked"] is True
          assert r["controlled_capture_content_replayed"] is True
          assert r["original_a_predictions"] == 29
          assert r["reason"] == "SOURCE_CAPTURE_COMPLETED_AFTER_A_FORECAST"
          assert r["status"] == "HOLD"
          assert r["production_recommendations"] == "DISABLED"
          assert r["source_response_pair_certified"] is False
          assert r["independent_capture_attestation_reverified"] is False
          assert r["independent_forecast_attestation_reverified"] is False
          assert r["certified_prospective_samples"] == 0
          assert r["positive_ev_verified"] is False
          print("PINNED REAL NOV15 ORIGINAL SOURCE CROSSRUN: 29 shadow rows; "
                "raw capture completed after A forecast. Zero eligible same-run "
                "source samples; no signature verification or EV. HOLD.")
          PY
      - name: Verify actual original A one-GET private raw capture and tamper refusal
        run: python -m unittest discover -s ops/tests -p test_original_a_same_get_private_seal.py -v
      - name: Verify private original-A to same-GET raw source per-fixture linkage
        run: python -m unittest discover -s ops/tests -p test_original_a_same_get_shadow_pair.py -v
      - name: Test main-only independent source and A-link Rekor attestations (mocked CLI only)
        run: python -m unittest discover -s ops/tests -p test_original_a_dual_attestation_preflight.py -v
      - name: Test paired uncertainty and bootstrap guardrails
        run: python -m unittest discover -s ops/tests -p test_penaltyblog_paired_uncertainty.py -v
  real-penaltyblog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional dependency
        run: python -m pip install penaltyblog==1.13.1
      - name: Run real Poisson and Dixon-Coles integrated smoke
        run: python -m ops.tests.penaltyblog_two_model_pipeline_real_smoke
      - name: Run real upstream Poisson and DC in a single time-bounded synthetic A handoff
        run: python -m ops.tests.penaltyblog_a_dual_real_smoke
      - name: Validate exact original shadow producer native-ID to real Penaltyblog handoff
        run: python -m ops.tests.penaltyblog_shadow_native_real_smoke
