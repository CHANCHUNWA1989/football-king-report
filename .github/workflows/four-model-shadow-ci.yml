name: Four-model shadow audit CI
on:
  pull_request:
    paths:
      - 'ops/shadow_four_model_audit.py'
      - 'ops/shadow_verified_adapter.py'
      - 'ops/shadow_daily_report.py'
      - 'ops/shadow_archive_bridge.py'
      - 'ops/shadow_ft_observation_bridge.py'
      - 'ops/shadow_raw_source_collector.py'
      - 'ops/shadow_raw_ft_parser.py'
      - 'ops/shadow_ft_correlator.py'
      - 'ops/shadow_seal_coverage.py'
      - 'ops/tests/test_shadow_ft_correlator.py'
      - 'ops/tests/test_shadow_source_pipeline.py'
      - 'ops/tests/test_shadow_raw_ft_parser.py'
      - 'ops/tests/test_shadow_raw_source_collector.py'
      - 'ops/tests/test_shadow_ft_observation_bridge.py'
      - '.github/workflows/four-model-shadow-daily.yml'
      - 'ops/result_consensus_gate.py'
      - 'ops/tests/test_shadow_four_model_audit.py'
      - 'ops/tests/test_shadow_verified_adapter.py'
      - 'ops/tests/test_shadow_daily_report.py'
      - '.github/workflows/four-model-shadow-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile ops/shadow_four_model_audit.py ops/shadow_verified_adapter.py ops/shadow_daily_report.py ops/shadow_archive_bridge.py ops/shadow_ft_observation_bridge.py ops/shadow_raw_source_collector.py ops/shadow_raw_ft_parser.py ops/shadow_ft_correlator.py ops/shadow_seal_coverage.py ops/result_consensus_gate.py ops/tests/test_shadow_four_model_audit.py ops/tests/test_shadow_verified_adapter.py ops/tests/test_shadow_daily_report.py ops/tests/test_shadow_ft_observation_bridge.py ops/tests/test_shadow_raw_source_collector.py ops/tests/test_shadow_raw_ft_parser.py ops/tests/test_shadow_ft_correlator.py ops/tests/test_shadow_source_pipeline.py
      - name: Correlator CLI JSON output contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"sources":[]}' > /tmp/shadow-ft-empty.json
          PYTHONPATH=ops python ops/shadow_ft_correlator.py --input /tmp/shadow-ft-empty.json --output /tmp/shadow-ft-out.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/shadow-ft-out.json').read_text())
          assert data['status']=='HOLD'
          assert data['production_recommendations']=='DISABLED'
          assert data['independently_verified'] is False
          assert data['agreements']==[]
          print('CLI contract passed')
          PY
      - name: Unit tests
        run: PYTHONPATH=ops python -m unittest ops.tests.test_shadow_four_model_audit ops.tests.test_shadow_verified_adapter ops.tests.test_shadow_daily_report ops.tests.test_shadow_ft_observation_bridge ops.tests.test_shadow_raw_source_collector ops.tests.test_shadow_raw_ft_parser ops.tests.test_shadow_ft_correlator ops.tests.test_shadow_source_pipeline -v

  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch actual Bundesliga source payloads
        shell: bash
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          if [ "$MONTH" -lt 7 ]; then YEAR=$((YEAR - 1)); fi
          python ops/shadow_raw_source_collector.py --year "$YEAR" --output-dir smoke/raw
          python ops/shadow_raw_ft_parser.py --raw-dir smoke/raw --output smoke/parsed.json
          PYTHONPATH=ops python ops/shadow_ft_correlator.py --input smoke/parsed.json --output smoke/correlations.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('smoke/raw/manifest.json').read_text())
          p=json.loads(Path('smoke/parsed.json').read_text())
          c=json.loads(Path('smoke/correlations.json').read_text())
          for source in m['sources']:
              print('SOURCE',source['provider'],source['status'],source.get('error_type','none'),source.get('bytes',0))
          for source in p['sources']:
              print('PARSED',source['provider'],len(source['records']))
          print('CORRELATION',c['status'],'agreements',len(c['agreements']),'conflicts',len(c['conflicts']),'ambiguous',c['ambiguous'],'unmatched_first',c.get('unmatched',0),'unmatched_second',c.get('unmatched_second',0))
          assert m['status']=='HOLD'
          assert c['independently_verified'] is False
          assert c['production_recommendations']=='DISABLED'
          PY
      - name: Audit pre-match archive coverage without upgrading results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=ops python ops/shadow_seal_coverage.py --archives research_pairs --correlations smoke/correlations.json --output smoke/seal_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('smoke/seal_coverage.json').read_text())
          print('SEAL COVERAGE', 'agreements',c['source_agreements'],'eligible_bundesliga_archives',c['eligible_bundesliga_pairs'],'matched',c['matched_agreements'],'missing',c['missing_sealed_pairs'],'ambiguous',c['ambiguous_sealed_pairs'],'archive_leagues',c['archive_leagues'],'archive_dates',c['archive_date_range'],'agreement_dates',c['agreement_date_range'],'sealed_newer_than_source',c['upcoming_sealed_bundesliga'],'sealed_not_newer_than_source',c['completed_unmatched_sealed_bundesliga'],'source_lag_days',c['source_lag_days'],'stale_14d',c['source_stale_14d'],'archive_after_source',c['archive_after_latest_source'],'first_sealed_bundesliga',c['next_sealed_bundesliga_date'],'last_sealed_bundesliga',c['last_sealed_bundesliga_date'],'kickoff_passed_2h',c['sealed_bundesliga_kickoff_passed_2h'],'not_yet_settleable',c['sealed_bundesliga_not_yet_settleable'],'matured_unmatched',c['matured_unmatched_count'])
          assert c['status']=='HOLD' and c['independently_verified'] is False
          assert len(c['matured_unmatched_fixtures'])==c['matured_unmatched_count']
          print('MATURED RESEARCH QUEUE',[(x['home'],x['away'],x['kickoff_utc']) for x in c['matured_unmatched_fixtures']])
          assert c['production_recommendations']=='DISABLED'
          PY
      - name: Upload real-source diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-model-live-source-smoke
          path: smoke/
          retention-days: 7
          if-no-files-found: warn
