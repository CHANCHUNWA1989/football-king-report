name: Four-model shadow audit CI
on:
  pull_request:
    paths:
      - 'ops/shadow_four_model_audit.py'
      - 'ops/shadow_verified_adapter.py'
      - 'ops/shadow_daily_report.py'
      - 'ops/shadow_archive_bridge.py'
      - 'ops/shadow_ft_observation_bridge.py'
      - 'ops/shadow_raw_source_collector.py'
      - 'ops/shadow_raw_ft_parser.py'
      - 'ops/tests/test_shadow_raw_ft_parser.py'
      - 'ops/tests/test_shadow_raw_source_collector.py'
      - 'ops/tests/test_shadow_ft_observation_bridge.py'
      - '.github/workflows/four-model-shadow-daily.yml'
      - 'ops/result_consensus_gate.py'
      - 'ops/tests/test_shadow_four_model_audit.py'
      - 'ops/tests/test_shadow_verified_adapter.py'
      - 'ops/tests/test_shadow_daily_report.py'
      - '.github/workflows/four-model-shadow-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile ops/shadow_four_model_audit.py ops/shadow_verified_adapter.py ops/shadow_daily_report.py ops/shadow_archive_bridge.py ops/shadow_ft_observation_bridge.py ops/shadow_raw_source_collector.py ops/shadow_raw_ft_parser.py ops/result_consensus_gate.py ops/tests/test_shadow_four_model_audit.py ops/tests/test_shadow_verified_adapter.py ops/tests/test_shadow_daily_report.py ops/tests/test_shadow_ft_observation_bridge.py ops/tests/test_shadow_raw_source_collector.py ops/tests/test_shadow_raw_ft_parser.py
      - name: Unit tests
        run: PYTHONPATH=ops python -m unittest ops.tests.test_shadow_four_model_audit ops.tests.test_shadow_verified_adapter ops.tests.test_shadow_daily_report ops.tests.test_shadow_ft_observation_bridge ops.tests.test_shadow_raw_source_collector ops.tests.test_shadow_raw_ft_parser -v
