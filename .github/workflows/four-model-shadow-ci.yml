  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile ops/tests/test_ndr_penalty_period_policy.py ops/tests/test_ndr_period_capture.py ops/ndr_detail_selection.py ops/tests/test_ndr_detail_selection.py ops/tests/test_ndr_rotating_capture.py ops/raw_origin_metadata.py ops/openliga_capture_pack.py ops/openliga_capture_provenance.py ops/archive_openliga_capture.py ops/tests/test_raw_origin_metadata.py ops/tests/test_raw_origin_consumers.py ops/tests/test_openliga_capture_pack.py ops/tests/test_openliga_capture_provenance.py ops/tests/test_archive_openliga_capture.py ops/shadow_four_model_audit.py ops/shadow_verified_adapter.py ops/shadow_daily_report.py ops/shadow_mobile_report.py ops/shadow_archive_bridge.py ops/shadow_ft_observation_bridge.py ops/shadow_raw_source_collector.py ops/shadow_global_source_collector.py ops/shadow_global_coverage_report.py ops/shadow_raw_ft_parser.py ops/shadow_ft_correlator.py ops/shadow_seal_coverage.py ops/shadow_manual_evidence_gate.py ops/shadow_external_evidence_collector.py ops/shadow_external_evidence_probe.py ops/ndr_result_observations.py ops/ndr_completion_observations.py ops/ndr_completion_collector.py ops/ndr_capture_pack.py ops/ndr_capture_provenance.py ops/archive_ndr_capture_provenance.py ops/tests/test_ndr_capture_pack.py ops/tests/test_ndr_capture_provenance.py ops/tests/test_archive_ndr_capture_provenance.py ops/tests/test_ndr_completion_observations.py ops/tests/test_ndr_completion_collector.py ops/tests/test_ndr_result_observations.py ops/shadow_research_readiness.py ops/shadow_score_candidate_diagnostics.py ops/shadow_score_ambiguity_gate.py ops/shadow_source_gap_matrix.py ops/shadow_pipeline_integrity.py ops/shadow_parsed_observation_ingest.py ops/result_consensus_gate.py ops/tests/test_shadow_four_model_audit.py ops/tests/test_shadow_verified_adapter.py ops/tests/test_shadow_daily_report.py ops/tests/test_shadow_ft_observation_bridge.py ops/tests/test_shadow_raw_source_collector.py ops/tests/test_shadow_global_source_collector.py ops/tests/test_shadow_global_coverage_report.py ops/tests/test_shadow_raw_ft_parser.py ops/tests/test_shadow_ft_correlator.py ops/tests/test_shadow_source_pipeline.py ops/tests/test_shadow_external_evidence_probe.py ops/tests/test_shadow_research_readiness.py ops/tests/test_shadow_score_candidate_diagnostics.py ops/tests/test_shadow_score_ambiguity_gate.py ops/tests/test_shadow_source_gap_matrix.py ops/tests/test_shadow_pipeline_integrity.py ops/tests/test_shadow_parsed_observation_ingest.py ops/tests/test_shadow_mobile_report.py ops/trusted_result_evidence.py ops/tests/test_trusted_result_evidence.py ops/tests/test_result_consensus_gate.py ops/two_source_ft_evidence.py ops/tests/test_two_source_ft_evidence.py ops/unified_evidence_manifest.py ops/tests/test_unified_evidence_manifest.py ops/tests/test_certified_settlement_counter_chain.py ops/tests/test_evidence_readiness_inventory.py ops/index_origin_metadata.py ops/tests/test_shadow_external_evidence_collector.py ops/tests/test_index_origin_evidence.py
      - name: Correlator CLI JSON output contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"sources":[]}' > /tmp/shadow-ft-empty.json
          PYTHONPATH=ops python ops/shadow_ft_correlator.py --input /tmp/shadow-ft-empty.json --output /tmp/shadow-ft-out.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/shadow-ft-out.json').read_text())
          assert data['status']=='HOLD'
          assert data['production_recommendations']=='DISABLED'
          assert data['independently_verified'] is False
          assert data['agreements']==[]
          print('CLI contract passed')
          PY
      - name: Manual FT evidence quarantine
        run: PYTHONPATH=ops python ops/shadow_manual_evidence_gate.py --input shadow/dfb_matchday5_manual_evidence.json
      - name: Prospective fixed fixture identity and signed-source consistency
        run: PYTHONPATH=ops python -m unittest ops.tests.test_fixed_fixture_lineage ops.tests.test_forecast_provenance_audit -v
      - name: Fresh forecast proof selection and raw fixed-ID replay
        run: PYTHONPATH=ops python -m unittest ops.tests.test_prepare_forecast_proof ops.tests.test_raw_openligadb_identity_linkage -v
      - name: Controlled raw-origin, signature replay and immutable archive tests
        run: PYTHONPATH=ops python -m unittest ops.tests.test_raw_origin_metadata ops.tests.test_raw_origin_consumers ops.tests.test_openliga_capture_pack ops.tests.test_openliga_capture_provenance ops.tests.test_archive_openliga_capture -v
      - name: Bounded NDR UTC-day selection and original capture replay
        run: PYTHONPATH=ops python -m unittest ops.tests.test_ndr_detail_selection ops.tests.test_ndr_rotating_capture -v
      - name: Versioned NDR ordinary-penalty policy and immutable capture replay
        run: PYTHONPATH=ops python -m unittest ops.tests.test_ndr_penalty_period_policy ops.tests.test_ndr_period_capture -v
      - name: Unit tests
        run: PYTHONPATH=ops python -m unittest ops.tests.test_shadow_four_model_audit ops.tests.test_shadow_verified_adapter ops.tests.test_shadow_daily_report ops.tests.test_shadow_ft_observation_bridge ops.tests.test_shadow_raw_source_collector ops.tests.test_shadow_global_source_collector ops.tests.test_shadow_global_coverage_report ops.tests.test_shadow_raw_ft_parser ops.tests.test_shadow_ft_correlator ops.tests.test_shadow_source_pipeline ops.tests.test_shadow_external_evidence_probe ops.tests.test_ndr_result_observations ops.tests.test_shadow_external_evidence_collector ops.tests.test_index_origin_evidence ops.tests.test_ndr_completion_observations ops.tests.test_ndr_completion_collector ops.tests.test_ndr_capture_pack ops.tests.test_ndr_capture_provenance ops.tests.test_trusted_result_evidence ops.tests.test_result_consensus_gate ops.tests.test_two_source_ft_evidence ops.tests.test_unified_evidence_manifest ops.tests.test_certified_settlement_counter_chain ops.tests.test_evidence_readiness_inventory ops.tests.test_archive_ndr_capture_provenance ops.tests.test_shadow_research_readiness ops.tests.test_shadow_score_candidate_diagnostics ops.tests.test_shadow_score_ambiguity_gate ops.tests.test_shadow_source_gap_matrix ops.tests.test_shadow_pipeline_integrity ops.tests.test_shadow_parsed_observation_ingest ops.tests.test_shadow_mobile_report -v

  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch actual Bundesliga source payloads
        shell: bash
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          if [ "$MONTH" -lt 7 ]; then YEAR=$((YEAR - 1)); fi
          python ops/shadow_raw_source_collector.py --year "$YEAR" --output-dir smoke/raw
          python ops/shadow_raw_ft_parser.py --raw-dir smoke/raw --output smoke/parsed.json
          PYTHONPATH=ops python ops/shadow_ft_correlator.py --input smoke/parsed.json --output smoke/correlations.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('smoke/raw/manifest.json').read_text())
          p=json.loads(Path('smoke/parsed.json').read_text())
          c=json.loads(Path('smoke/correlations.json').read_text())
          for source in m['sources']:
              print('SOURCE',source['provider'],source['status'],source.get('error_type','none'),source.get('bytes',0))
          for source in p['sources']:
              print('PARSED',source['provider'],len(source['records']))
          print('CORRELATION',c['status'],'agreements',len(c['agreements']),'conflicts',len(c['conflicts']),'ambiguous',c['ambiguous'],'unmatched_first',c.get('unmatched',0),'unmatched_second',c.get('unmatched_second',0))
          assert m['status']=='HOLD'
          assert c['independently_verified'] is False
          assert c['production_recommendations']=='DISABLED'
          PY
      - name: Reverify actual archived forecasts and replay existing raw fixed IDs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python ops/prepare_forecast_proof.py \
            --archives forecast_provenance \
            --output-dir "$RUNNER_TEMP/ci-forecast-proof" \
            > smoke/forecast_proof_selection.json
          python - <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          selection = json.loads(Path('smoke/forecast_proof_selection.json').read_text())
          output = Path('smoke/raw_fixed_identity_linkage.json')
          subprocess.run([
              sys.executable, 'ops/raw_openligadb_identity_linkage.py',
              '--raw-dir', 'smoke/raw', '--proof', selection['proof_dir'],
              '--source-sha', selection['source_sha'], '--workflow-sha', selection['workflow_sha'],
              '--run-id', selection['run_id'], '--attempt', selection['attempt'],
              '--output', str(output),
          ], check=True)
          report = json.loads(output.read_text())
          assert report['audit_completed'] is True and report['forecast_signature_reverified'] is True
          assert report['status'] == 'HOLD' and report['production_recommendations'] == 'DISABLED'
          assert report['independently_verified'] is False and report['eligible_for_model_scoring'] is False
          assert report['eligible_for_betting_promotion'] is False
          print('Fresh CLI forecast verification and fixed-ID replay passed; results remain unauthenticated.')
          PYTHON
      - name: Replay existing OpenLigaDB raw bytes without additional sports requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          from ops.openliga_capture_pack import prepare, validate_capture
          manifest = json.loads(Path('smoke/raw/manifest.json').read_text())
          receipt = next(item for item in manifest['sources'] if item['provider'] == 'OpenLigaDB')
          if receipt['status'] == 'FETCHED_UNVERIFIED':
              subject = Path(os.environ['RUNNER_TEMP']) / 'openliga-smoke' / 'openliga-capture.tar'
              prepare(Path('smoke/raw'), subject)
              replay = validate_capture(subject.read_bytes())
              linkage = json.loads(Path('smoke/raw_fixed_identity_linkage.json').read_text())
              assert linkage['raw_origin_receipts_structurally_replayed'] is True
              assert replay['raw_sha256'] == linkage['raw_sha256']
              assert replay['origin_chain_scope'] == 'OPENLIGADB_ONLY'
              assert replay['independently_verified'] is False
              assert replay['eligible_for_model_scoring'] is False
              assert replay['production_recommendations'] == 'DISABLED'
              Path('smoke/openliga_capture_pack.json').write_text(json.dumps(replay, indent=2) + '\n')
              print('OpenLiga-only original bytes and per-request receipts replayed; no signature, publisher truth or independent FT claim in PR smoke.')
          else:
              print('OpenLigaDB raw subject unavailable after source error; HOLD, no capture authentication claim.')
          PYTHON
      - name: Collect six global league feeds (unverified research)
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          if [ "$MONTH" -lt 7 ]; then YEAR=$((YEAR - 1)); fi
          PYTHONPATH=ops python ops/shadow_global_source_collector.py --year "$YEAR" --output-dir smoke/global_raw
      - name: Audit global raw provenance and coverage
        run: PYTHONPATH=ops python ops/shadow_global_coverage_report.py --raw-dir smoke/global_raw --output smoke/global_coverage.json
      - name: Fetch external DFB and NDR evidence (research-only)
        run: python ops/shadow_external_evidence_collector.py --output-dir smoke/external_raw
      - name: Parse exact NDR row observations from existing raw fetch
        run: |
          python ops/ndr_result_observations.py --raw-dir smoke/external_raw --output smoke/ndr_result_observations.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report=json.loads(Path('smoke/ndr_result_observations.json').read_text(encoding='utf-8'))
          assert report['status']=='HOLD' and report['production_recommendations']=='DISABLED'
          assert report['independently_verified'] is False and report['eligible_for_model_scoring'] is False
          print('NDR unverified row observations:',len(report['observations']))
          PYTHON
      - name: Check bounded NDR completion detail observations
        run: |
          python -m ops.ndr_completion_collector --raw-dir smoke/external_raw --output-dir smoke/ndr_completion --limit 3
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report=json.loads(Path('smoke/ndr_completion/report.json').read_text(encoding='utf-8'))
          assert report['status']=='HOLD' and report['production_recommendations']=='DISABLED'
          assert report['independently_verified'] is False and report['eligible_for_model_scoring'] is False
          from ops.ndr_completion_observations import NEW_POLICY
          assert NEW_POLICY == 'NDR_REGULATION_EVENT_ICONS_V2'
          assert report['schema'] == 'football-king-ndr-completion-observations-v3'
          assert report['parser_policy'] == NEW_POLICY
          manifest=json.loads(Path('smoke/ndr_completion/manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'football-king-ndr-completion-raw-evidence-v3'
          assert manifest['parser_policy'] == NEW_POLICY
          assert manifest['selection'] == report['selection'] and manifest['sources'] == report['sources']
          for observation in report['observations']:
              assert observation['parser_policy'] == NEW_POLICY
              assert observation['completion_authenticated'] is False and observation['period_authenticated'] is False
              assert observation['independently_verified'] is False and observation['eligible_for_model_scoring'] is False
              assert observation['status'] == 'HOLD' and observation['production_recommendations'] == 'DISABLED'
          assert type(report['requests_attempted']) is int and 0 <= report['requests_attempted'] <= 3
          from datetime import datetime
          from ops.ndr_completion_collector import _validated_rows
          from ops.ndr_detail_selection import select_rows
          from ops.ndr_result_observations import observe
          attempted_ids = [item['provider_fixture_id'] for item in report['sources']]
          assert len(attempted_ids) == len(set(attempted_ids)) == report['requests_attempted']
          if report['source_available']:
              rows = _validated_rows(observe(Path('smoke/external_raw'), now=datetime.fromisoformat(report['captured_utc'].replace('Z', '+00:00'))))
              selected, selection = select_rows(rows, captured_utc=report['captured_utc'], limit=3)
              assert report['selection'] == selection
              assert attempted_ids == [item['provider_fixture_id'] for item in selected] == selection['selected_fixture_ids']
              print('NDR bounded UTC-day plan replayed:', selection['day_utc'], attempted_ids)
          else:
              assert report['selection'] is None and attempted_ids == []
              print('NDR index unavailable; no selection, no detail GETs, HOLD remains.')
          print('Unverified explicit completion displays:',len(report['observations']))
          PYTHON
      - name: Replay bounded NDR capture from original bytes
        run: python -m ops.ndr_capture_pack --index smoke/external_raw --completion smoke/ndr_completion --output "$RUNNER_TEMP/ndr-smoke/ndr-capture.tar"
      - name: Report external raw-source fetch health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('smoke/external_raw/manifest.json').read_text())
          for s in m['sources']:
              print('EXTERNAL RAW',s['provider'],s['status'],'bytes',s.get('bytes',0),'error',s.get('error_type','none'),'sha256',s.get('raw_sha256','none'))
          assert m['status']=='HOLD' and m['eligible_for_model_scoring'] is False
          PY
      - name: Audit pre-match archive coverage without upgrading results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=ops python ops/shadow_seal_coverage.py --archives research_pairs --correlations smoke/correlations.json --output smoke/seal_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('smoke/seal_coverage.json').read_text())
          print('SEAL COVERAGE', 'agreements',c['source_agreements'],'eligible_bundesliga_archives',c['eligible_bundesliga_pairs'],'matched',c['matched_agreements'],'missing',c['missing_sealed_pairs'],'ambiguous',c['ambiguous_sealed_pairs'],'archive_leagues',c['archive_leagues'],'archive_dates',c['archive_date_range'],'agreement_dates',c['agreement_date_range'],'sealed_newer_than_source',c['upcoming_sealed_bundesliga'],'sealed_not_newer_than_source',c['completed_unmatched_sealed_bundesliga'],'source_lag_days',c['source_lag_days'],'stale_14d',c['source_stale_14d'],'archive_after_source',c['archive_after_latest_source'],'first_sealed_bundesliga',c['next_sealed_bundesliga_date'],'last_sealed_bundesliga',c['last_sealed_bundesliga_date'],'kickoff_passed_2h',c['sealed_bundesliga_kickoff_passed_2h'],'not_yet_settleable',c['sealed_bundesliga_not_yet_settleable'],'matured_unmatched',c['matured_unmatched_count'])
          assert c['status']=='HOLD' and c['independently_verified'] is False
          assert len(c['matured_unmatched_fixtures'])==c['matured_unmatched_count']
          print('MATURED RESEARCH QUEUE',[(x['home'],x['away'],x['kickoff_utc']) for x in c['matured_unmatched_fixtures']])
          assert c['production_recommendations']=='DISABLED'
          PY
      - name: Identify exact missing structured FT per matured fixture
        run: python ops/shadow_source_gap_matrix.py --coverage smoke/seal_coverage.json --parsed smoke/parsed.json --output smoke/source_gap_matrix.json
      - name: Probe external pages for fixture identities (non-scoring)
        run: python ops/shadow_external_evidence_probe.py --raw-dir smoke/external_raw --coverage smoke/seal_coverage.json --output smoke/external_probe.json
      - name: Diagnose fixture-specific score-like tokens (not verified FT)
        run: python ops/shadow_score_candidate_diagnostics.py --probe smoke/external_probe.json --output smoke/score_candidate_diagnostics.json
      - name: Triage conflicting score-like contexts (not FT)
        run: python ops/shadow_score_ambiguity_gate.py --diagnostics smoke/score_candidate_diagnostics.json --output smoke/score_ambiguity_triage.json
      - name: Export sealed pairs and summarize research readiness
        run: |
          PYTHONPATH=ops python ops/shadow_archive_bridge.py --archives research_pairs --output smoke/sealed_from_archives.json
          PYTHONPATH=ops python ops/shadow_parsed_observation_ingest.py --sealed smoke/sealed_from_archives.json --parsed smoke/parsed.json --output smoke/parsed_ft_observation_bundle.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('smoke/parsed_ft_observation_bundle.json').read_text())
          Path('smoke/independent_observations.json').write_text(json.dumps(data['observations']))
          PY
          PYTHONPATH=ops python ops/shadow_daily_report.py --sealed smoke/sealed_from_archives.json --results smoke/independent_observations.json --output smoke/four_model_daily.json
          python ops/shadow_research_readiness.py --coverage smoke/seal_coverage.json --probe smoke/external_probe.json --correlations smoke/correlations.json --daily smoke/four_model_daily.json --output smoke/research_readiness.json
      - name: Fail closed on inconsistent research artifacts
        run: python ops/shadow_pipeline_integrity.py --archives smoke/sealed_from_archives.json --coverage smoke/seal_coverage.json --gaps smoke/source_gap_matrix.json --probe smoke/external_probe.json --ambiguity smoke/score_ambiguity_triage.json --daily smoke/four_model_daily.json --readiness smoke/research_readiness.json --output smoke/pipeline_integrity.json
      - name: Render live-source mobile research report
        run: PYTHONPATH=ops python ops/shadow_mobile_report.py --readiness smoke/research_readiness.json --integrity smoke/pipeline_integrity.json --daily smoke/four_model_daily.json --parsed smoke/parsed.json --global-coverage smoke/global_coverage.json --output smoke/DAILY_STATUS.md
      - name: Publish live research results on GitHub Actions
        if: always()
        shell: bash
        run: |
          if [ -f smoke/DAILY_STATUS.md ]; then
            cat smoke/DAILY_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## 足球王者｜即時來源檢查未完成'
              echo ''
              echo 'HOLD / SHADOW ONLY；正式推薦 DISABLED。請檢查失敗步驟及 smoke 診斷檔案。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload real-source diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-model-live-source-smoke
          path: smoke/
          retention-days: 7
          if-no-files-found: warn
