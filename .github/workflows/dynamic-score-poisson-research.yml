name: Dynamic score-driven Poisson challenger (HOLD)

on:
  pull_request:
    paths:
      - "ops/date_only_ensemble_replay.py"
      - "ops/tests/test_date_only_ensemble_replay.py"
      - "ops/reused_model_triage.py"
      - "ops/tests/test_reused_model_triage.py"
      - "ops/dynamic_score_driven_poisson.py"
      - "ops/dynamic_2026_date_split_audit.py"
      - "ops/tests/test_dynamic_score_driven_poisson.py"
      - "ops/tests/test_dynamic_2026_date_split_audit.py"
      - "docs/DYNAMIC_SCORE_POISSON_CHALLENGER_20261117.md"
      - ".github/workflows/dynamic-score-poisson-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-lookahead:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify code compiles
        run: python -m py_compile ops/dynamic_score_driven_poisson.py ops/dynamic_2026_date_split_audit.py
      - name: Reject time leakage and test score-driven updates
        run: |
          python -m unittest ops.tests.test_dynamic_score_driven_poisson ops.tests.test_dynamic_2026_date_split_audit ops.tests.test_reused_model_triage ops.tests.test_date_only_ensemble_replay -v

  actual-2025-2026-reused-date-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real reference Poisson and Dixon-Coles
        run: python -m pip install penaltyblog==1.13.1
      - name: Run real public 2025 train / 2026 186 held-out exploratory comparison
        run: |
          mkdir -p output
          python -m ops.dynamic_2026_date_split_audit --output output/dynamic_2026_reused_date_split.json
      - name: Block any claimed prospective skill, real EV or missing score cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/dynamic_2026_reused_date_split.json").read_text())
          assert r["status"]=="HOLD"
          assert r["production_recommendations"]=="DISABLED"
          assert r["positive_ev_verified"] is False
          assert r["model_promoted"] is False
          assert r["certified_prospective_samples"]==0
          assert r["original_holdout_untouched_confirmatory"] is False
          assert r["training_real_matches"]==260, r.get("reason")
          assert r["source_test_rows"]==186
          assert r["same_eligible_heldout_games"]==186
          assert r["tested_models"]==["original_A","poisson","dixon_coles","dynamic_score_poisson"]
          for name,markets in r["per_model_scores"].items():
              assert set(markets)=={"1X2","OVER_2.5","OVER_2.75","OVER_3.0","HOME_AH_-0.25"}
              for line in ("2.5","2.75","3.0"):
                  item=markets["OVER_"+line]
                  assert sum(item["observed_class_counts"].values())==186
                  assert abs(sum(item["mean_forecast_class_probability"].values())-1)<1e-5
                  print("REUSED_TOTALS_CALIBRATION",name,line,
                        "BRIER",item["mean_brier"],"LOGLOSS",item["mean_logloss"],
                        "COUNTS",item["observed_class_counts"],
                        "MEAN_P",item["mean_forecast_class_probability"])
              assert all(m["n"]==186 for m in markets.values())
              print("REUSED_REAL_DYNAMIC_2026",name,
                    "1X2_BRIER",markets["1X2"]["mean_brier"],
                    "1X2_LOGLOSS",markets["1X2"]["mean_logloss"],
                    "1X2_HIT",markets["1X2"]["top_1_accuracy"],
                    "O2.75_BRIER",markets["OVER_2.75"]["mean_brier"],
                    "AH-0.25_BRIER",markets["HOME_AH_-0.25"]["mean_brier"])
          for market,details in r["dynamic_minus_dixon_coles_paired_date_cluster_CI95"].items():
              for metric,stats in details.items():
                  print("REUSED_REAL_DYNAMIC_CI",market,metric,
                        "DIFF",stats["mean_delta"],
                        "INTERVAL",stats["interval_95pct"])
          from ops.reused_model_triage import evaluate
          triage=evaluate(r)
          assert triage["status"]=="HOLD"
          assert triage["production_recommendations"]=="DISABLED"
          assert triage["certified_prospective_samples"]==0
          assert triage["production_weights_changed"] is False
          assert triage["research_triage"]=={
              "1X2":"DEPRIORITIZE_ON_REUSED_COHORT",
              "HOME_AH_-0.25":"DEPRIORITIZE_ON_REUSED_COHORT",
              "OVER_2.5":"INCONCLUSIVE_KEEP_RESEARCH_ONLY",
              "OVER_2.75":"INCONCLUSIVE_KEEP_RESEARCH_ONLY",
              "OVER_3.0":"INCONCLUSIVE_KEEP_RESEARCH_ONLY"}
          print("REUSED_MODEL_TRIAGE",json.dumps(triage,sort_keys=True))
          fusion=r["date_only_ensemble_replay"]
          assert fusion["status"]=="HOLD"
          assert fusion["production_recommendations"]=="DISABLED"
          assert fusion["certified_prospective_samples"]==0
          assert fusion["production_weights_changed"] is False
          assert fusion["date_only_proxy_not_actual_result_availability"] is True
          assert fusion["paired_n"]==186
          assert 0<fusion["adaptive_active_n"]<=186
          for cohort in ("all_cohort","active_cohort"):
              expected=186 if cohort=="all_cohort" else fusion["adaptive_active_n"]
              assert set(fusion[cohort])=={"original_A","poisson","dixon_coles","dynamic_score_poisson","uniform","adaptive"}
              for model,metrics in fusion[cohort].items():
                  assert metrics["sample_count"]==expected
                  print("DATE_ONLY_FUSION",cohort,model,"N",expected,"BRIER",metrics["brier"],"LOGLOSS",metrics["log_loss"],"ECE",metrics["expected_confidence_calibration_error"],"HIT",metrics["accuracy"])

          PY
      - name: Archive diagnostics, never bookmaker odds or production picks
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-poisson-2026-reused-real-score-diagnostic-hold
          path: output/dynamic_2026_reused_date_split.json
          retention-days: 14
