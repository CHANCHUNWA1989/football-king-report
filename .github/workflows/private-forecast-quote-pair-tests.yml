name: Private forecast quote pairing research tests
on:
  pull_request:
    paths:
      - 'ops/private_forecast_quote_pair.py'
      - 'ops/tests/test_private_forecast_quote_pair.py'
      - 'ops/private_refit_forecast_adapter.py'
      - 'ops/tests/test_private_refit_forecast_adapter.py'
      - 'ops/private_pair_aggregate.py'
      - 'ops/private_live_refit.py'
      - 'ops/tests/test_private_live_refit.py'
      - 'ops/private_history_intake.py'
      - 'ops/tests/test_private_history_intake.py'
      - 'ops/private_history_csv_adapter.py'
      - 'ops/tests/test_private_history_csv_adapter.py'
      - 'ops/private_history_pinned.py'
      - 'ops/tests/test_private_history_pinned.py'
      - '.github/workflows/private-forecast-quote-pair-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict synthetic privacy and matching tests
        run: |
          python -m unittest discover -s ops/tests -p test_private_forecast_quote_pair.py -v
          python -m unittest discover -s ops/tests -p test_private_refit_forecast_adapter.py -v
          python -m unittest discover -s ops/tests -p test_private_pair_aggregate.py -v
          python -m unittest discover -s ops/tests -p test_private_live_refit.py -v
          python -m unittest discover -s ops/tests -p test_private_history_intake.py -v
          python -m unittest discover -s ops/tests -p test_private_history_csv_adapter.py -v
          python -m unittest discover -s ops/tests -p test_private_history_pinned.py -v
