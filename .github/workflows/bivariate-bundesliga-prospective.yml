name: Bivariate four-model future Bundesliga capture (research only)

on:
  pull_request:
    paths:
      - "ops/bivariate_four_model_prematch_gate.py"
      - "ops/tests/test_bivariate_four_model_prematch_gate.py"
      - "ops/live_bundesliga_three_model_probe.py"
      - "docs/BIVARIATE_FOUR_MODEL_FORWARD_CAPTURE_20261116.md"
      - ".github/workflows/bivariate-bundesliga-prospective.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-four-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure adapter compiles and blocks retrospective/fabricated records
        run: |
          python -m py_compile ops/bivariate_four_model_prematch_gate.py ops/live_bundesliga_three_model_probe.py
          python -m unittest ops.tests.test_bivariate_four_model_prematch_gate -v

  actual-future-four-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify unchanged original V4.1 gateway package
        run: |
          set -euo pipefail
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -
          mkdir -p app _unpacked
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d _unpacked
          test -f _unpacked/football_king_v4_1/fixture_gateway.py
          cp -a _unpacked/football_king_v4_1/. app/
      - name: Fit actual optional upstream Poisson/DC/bivariate implementations
        run: python -m pip install penaltyblog==1.13.1
      - name: One actual OpenLigaDB GET and true future 4-model local capture
        env:
          PYTHONPATH: "app:."
        run: |
          python -m ops.live_bundesliga_three_model_probe \
            --with-bivariate \
            --max-targets 2 \
            --output "$RUNNER_TEMP/real-bundesliga-four-model-hold.json"
      - name: Never accept incomplete, postkickoff or unverified-promoted observations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          p=Path(os.environ["RUNNER_TEMP"]) / "real-bundesliga-four-model-hold.json"
          report=json.loads(p.read_text())
          assert report["status"]=="HOLD", report.get("reason")
          assert report["production_recommendations"]=="DISABLED"
          assert report["positive_ev_verified"] is False
          assert report["certified_prospective_samples"]==0
          assert report["source_authenticity_verified"] is False
          assert report["historical_result_publication_times_verified"] is False
          assert report["optional_four_model_mode_requested"] is True
          assert report["real_upcoming_fixtures_with_four_model_predictions"]>=1
          rows=[r for r in report["forecasts"] if r.get("all_four_live_run")]
          assert len(rows)==report["real_upcoming_fixtures_with_four_model_predictions"]
          for row in rows:
              assert row["same_a_and_challenger_training_event_ids"] is True
              assert len(row["a_1x2"])==len(row["poisson_1x2"])==len(
                  row["dixon_coles_1x2"])==len(row["bivariate_poisson_1x2"])==3
              assert row["actual_bookmaker_lines_or_prices_verified"] is False
              assert row["ah_ou_calibrated_model_or_positive_ev_verified"] is False
              print("UNVERIFIED_LIVE_PREKICKOFF_4MODEL",
                    row["event_id"],row["kickoff_utc"],
                    "local_capture_finish", row["local_fourth_model_finished_utc"],
                    "source_hash", report["source_response_sha256_unattested"])
          PY
      - name: Preserve exact-head local-clock research observation (NOT externally timestamped)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: live-bundesliga-four-model-unverified-hold
          path: ${{ runner.temp }}/real-bundesliga-four-model-hold.json
          retention-days: 14
          if-no-files-found: error
