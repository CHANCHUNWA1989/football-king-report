name: Paired challenger comparison and walk-forward research tests

on:
  pull_request:
    paths:
      - "ops/paired_challenger_comparison.py"
      - "ops/expanding_walkforward_audit.py"
      - "ops/sealed_evidence_integrity_audit.py"
      - "ops/tests/test_paired_challenger_comparison.py"
      - "ops/tests/test_expanding_walkforward_audit.py"
      - "ops/tests/test_sealed_evidence_integrity_audit.py"
      - ".github/workflows/paired-challenger-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate paired model comparison
        run: python -m unittest discover -s ops/tests -p test_paired_challenger_comparison.py -v
      - name: Validate walk-forward settlement chronology
        run: python -m unittest discover -s ops/tests -p test_expanding_walkforward_audit.py -v
      - name: Validate sealed evidence integrity
        run: python -m unittest discover -s ops/tests -p test_sealed_evidence_integrity_audit.py -v
      - name: Audit real sealed research evidence
        run: python -m ops.sealed_evidence_integrity_audit --input evidence/settled.json
