name: Paired challenger comparison research tests

on:
  pull_request:
    paths:
      - "ops/paired_challenger_comparison.py"
      - "ops/tests/test_paired_challenger_comparison.py"
      - ".github/workflows/paired-challenger-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline synthetic validation
        run: python -m unittest discover -s ops/tests -p test_paired_challenger_comparison.py -v
