name: Asian EV quote provenance tests
on:
  push:
    paths:
      - 'ops/asian_ev_quote_provenance.py'
      - 'tests/test_asian_ev_quote_provenance.py'
      - '.github/workflows/asian-ev-quote-provenance-tests.yml'
  pull_request:
    paths:
      - 'ops/asian_ev_quote_provenance.py'
      - 'tests/test_asian_ev_quote_provenance.py'
      - '.github/workflows/asian-ev-quote-provenance-tests.yml'
jobs:
  quote-provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_asian_ev_quote_provenance.py' -v
