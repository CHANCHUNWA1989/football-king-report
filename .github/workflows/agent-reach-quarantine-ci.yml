name: Agent Reach Quarantine Contract (offline)

on:
  pull_request:
    paths:
      - 'ops/agent_reach_quarantine.py'
      - 'ops/tests/test_agent_reach_quarantine.py'
      - 'docs/AGENT_REACH_BRIDGE_V1.md'
      - '.github/workflows/agent-reach-quarantine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed research code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile offline bridge
        run: python -m compileall -q ops/agent_reach_quarantine.py
      - name: Run no-network synthetic contract tests
        run: python -m unittest discover -s ops/tests -p 'test_agent_reach_quarantine.py' -v
