name: Football King P0 first 19 FT candidate linkage (no settlement)

on:
  push:
    branches:
      - fix/model-role-history-guard-20261108
    paths:
      - .github/workflows/football-king-forward19-ft-candidate-link.yml
  pull_request:
    paths:
      - ops/identity_ab_ft_candidate_link.py
      - ops/tests/test_identity_ab_ft_candidate_link.py
      - evidence/identity_ab_forward/v1/42444100017-1/**
      - .github/workflows/football-king-forward19-ft-candidate-link.yml
  workflow_dispatch:
  # GitHub cron runs only from the default branch after this PR is merged.
  # Once daily, single free public-source GET, no archives or wagers written.
  schedule:
    - cron: '15 06 * * *'

permissions:
  contents: read

concurrency:
  group: football-king-forward19-candidate-link-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-matching-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only research evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed FT candidate and archive validation
        run: |
          python -m compileall -q ops
          python -m unittest \
            ops.tests.test_identity_ab_ft_candidate_link \
            ops.tests.test_identity_ab_sealed_archive_audit -v

  single-source-live-review:
    # Repo draft PR checks never fetch results; an explicit branch push
    # triggers one bounded observation of the *current* provider state.
    if: github.event_name != 'pull_request'
    needs: strict-matching-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout fixed unmodified historical forecasts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Single provider current-score candidates, never certified scoring
        run: |
          python -m ops.identity_ab_ft_candidate_link \
            --directory evidence/identity_ab_forward/v1/42444100017-1
          echo "UNVERIFIED_SOURCE_ONLY; 19_FORECAST_DENOMINATOR; NO_BRIER_OR_LOGLOSS; BETTING_DISABLED"
