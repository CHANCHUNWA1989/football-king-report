name: P0 BSD archive read-only canary (no provider API)

on:
  pull_request:
    paths:
      - '.github/workflows/bsd-archive-readonly-canary.yml'
      - '.github/workflows/football-king-bsd-free.yml'
      - '.github/workflows/football-king-iphone.yml'
      - 'ops/bsd_archive_reader.py'
      - 'ops/bsd_overlay.py'
      - 'ops/bsd_archive_receipt.py'
      - 'ops/bsd_guard.py'
      - 'ops/bsd_free.py'
      - 'ops/market_pair.py'
      - 'ops/team_identity.py'
      - 'ops/tests/test_bsd_archive_cutover.py'
      - 'ops/tests/test_bsd_archive_shell_execution.py'
      - 'ops/tests/test_bsd_archive_json_ambiguity.py'
      - 'ops/tests/test_bsd_archive_target_policy.py'
      - 'ops/tests/test_bsd_free.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsd_readonly_canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR code only (no credentials retained)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run local BSD archive cutover safety tests
        run: python -m unittest ops.tests.test_bsd_archive_cutover -v
      - name: Execute actual BSD archiver shell against offline deny-by-default GitHub API mock
        run: python -m unittest ops.tests.test_bsd_archive_shell_execution -v
      - name: Checkout actual mutable BSD archive branch (DATA ONLY)
        id: data_checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: archive/bsd-free-research-v1
          path: bsd-research-archive
          sparse-checkout: |
            sources/bsd_status_latest.json
            sources/bsd_market_latest.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Refuse implicit main fallback on missing BSD archive
        if: ${{ steps.data_checkout.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- bsd-research-archive
          echo 'BSD_READONLY_CANARY_ARCHIVE_UNAVAILABLE_HOLD'
      - name: Validate real BSD branch data paths and report only redacted metadata
        if: ${{ steps.data_checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python ops/bsd_archive_reader.py --root bsd-research-archive
          echo "BSD_ARCHIVE_HEAD_SHA=$(git -C bsd-research-archive rev-parse HEAD)"
          python ops/bsd_archive_receipt.py --root bsd-research-archive
      - name: Simulate optional BSD overlay from actual branch without publishing site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bsd-shadow-site"
          printf '{"status":"SHADOW_ONLY","predictions":[],"production_recommendations":"DISABLED"}\n' > "$RUNNER_TEMP/bsd-shadow-site/shadow.json"
          PYTHONPATH=ops python ops/bsd_overlay.py \
            --site "$RUNNER_TEMP/bsd-shadow-site" \
            --input bsd-research-archive/sources/bsd_market_latest.json \
            --status bsd-research-archive/sources/bsd_status_latest.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          status=json.loads((Path(os.environ["RUNNER_TEMP"])/"bsd-shadow-site"/"bsd_backup.json").read_text(encoding="utf-8"))
          assert status["status"]=="HOLD"
          assert status["time_valid_shadow_pairs"]==0
          assert status["production_recommendations"]=="DISABLED"
          assert status["market_is_executable"] is False
          assert status["automatic_replacement_of_main_market"] is False
          print("BSD_READONLY_CANARY_HOLD_NO_PRODUCTION_RELEASE")
          PY
