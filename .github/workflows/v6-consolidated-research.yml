name: V8 integrated research acceptance
on:
  pull_request:
    paths:
      - 'ops/v5_*.py'
      - 'ops/v6_forward_bundle.py'
      - 'ops/v6_calibration_challenger.py'
      - 'ops/v6_league_calibration.py'
      - 'ops/v6_forward_comparison.py'
      - 'ops/v6_forward_archive_audit.py'
      - 'ops/v6_accuracy_target.py'
      - 'ops/v8_*.py'
      - 'ops/v9_*.py'
      - 'ops/v10_*.py'
      - 'ops/tests/test_v10_*.py'
      - 'ops/tests/test_v9_*.py'
      - 'ops/tests/test_v8_*.py'
      - 'research/v8_history_manifest.json'
      - 'research/v9_history_expansion_manifest.json'
      - 'research/v8_ucl_manifest.json'
      - 'research/v8_ucl_gap_manifest.json'
      - 'research/v8_ucl_aliases.json'
      - 'ops/v6_recent_strength.py'
      - 'ops/tests/test_v6_recent_strength.py'
      - 'ops/tests/test_v6_accuracy_target.py'
      - 'ops/tests/test_v6_forward_archive_audit.py'
      - 'ops/tests/test_v6_forward_comparison.py'
      - 'ops/tests/test_v6_league_calibration.py'
      - 'ops/tests/test_v6_calibration_challenger.py'
      - 'ops/tests/test_v6_forward_bundle.py'
      - 'ops/tests/test_v5_*.py'
      - 'ops/red_card_forward_evidence.py'
      - 'ops/tests/test_red_card_forward_evidence.py'
      - 'research/v6_release_manifest.json'
      - '.github/workflows/v6-consolidated-research.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact component blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('research/v6_release_manifest.json').read_text())
          assert m['production_recommendations']=='DISABLED'
          for item in m['components']:
              assert subprocess.check_output(['git','hash-object',item['path']],text=True).strip()==item['git_blob_sha'],item['path']
          print('Exact research blobs verified:',len(m['components']))
          PY
      - run: python -m pip install -r research/requirements-v5-ml.txt
      - name: Compile and test
        run: |
          python -m compileall -q ops
          python -m unittest discover -s ops/tests -p 'test_v5_*.py' -v
          python -m unittest discover -s ops/tests -p 'test_red_card_forward_evidence.py' -v
          python -m unittest discover -s ops/tests -p 'test_v6_*.py' -v
          python -m unittest discover -s ops/tests -p 'test_v8_*.py' -v
          python -m unittest discover -s ops/tests -p 'test_v9_*.py' -v
          python -m unittest discover -s ops/tests -p 'test_v10_*.py' -v
      - name: Historical seven-model and market-grade replay
        run: |
          mkdir -p /tmp/v6-input /tmp/v6-results
          for league in en.1 de.1 fr.1; do
            for season in 2024-25 2025-26; do
              curl --fail --silent --show-error --max-time 30 --proto '=https' "https://raw.githubusercontent.com/openfootball/football.json/e6744429ee395bc86f247348c6184bb08d4eb361/${season}/${league}.json" -o "/tmp/v6-input/${season}-${league}.json"
            done
            python -m ops.v5_integration_acceptance --train "/tmp/v6-input/2024-25-${league}.json" --assessment "/tmp/v6-input/2025-26-${league}.json" --joint ops/v5_joint_poisson.py --output "/tmp/v6-results/settlement-${league}.json"
          done
          python -m ops.v5_ensemble_competition --input-dir /tmp/v6-input --joint ops/v5_joint_poisson.py --elo ops/v5_dynamic_elo.py --ml ops/v5_ml_benchmark.py --output /tmp/v6-results/ensemble.json
      - name: Fixed chronological probability calibration challenger
        run: python -m ops.v6_calibration_challenger --input-dir /tmp/v6-input --output /tmp/v6-results/calibration.json
      - name: V6.1 conservative league calibration research
        run: python -m ops.v6_league_calibration --input-dir /tmp/v6-input --output /tmp/v6-results/league-calibration.json
      - name: V6.3 historical 70 percent accuracy target audit
        run: python -m ops.v6_accuracy_target --input-dir /tmp/v6-input --output /tmp/v6-results/accuracy-target.json
      - name: V6.4 recent-strength new-season retrospective comparison
        run: python -m ops.v6_recent_strength --output /tmp/v6-results/recent-strength.json
      - name: V8 pinned five-season seven-league archive and walk-forward replay
        run: |
          mkdir -p /tmp/v8-history
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('research/v8_history_manifest.json').read_text())
          for item in m['files']:
              p=Path('/tmp/v8-history')/item['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20','--max-filesize','500000','--proto','=https','https://raw.githubusercontent.com/openfootball/football.json/'+m['commit']+'/'+item['path'],'-o',str(p)],check=True)
          PY
          python -m ops.v8_multiseason --input-dir /tmp/v8-history --manifest research/v8_history_manifest.json --output /tmp/v6-results/v8-history.json
      - name: V8.1 same-fixture full ensemble competition
        run: python -m ops.v8_same_fixture --input-dir /tmp/v8-history --manifest research/v8_history_manifest.json --output /tmp/v6-results/v8-same-fixture.json
      - name: V8.2 UCL group and league phase strength replay
        run: |
          mkdir -p /tmp/v8-ucl
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('research/v8_ucl_manifest.json').read_text())
          for x in m['files']:
              p=Path('/tmp/v8-ucl')/x['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20','--max-filesize','500000','--proto','=https','https://raw.githubusercontent.com/openfootball/football.json/'+m['commit']+'/'+x['path'],'-o',str(p)],check=True)
          PY
          python -m ops.v8_ucl_strength --input-dir /tmp/v8-ucl --manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v8-ucl.json
      - name: V8.3 UCL opponent-adjusted strength comparison
        run: python -m ops.v8_ucl_opponent --input-dir /tmp/v8-ucl --manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v8-ucl-opponent.json
      - name: V8.4 UCL archive gap fill and latest-season comparison
        run: |
          mkdir -p /tmp/v8-ucl-text
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('research/v8_ucl_gap_manifest.json').read_text())
          for x in m['files']:
              p=Path('/tmp/v8-ucl-text')/x['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20','--max-filesize','100000','--proto','=https','https://raw.githubusercontent.com/openfootball/champions-league/'+m['commit']+'/'+x['path'],'-o',str(p)],check=True)
          PY
          python -m ops.v8_ucl_gap_fill --input-dir /tmp/v8-ucl-text --manifest research/v8_ucl_gap_manifest.json --old-dir /tmp/v8-ucl --old-manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v8-ucl-gap-fill.json
      - name: V8.5 current UCL season bounded source intake
        run: python -m ops.v8_ucl_current_intake --probe-sportsdb --ledger "$RUNNER_TEMP/sportsdb-budget.json" --output /tmp/v6-results/v8-ucl-current-intake.json
      - name: V8.7 UCL explicit historical club label continuity
        run: python -m ops.v8_ucl_alias --input-dir /tmp/v8-ucl-text --manifest research/v8_ucl_gap_manifest.json --old-dir /tmp/v8-ucl --old-manifest research/v8_ucl_manifest.json --aliases research/v8_ucl_aliases.json --output /tmp/v6-results/v8-ucl-alias.json
      - name: V8.8 UCL chronological probability calibration
        run: python -m ops.v8_ucl_calibration --input-dir /tmp/v8-ucl-text --manifest research/v8_ucl_gap_manifest.json --old-dir /tmp/v8-ucl --old-manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v8-ucl-calibration.json
      - name: V8.9 UCL selective confidence and disagreement research
        run: python -m ops.v8_ucl_confidence --input-dir /tmp/v8-ucl-text --manifest research/v8_ucl_gap_manifest.json --old-dir /tmp/v8-ucl --old-manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v8-ucl-confidence.json
      - name: V9 UCL causal adaptive weighting
        run: python -m ops.v9_ucl_adaptive --input-dir /tmp/v8-ucl-text --manifest research/v8_ucl_gap_manifest.json --old-dir /tmp/v8-ucl --old-manifest research/v8_ucl_manifest.json --output /tmp/v6-results/v9-ucl-adaptive.json
      - name: Actual-clock native three-league inference
        run: |
          for league in bl1 bl2 bl3; do
            python -m ops.v5_native_bundesliga_forward --league "$league" --joint ops/v5_joint_poisson.py --elo ops/v5_dynamic_elo.py --ml ops/v5_ml_benchmark.py --ensemble ops/v5_ensemble_competition.py --output "/tmp/v6-results/native-${league}.json"
          done
      - name: Unified actual-time forward research bundle
        run: python -m ops.v6_forward_bundle --input-dir /tmp/v6-results --output /tmp/v6-results/forward-bundle.json
      - name: V6.2 freeze same-fixture forward comparison
        run: python -m ops.v6_forward_comparison seal --input /tmp/v6-results/forward-bundle.json --other /tmp/v6-results/league-calibration.json --output /tmp/v6-results/forward-comparison.json
      - name: Local archive integrity round-trip
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from datetime import datetime,timezone
          from ops.v6_forward_archive_audit import audit,FILES
          from ops.v6_forward_comparison import sha
          import json
          p=Path('/tmp/v6-results')
          f=Path('/tmp/v6-local-audit.zip')
          with ZipFile(f,'w') as z:
              for name in FILES:z.write(p/name,name)
          raw=f.read_bytes()
          _,out=audit(raw,sha(raw),datetime.now(timezone.utc))
          out['local_roundtrip_only']=True
          (p/'local-archive-audit.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY
      - name: Release safety and coverage summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v6-results')
          rows=[]
          for f in sorted(p.glob('native-*.json')):
              r=json.loads(f.read_text())
              assert r['production_recommendations']=='DISABLED'
              assert r['verified_forward_sample_credit']==0
              rows.append({k:r.get(k) for k in ('league','status','predictions_count','scheduled_in_window','previous_finished','current_finished','reason')})
          result={'status':'HOLD','production_recommendations':'DISABLED','native_leagues':rows,'verified_forward_sample_credit':0}
          (p/'release.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: V8 integrated release research report
        run: python -m ops.v8_integrated_report --input-dir /tmp/v6-results --output /tmp/v6-results/v8-release.json
      - name: V9.2 pinned market probability research
        run: python -m ops.v9_market_research --input evidence/settled.json --output /tmp/v6-results/v9-market-research.json
      - name: V9.4 domestic schedule and venue proxy research
        run: python -m ops.v9_schedule_venue --input-dir /tmp/v8-history --manifest research/v8_history_manifest.json --output /tmp/v6-results/v9-schedule-venue.json
      - name: V9.5 league-specific ensemble weight research
        run: python -m ops.v9_league_weights --input-dir /tmp/v8-history --manifest research/v8_history_manifest.json --output /tmp/v6-results/v9-league-weights.json
      - name: V9.6 expanded seven-league historical archive and replay
        run: |
          mkdir -p /tmp/v9-history
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('research/v9_history_expansion_manifest.json').read_text())
          for x in m['files']:
              p=Path('/tmp/v9-history')/x['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20','--max-filesize','500000','--proto','=https','https://raw.githubusercontent.com/openfootball/football.json/'+m['commit']+'/'+x['path'],'-o',str(p)],check=True)
          PY
          python -m ops.v9_history_expansion --input-dir /tmp/v9-history --manifest research/v9_history_expansion_manifest.json --base-dir /tmp/v8-history --base-manifest research/v8_history_manifest.json --ucl-report /tmp/v6-results/v8-ucl-gap-fill.json --output /tmp/v6-results/v9-history-expansion.json
      - name: V9.7 expanding multi-season ML same-fixture research
        run: python -m ops.v9_expanded_ml --input-dir /tmp/v9-history --manifest research/v9_history_expansion_manifest.json --base-dir /tmp/v8-history --base-manifest research/v8_history_manifest.json --output /tmp/v6-results/v9-expanded-ml.json
      - name: V9 unified evidence and release gate
        run: python -m ops.v9_integrated_report --input-dir /tmp/v6-results --output /tmp/v6-results/v9-release.json
      - name: V10 domestic chronological cross-fitted fusion
        run: python -m ops.v10_fusion --input-dir /tmp/v9-history --manifest research/v9_history_expansion_manifest.json --base-dir /tmp/v8-history --base-manifest research/v8_history_manifest.json --output /tmp/v6-results/v10-fusion.json
      - name: V10 consolidated research evidence
        run: python -m ops.v10_release --input-dir /tmp/v6-results --output /tmp/v6-results/v10-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: v8-integrated-research-evidence
          path: /tmp/v6-results/
          retention-days: 14
