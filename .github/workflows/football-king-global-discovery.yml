name: 足球王者｜全球賽程探索（研究限定）

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: football-king-global-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated global provider contract tests
        run: |
          python -m unittest discover -s ops/tests -p 'test_global_fixture_discovery.py' -v
          python -m unittest discover -s ops/tests -p 'test_global_readiness.py' -v
      - name: Discover actual global fixtures (no key, no bookmaker odds)
        run: python ops/global_fixture_discovery.py --output global-fixtures.json
      - name: Summarize actual worldwide readiness and blocked EV
        if: always()
        run: python ops/global_readiness.py --global global-fixtures.json --wide sources/wide_latest.json --output global-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-global-fixtures-research
          path: |
            global-fixtures.json
            global-readiness.json
          retention-days: 7
          if-no-files-found: warn
      - name: Report worldwide source status without suppressing existing wide coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("global-fixtures.json").read_text(encoding="utf-8"))
          if doc["status"]!="RESEARCH_ONLY" or doc["fixture_count"]==0:
              print("GLOBAL_SOURCE_UNAVAILABLE_OR_EMPTY: wide coverage audited separately; research artifact retained")
          print("OBSERVED_GLOBAL_COVERAGE",doc["observed_competition_count"],doc["fixture_count"])
          PY
