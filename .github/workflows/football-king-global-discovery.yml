name: 足球王者｜全球賽程探索（研究限定）

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: football-king-global-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated global provider contract tests
        run: python -m unittest discover -s ops/tests -p 'test_global_fixture_discovery.py' -v
      - name: Discover actual global fixtures (no key, no bookmaker odds)
        run: python ops/global_fixture_discovery.py --output global-fixtures.json
      - uses: actions/upload-artifact@v4
        with:
          name: football-king-global-fixtures-research
          path: global-fixtures.json
          retention-days: 7
          if-no-files-found: error
      - name: Fail visibly if worldwide source has no verified returned fixtures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("global-fixtures.json").read_text(encoding="utf-8"))
          if doc["status"]!="RESEARCH_ONLY" or doc["fixture_count"]==0:
              raise SystemExit("GLOBAL_SOURCE_UNAVAILABLE_OR_EMPTY: research artifact retained; coverage not verified")
          print("OBSERVED_GLOBAL_COVERAGE",doc["observed_competition_count"],doc["fixture_count"])
          PY
