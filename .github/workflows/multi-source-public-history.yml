name: Multi-source public historical research
on:
  pull_request:
    paths:
      - 'ops/live_core_multi_source.py'
      - 'ops/tests/test_live_core_multi_source.py'
      - '.github/workflows/multi-source-public-history.yml'
permissions:
  contents: read
jobs:
  public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline route contracts
        run: python -m unittest discover -s ops/tests -p test_live_core_multi_source.py -v
      - name: One public-domain pinned data read and chronological baseline
        run: python ops/live_core_multi_source.py --open-public
