name: Weekly isolated archive GITHUB_TOKEN write canary (synthetic HOLD)

on:
  push:
    branches:
      - research/weekly-actions-write-canary-20261123
    paths:
      - '.github/workflows/weekly-actions-isolated-write-canary.yml'

permissions:
  contents: read

concurrency:
  group: weekly-synthetic-actions-write-canary
  cancel-in-progress: false

jobs:
  fixed-synthetic-archive-canary:
    if: github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/research/weekly-actions-write-canary-20261123' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write and verify ONE synthetic file ONLY on isolated archive branch
        shell: bash
        run: |
          set -euo pipefail
          # No checkout, provider key, package install, Issue request or execution
          # of repository-supplied scripts. GITHUB_TOKEN is repository-scoped:
          # this closed test constrains its own only PUT to the archive branch.
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          REPO = "CHANCHUNWA1989/football-king-report"
          SOURCE = "research/weekly-actions-write-canary-20261123"
          ARCHIVE = "research/weekly-report-archive"
          ROOT = "https://api.github.com/repos/" + REPO + "/"
          HEX40 = re.compile(r"[a-f0-9]{40}\Z")
          DIGITS = re.compile(r"[1-9][0-9]{0,15}\Z")
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, *args, **kwargs):
                  return None
          opener = build_opener(NoRedirect())

          def hold(reason):
              raise RuntimeError("CANARY_HOLD_" + reason)

          if (os.getenv("GITHUB_REPOSITORY") != REPO or
                  os.getenv("GITHUB_REF") != "refs/heads/" + SOURCE or
                  os.getenv("GITHUB_EVENT_NAME") != "push"):
              hold("WRONG_EVENT_OR_BRANCH")
          token = os.getenv("GH_TOKEN", "")
          run_id = os.getenv("GITHUB_RUN_ID", "")
          attempt = os.getenv("GITHUB_RUN_ATTEMPT", "")
          source_head = os.getenv("GITHUB_SHA", "")
          if (not token or DIGITS.fullmatch(run_id) is None or
                  re.fullmatch(r"[1-9][0-9]{0,2}", attempt) is None or
                  HEX40.fullmatch(source_head) is None):
              hold("INVALID_RUN_IDENTITY")
          path = "canary/actions-write/" + run_id + "-" + attempt + ".json"
          file_api = ROOT + "contents/" + path
          archive_url = file_api + "?ref=" + quote(ARCHIVE, safe="")
          main_url = file_api + "?ref=main"
          main_ref_url = ROOT + "git/ref/heads/main"
          archive_ref_url = ROOT + "git/ref/heads/" + ARCHIVE
          allowed = {archive_url, main_url, main_ref_url, archive_ref_url, file_api}

          def unique(pairs):
              obj = {}
              for k,v in pairs:
                  if k in obj:
                      hold("DUPLICATE_GITHUB_RESPONSE_KEY")
                  obj[k] = v
              return obj

          def api(method, url, payload=None, absent=False):
              if url not in allowed or method not in ("GET", "PUT"):
                  hold("UNAUTHORIZED_REQUEST")
              if method == "PUT" and (url != file_api or
                      not isinstance(payload, dict) or
                      payload.get("branch") != ARCHIVE or
                      "sha" in payload):
                  hold("UNAUTHORIZED_PUT_TARGET")
              if method == "GET" and payload is not None:
                  hold("GET_WITH_PAYLOAD")
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = Request(url, data=data, method=method, headers={
                  "Authorization":"Bearer " + token,
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"football-king-synthetic-actions-write-canary"
              })
              try:
                  with opener.open(req, timeout=12) as resp:
                      raw = resp.read(16_385)
              except HTTPError as e:
                  if absent and method == "GET" and e.code == 404:
                      return None
                  hold("API_" + str(e.code))
              except (URLError, OSError, TimeoutError):
                  hold("API_UNAVAILABLE")
              if not 0 < len(raw) <= 16_384:
                  hold("BAD_RESPONSE_SIZE")
              try:
                  obj = json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
              except (UnicodeError, ValueError):
                  hold("BAD_RESPONSE_JSON")
              if not isinstance(obj,dict):
                  hold("BAD_RESPONSE_TYPE")
              return obj

          def ref_sha(branch,url):
              response = api("GET",url)
              target = response.get("object")
              if (response.get("ref") != "refs/heads/" + branch or
                      not isinstance(target,dict) or
                      target.get("type") != "commit" or
                      not isinstance(target.get("sha"),str) or
                      HEX40.fullmatch(target["sha"]) is None):
                  hold("BAD_BRANCH_REF")
              return target["sha"]

          main_before = ref_sha("main",main_ref_url)
          archive_before = ref_sha(ARCHIVE,archive_ref_url)
          if api("GET",archive_url,absent=True) is not None:
              hold("ARCHIVE_TEST_FILE_ALREADY_EXISTS")
          if api("GET",main_url,absent=True) is not None:
              hold("TEST_FILE_ALREADY_ON_MAIN")

          doc = {
              "schema":"football-king.actions-write-synthetic-canary.v1",
              "mode":"SYNTHETIC_TEST_ONLY",
              "report":False,
              "football_data":False,
              "not_for_prediction":True,
              "not_for_betting":True,
              "archive_ref":ARCHIVE,
              "path":path,
              "source_branch":SOURCE,
              "source_commit":source_head,
              "run_id":run_id,
              "run_attempt":attempt,
              "production_recommendations":"DISABLED",
              "status":"HOLD",
          }
          raw = (json.dumps(doc,sort_keys=True,indent=2) + "\n").encode("utf-8")
          blob_sha = hashlib.sha1(
              b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw
          ).hexdigest()
          digest = hashlib.sha256(raw).hexdigest()
          result = api("PUT",file_api,{
              "branch":ARCHIVE,
              "message":"test: synthetic-only Actions GITHUB_TOKEN isolated branch write/readback",
              "content":base64.b64encode(raw).decode("ascii")
          })
          commit = result.get("commit")
          content_obj = result.get("content")
          if (not isinstance(commit,dict) or
                  not isinstance(commit.get("sha"),str) or
                  HEX40.fullmatch(commit["sha"]) is None or
                  not isinstance(content_obj,dict) or
                  content_obj.get("sha") != blob_sha):
              hold("PUT_RECEIPT_UNVERIFIED")
          restored = api("GET",archive_url)
          if (restored.get("type") != "file" or
                  restored.get("path") != path or
                  restored.get("name") != path.rsplit("/",1)[-1] or
                  restored.get("encoding") != "base64" or
                  restored.get("sha") != blob_sha or
                  type(restored.get("size")) is not int or
                  restored["size"] != len(raw) or
                  not isinstance(restored.get("content"),str)):
              hold("REMOTE_FILE_METADATA_MISMATCH")
          try:
              recovered = base64.b64decode(
                  "".join(restored["content"].split()), validate=True
              )
          except (ValueError,TypeError):
              hold("INVALID_READBACK_BASE64")
          if (recovered != raw or
                  hashlib.sha256(recovered).hexdigest() != digest):
              hold("REMOTE_BYTES_OR_SHA256_MISMATCH")
          if api("GET",main_url,absent=True) is not None:
              hold("MAIN_TEST_PATH_POLLUTED")
          if ref_sha("main",main_ref_url) != main_before:
              hold("MAIN_HEAD_CHANGED_DURING_CANARY")
          archive_after = ref_sha(ARCHIVE,archive_ref_url)
          if archive_after != commit["sha"] or archive_after == archive_before:
              hold("ARCHIVE_HEAD_UNEXPECTED")
          print(json.dumps({
              "status":"SYNTHETIC_ARCHIVE_WRITE_READBACK_VERIFIED",
              "branch":ARCHIVE,
              "path":path,
              "archive_head":archive_after,
              "git_blob_sha":blob_sha,
              "sha256":digest,
              "main_unchanged":True,
              "actions_token_write_tested":True,
              "branch_protection_verified":False,
              "issue_notification_verified":False,
              "production_recommendations":"DISABLED",
          },sort_keys=True))
          PY
