name: VNext Live Auto source metadata monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  pull_request:
    paths:
      - 'ops/vnext_live_auto_monitor.py'
      - 'ops/tests/test_vnext_live_auto_monitor.py'
      - '.github/workflows/vnext-live-auto-monitor.yml'
permissions:
  contents: read
concurrency:
  group: vnext-live-auto-metadata-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test metadata monitor
        run: python -m unittest discover -s ops/tests -p test_vnext_live_auto_monitor.py -v
      - name: Inspect existing source metadata without network provider calls
        run: |
          python ops/vnext_live_auto_monitor.py > live-auto-monitor.json
          cat live-auto-monitor.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vnext-live-auto-metadata-monitor
          path: live-auto-monitor.json
          retention-days: 7
