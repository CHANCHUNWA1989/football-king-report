name: Penaltyblog time-decay challenger research tests

on:
  pull_request:
    paths:
      - "ops/penaltyblog_time_decay_research.py"
      - "ops/tests/test_penaltyblog_time_decay_research.py"
      - "ops/tests/penaltyblog_time_decay_real_smoke.py"
      - ".github/workflows/penaltyblog-time-decay-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research code
        run: python -m py_compile ops/penaltyblog_time_decay_research.py ops/tests/test_penaltyblog_time_decay_research.py
      - name: Run synthetic time-decay tests
        run: python -m unittest ops.tests.test_penaltyblog_time_decay_research -v

  real-dependency-synthetic-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned real upstream math dependency
        run: python -m pip install penaltyblog==1.13.1
      - name: Validate real Poisson and Dixon-Coles weighted fitting on synthetic rows
        run: python -m ops.tests.penaltyblog_time_decay_real_smoke
      - name: Confirm this remains research only
        run: python -m unittest ops.tests.test_penaltyblog_time_decay_research -v
