name: Football research artifact job tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/research_artifact_job.py'
      - 'tests/test_research_artifact_job.py'
      - '.github/workflows/research-artifact-job-tests.yml'
  pull_request:
    paths:
      - 'ops/research_artifact_job.py'
      - 'tests/test_research_artifact_job.py'
      - '.github/workflows/research-artifact-job-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_research_artifact_job.py' -v
