name: Optional Kloppy real native event smoke (research only)

on:
  pull_request:
    paths:
      - '.github/workflows/optional-kloppy-native-offline-smoke.yml'
      - 'ops/optional_kloppy_event_research.py'
      - 'ops/tests/kloppy_native_real_smoke.py'
      - 'ops/tests/test_optional_kloppy_event_research.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kloppy-native-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      THE_ODDS_API_KEY: ''
      API_FOOTBALL_KEY: ''
      SPORTMONKS_API_TOKEN: ''
      FOOTBALL_DATA_ORG_TOKEN: ''
    steps:
      - name: Checkout without persisted git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned version of upstream Kloppy from binary wheels only
        run: python -m pip install --no-input --only-binary=:all: 'kloppy==3.19.1'
      - name: Test actual upstream native objects with synthetic history only
        run: python -m unittest ops.tests.kloppy_native_real_smoke -v
