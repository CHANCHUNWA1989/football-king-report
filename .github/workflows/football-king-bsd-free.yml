name: 足球王者｜BSD免費足球賠率與賽程後備

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-bsd-free.yml'
  schedule:
    # 香港時間每日07:09，獨立3個上限請求
    - cron: '9 23 * * *'

concurrency:
  group: football-king-bsd-free
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent tests before any API call
        run: python -m unittest discover -s ops/tests -q
      - name: Collect only official free BSD 1X2 consensus or NOT_CONFIGURED
        env:
          BSD_FREE_API_TOKEN: ${{ secrets.BSD_FREE_API_TOKEN }}
        run: |
          set -euo pipefail
          python ops/bsd_free.py --output bsd-result.json
          python ops/bsd_guard.py --input bsd-result.json
      - name: Upload sanitized research-only report
        uses: actions/upload-artifact@v4
        with:
          name: bsd-free-sanitized
          path: bsd-result.json
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    # Fixed data-only destination, separate from the source/publish main branch.
    env:
      BSD_ARCHIVE_REF: archive/bsd-free-research-v1
    steps:
      - name: Checkout safe archiver
        uses: actions/checkout@v4
      - name: Download free source audit
        uses: actions/download-artifact@v4
        with:
          name: bsd-free-sanitized
          path: bsd
      - name: Checkout pinned BSD data archive branch (write data only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: archive/bsd-free-research-v1
          path: bsd-write-archive
          sparse-checkout: |
            sources/bsd_history
            sources/bsd_status_latest.json
            sources/bsd_market_latest.json
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Atomically commit BSD research files to archive branch
        shell: bash
        run: |
          set -euo pipefail
          # Source code and validation come from main's trusted checkout.
          # Data from the mutable archive checkout is NEVER executed.
          test "$BSD_ARCHIVE_REF" = "archive/bsd-free-research-v1"
          python ops/bsd_guard.py --input bsd/bsd-result.json
          archive_dir="bsd-write-archive"
          if [ ! -d "$archive_dir/.git" ] && [ ! -f "$archive_dir/.git" ]; then
            echo "BSD_ARCHIVE_CHECKOUT_NOT_FOUND" >&2
            exit 1
          fi
          git -C "$archive_dir" config user.name "github-actions[bot]"
          git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A single fast-forward branch update atomically publishes all
          # data changes at ONE Git commit; a competing remote head rejects
          # the push. Never force-push or fall back to main.
          folder="$(date -u +%Y/%m/%d)"
          history="sources/bsd_history/$folder/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json.gz"
          gzip -n -c bsd/bsd-result.json > "$RUNNER_TEMP/bsd-history.json.gz"
          eligible="$(python -c 'import json; z=json.load(open("bsd/bsd-result.json")); print(z["status"]=="RESEARCH_ONLY" and z["market_count"]>0)')"
          saved=false
          for attempt in 1 2 3 4 5; do
            # Fail if the fixed archive ref is missing or inaccessible.
            git -C "$archive_dir" fetch --no-tags origin "refs/heads/$BSD_ARCHIVE_REF"
            base_sha="$(git -C "$archive_dir" rev-parse --verify FETCH_HEAD)"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "BSD_ARCHIVE_REF_UNAVAILABLE" >&2
              exit 1
            fi
            git -C "$archive_dir" checkout --detach "$base_sha"
            # Protect against a mutable branch introducing symlink files.
            python ops/bsd_archive_reader.py --root "$archive_dir"
            if [ -e "$archive_dir/$history" ]; then
              if ! cmp -s "$RUNNER_TEMP/bsd-history.json.gz" "$archive_dir/$history"; then
                echo "BSD_HISTORY_RUN_ID_COLLISION" >&2
                exit 1
              fi
            else
              mkdir -p "$archive_dir/$(dirname "$history")"
              cp "$RUNNER_TEMP/bsd-history.json.gz" "$archive_dir/$history"
            fi
            git -C "$archive_dir" add -- "$history"
            status_path="$archive_dir/sources/bsd_status_latest.json"
            replace=True
            if [ -e "$status_path" ]; then
              python ops/bsd_guard.py --input bsd/bsd-result.json \
                --previous "$status_path" --decision "$RUNNER_TEMP/bsd-allow.json"
              replace="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["replace"])' "$RUNNER_TEMP/bsd-allow.json")"
            fi
            if [ "$replace" = True ]; then
              mkdir -p "$archive_dir/sources"
              cp bsd/bsd-result.json "$status_path"
              git -C "$archive_dir" add -- sources/bsd_status_latest.json
              if [ "$eligible" = True ]; then
                cp bsd/bsd-result.json "$archive_dir/sources/bsd_market_latest.json"
                git -C "$archive_dir" add -- sources/bsd_market_latest.json
              fi
            else
              echo "BSD_STALE_REPLAY_LATEST_UNCHANGED"
            fi
            if git -C "$archive_dir" diff --cached --quiet; then
              echo "BSD_ARCHIVE_IDEMPOTENT_NO_CHANGES"
              saved=true
              break
            fi
            git -C "$archive_dir" commit -m "Archive optional BSD consensus research (non-executable)" >/dev/null
            if git -C "$archive_dir" push origin "HEAD:refs/heads/$BSD_ARCHIVE_REF"; then
              echo "BSD_ARCHIVE_ATOMIC_COMMIT=$(git -C "$archive_dir" rev-parse HEAD)"
              saved=true
              break
            fi
            echo "BSD_ARCHIVE_CONCURRENT_UPDATE_RETRY=$attempt"
            sleep "$((attempt*2))"
          done
          if [ "$saved" != true ]; then
            echo "BSD_ARCHIVE_FF_PUSH_FAILED" >&2
            exit 1
          fi

  report_failure:
    needs: [collect, archive]
    if: ${{ always() && (needs.collect.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record optional backup outage only
        run: |
          title="足球王者：BSD免費後備來源同步異常"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：BSD免費後備來源同步異常") | .number' | head -n 1)"
          body="BSD免費後備來源故障，原有賠率及研究推薦維持不變：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  close_incident:
    needs: [collect, archive]
    if: ${{ needs.collect.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark optional backup healthy again
        run: |
          id="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：BSD免費後備來源同步異常") | .number' | head -n 1)"
          if [ -n "$id" ]; then
            gh issue close "$id" --repo "$GITHUB_REPOSITORY" --comment "BSD同步流程恢復；如未配置免費Token仍然顯示 NOT_CONFIGURED。"
          fi
