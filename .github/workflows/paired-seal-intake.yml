name: Paired forecast seal intake tests

on:
  pull_request:
    paths:
      - "ops/paired_seal_intake.py"
      - "ops/tests/test_paired_seal_intake.py"
      - ".github/workflows/paired-seal-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s ops/tests -p test_paired_seal_intake.py -v
