name: Agent Reach Runtime Wheel SHA256 Discovery (candidate only)

on:
  pull_request:
    paths:
      - 'docs/agent_reach_runtime_wheels.txt'
      - 'ops/agent_reach_wheelhouse_guard.py'
      - 'ops/tests/test_agent_reach_wheelhouse_guard.py'
      - '.github/workflows/agent-reach-wheel-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-wheel-hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout with no persistent GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic wheel security tests
        run: |
          python -m compileall -q ops/agent_reach_wheelhouse_guard.py
          python -m unittest discover -s ops/tests -p 'test_agent_reach_wheelhouse_guard.py' -v
      - name: Download thirteen pinned public runtime wheels as candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-reach-wheelhouse"
          python -m pip download --only-binary=:all: --no-deps --no-cache-dir \
            -r docs/agent_reach_runtime_wheels.txt \
            -d "$RUNNER_TEMP/agent-reach-wheelhouse"
      - name: Generate candidate SHA256 manifest (not a verified lock)
        shell: bash
        run: |
          set -euo pipefail
          python ops/agent_reach_wheelhouse_guard.py \
            --wheelhouse "$RUNNER_TEMP/agent-reach-wheelhouse" \
            --discover-output "$RUNNER_TEMP/agent-reach-wheel-candidate.json"
          echo 'WHEEL_HASH_CANDIDATE_BEGINS'
          cat "$RUNNER_TEMP/agent-reach-wheel-candidate.json"
          echo 'WHEEL_HASH_CANDIDATE_ENDS'
      - name: Archive candidate hash manifest only, never wheels or secrets
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-reach-wheel-candidate-sha256
          path: ${{ runner.temp }}/agent-reach-wheel-candidate.json
          retention-days: 7
