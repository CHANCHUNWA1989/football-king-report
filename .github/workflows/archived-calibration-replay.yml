name: Archived four-way calibration replay
on:
  pull_request:
    paths:
      - 'ops/fourway_calibration_diagnostic.py'
      - 'ops/settled_calibration_replay.py'
      - 'ops/archived_error_attribution.py'
      - 'ops/tests/test_archived_error_attribution.py'
      - 'ops/tests/test_settled_calibration_replay.py'
      - '.github/workflows/archived-calibration-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify archived ledger and replay
        run: |
          python -m unittest discover -s ops/tests -p 'test_settled_calibration_replay.py' -v
          python ops/settled_calibration_replay.py
      - name: Rehearse archived qualification and mobile reports offline
        run: python -m ops.qualification_rehearsal
      - name: Attribute archived model errors and inventory provenance gaps
        run: python -m ops.archived_error_attribution
