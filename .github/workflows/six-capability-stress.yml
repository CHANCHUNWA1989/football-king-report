name: Football King six-capability stress
on:
  push:
    branches: [main, 'test/**']
    paths:
      - 'ops/six_capability_research.py'
      - 'ops/tests/test_six_capabilities_stress.py'
      - '.github/workflows/six-capability-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ops/tests -p 'test_six_capabilities_stress.py' -v
