name: Football King private all-market research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-all-market-research.yml'
  schedule:
    - cron: '40 9 * * *'
concurrency:
  group: football-king-private-market-research
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      private_capture_manifest_sha256: ${{ steps.collect_private.outputs.private_capture_manifest_sha256 }}
      private_archive_blob_sha: ${{ steps.archive_private.outputs.private_archive_blob_sha }}
      private_archive_commit_sha: ${{ steps.archive_private.outputs.private_archive_commit_sha }}
      private_archive_sha256: ${{ steps.archive_private.outputs.private_archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p test_all_market_screen.py
          python -m unittest discover -s tests -p test_all_market_private_feed.py
          python -m unittest discover -s tests -p test_recommendation_readiness.py
          python -m unittest ops.tests.test_private_response_capture ops.tests.test_private_response_collection -q
          python -m unittest ops.tests.test_private_response_archive ops.tests.test_private_archive_workflow -q
      - name: Collect private market quotes
        id: collect_private
        env:
          PRIVATE_RESPONSE_CAPTURE_DIR: ${{ runner.temp }}/football-private-responses
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python -m ops.all_market_private_feed
      - name: Screen available quotes without inventing model probabilities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ops.all_market_screen import screen
          p=Path('output/private_all_market_quotes.json')
          data=json.loads(p.read_text()) if p.exists() else {'quotes':[]}
          report=screen(data)
          report['input_status']=data.get('collector_status','UNKNOWN')
          report['collector_reason']=data.get('collector_reason')
          report['quotes_collected']=len(data.get('quotes',[]))
          report['live_api_verified']=data.get('collector_status') == 'CONNECTED'
          report['coverage']=data.get('coverage',[])
          report['requested_markets']=data.get('requested_markets',[])
          report['other_markets_status']=data.get('other_markets_status','NOT_AVAILABLE')
          report['production_recommendations']='DISABLED'
          Path('output/private_all_market_screen.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('INPUT_STATUS:',report['input_status'],'QUOTES:',report['quotes_collected'],'COUNTS:',report['counts'])
          PY
      - name: Audit production recommendation readiness
        run: python -m ops.recommendation_readiness
      - name: Redact all raw prices and identities before public artifact upload
        run: python -m ops.private_artifact_guard
      - name: Upload sanitized research summary
        uses: actions/upload-artifact@v4
        with:
          name: all-market-redacted-research-summary
          path: |
            output/private_all_market_public_summary.json
            output/recommendation_readiness.json
          retention-days: 1
      - name: Replay original response bytes privately without another provider request
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        env:
          PRIVATE_RESPONSE_CAPTURE_DIR: ${{ runner.temp }}/football-private-responses
          PRIVATE_CAPTURE_MANIFEST_SHA: ${{ steps.collect_private.outputs.private_capture_manifest_sha256 }}
        run: |
          python -m ops.private_response_capture \
            --private-dir "$PRIVATE_RESPONSE_CAPTURE_DIR" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-manifest-sha256 "$PRIVATE_CAPTURE_MANIFEST_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ops.all_market_private_feed import replay_private_quotes
          feed = json.loads(Path('output/private_all_market_quotes.json').read_text())
          report = replay_private_quotes(Path(os.environ['PRIVATE_RESPONSE_CAPTURE_DIR']), feed,
              source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              expected_manifest_sha256=os.environ['PRIVATE_CAPTURE_MANIFEST_SHA'])
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Archive original bytes only to a pinned private repository
        id: archive_private
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        env:
          PRIVATE_ARCHIVE_REPOSITORY: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY }}
          PRIVATE_ARCHIVE_REPOSITORY_ID: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY_ID }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
          PRIVATE_CAPTURE_MANIFEST_SHA: ${{ steps.collect_private.outputs.private_capture_manifest_sha256 }}
        run: |
          python -m ops.private_response_archive upload \
            --private-dir "$RUNNER_TEMP/football-private-responses" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-manifest-sha256 "$PRIVATE_CAPTURE_MANIFEST_SHA"
      - name: Install the pinned public encryption tool
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        run: python -m ops.install_age --destination "$RUNNER_TEMP/football-age"
      - name: Encrypt the same original pack without another provider request
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        env:
          PRIVATE_CAPTURE_MANIFEST_SHA: ${{ steps.collect_private.outputs.private_capture_manifest_sha256 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/football-relay-ciphertext" "$RUNNER_TEMP/football-relay-receipt"
          python -m ops.private_response_relay encrypt \
            --age-binary "$RUNNER_TEMP/football-age/age" \
            --recipient-file sources/policies/private_original_recipient_v1.txt \
            --private-dir "$RUNNER_TEMP/football-private-responses" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-manifest-sha256 "$PRIVATE_CAPTURE_MANIFEST_SHA" \
            --ciphertext "$RUNNER_TEMP/football-relay-ciphertext/original-response-pack.zip.age" \
            --receipt-output "$RUNNER_TEMP/football-relay-receipt/producer-receipt.json"
      - name: Upload only encrypted original bytes
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-private-original-ciphertext-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/football-relay-ciphertext/original-response-pack.zip.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload only safe external producer pins
        if: steps.collect_private.outputs.private_capture_manifest_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-private-original-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/football-relay-receipt/producer-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail visibly on missing key or provider outage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/private_all_market_screen.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          status=report['input_status']
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### Football King private feed\\n')
              f.write('Collector: '+status+'\\n')
              f.write('Valid quotes: '+str(report.get('quotes_collected',0))+'\\n')
              f.write('Production recommendations: DISABLED until independent certification\\n')
          if status in ('MISSING_API_KEY','PROVIDER_ERROR','UNKNOWN'):
              raise SystemExit('COLLECTOR_NOT_OPERATIONAL:'+status)
          PY

  archive_redacted_coverage:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Checkout public code only (no API credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download safe aggregate only (never raw bookmaker odds)
        uses: actions/download-artifact@v4
        with:
          name: all-market-redacted-research-summary
          path: safe
      - name: Validate and archive latest de-identified coverage, preserving newer snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s safe/private_all_market_public_summary.json
          dest="market/private_summary_latest.json"
          for attempt in 1 2 3 4 5; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest" --jq '.sha' 2>/dev/null || true)"
            current="$RUNNER_TEMP/previous-private-summary.json"
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/$dest" --jq '.content' |
                base64 --decode > "$current"
            else
              sha=""
              rm -f "$current"
            fi
            python -m ops.private_summary_archive \
              --current "$current" \
              --incoming safe/private_all_market_public_summary.json \
              --output "$RUNNER_TEMP/merged-public-coverage.json"
            if [ -n "$sha" ] && cmp -s "$RUNNER_TEMP/merged-public-coverage.json" "$current"; then
              echo "Already archived newer or identical safe public metadata"
              exit 0
            fi
            body="$(base64 -w0 "$RUNNER_TEMP/merged-public-coverage.json")"
            if [ -n "$sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f sha="$sha" -f content="$body" \
                -f message="Archive safely redacted private market observation counts" >/dev/null; then
                exit 0
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f content="$body" \
                -f message="Initialize safely redacted private market observation counts" >/dev/null; then
                exit 0
              fi
            fi
            sleep "$attempt"
          done
          echo "SAFE_COVERAGE_ARCHIVE_CONCURRENT_UPDATE_FAILED" >&2
          exit 1

  verify_private_original_archive:
    needs: collect
    if: needs.collect.outputs.private_archive_blob_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout the same public program without provider credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore and replay the committed private original in a separate job
        env:
          PRIVATE_ARCHIVE_REPOSITORY: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY }}
          PRIVATE_ARCHIVE_REPOSITORY_ID: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY_ID }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
          PRIVATE_CAPTURE_MANIFEST_SHA: ${{ needs.collect.outputs.private_capture_manifest_sha256 }}
          PRIVATE_ARCHIVE_BLOB_SHA: ${{ needs.collect.outputs.private_archive_blob_sha }}
          PRIVATE_ARCHIVE_COMMIT_SHA: ${{ needs.collect.outputs.private_archive_commit_sha }}
          PRIVATE_ARCHIVE_SHA256: ${{ needs.collect.outputs.private_archive_sha256 }}
        run: |
          python -m ops.private_response_archive restore \
            --private-dir "$RUNNER_TEMP/football-private-restored-responses" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-manifest-sha256 "$PRIVATE_CAPTURE_MANIFEST_SHA" \
            --expected-blob-sha "$PRIVATE_ARCHIVE_BLOB_SHA" \
            --expected-commit-sha "$PRIVATE_ARCHIVE_COMMIT_SHA" \
            --expected-archive-sha256 "$PRIVATE_ARCHIVE_SHA256"
