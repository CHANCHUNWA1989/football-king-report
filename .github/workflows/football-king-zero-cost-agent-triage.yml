name: Football King Zero-Cost Agent Triage
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: read
concurrency:
  group: football-king-zero-cost-triage
  cancel-in-progress: true
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test fail-closed triage
        run: python -m unittest discover -s ops/tests -p test_agent_zero_cost_triage.py -v
      - name: Generate local shadow audit
        run: |
          rc=0
          python ops/agent_orchestrator.py --output agent-audit.json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s agent-audit.json
      - name: Generate sanitized issue queue
        run: |
          python ops/agent_zero_cost_triage.py --input agent-audit.json --output agent-triage.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path("agent-triage.json").read_text())
          lines = ["## Agent zero-cost triage", "", "- Status: HOLD", "- No Codex / LLM API calls", "- No automatic code edits", f"- Safe issue categories: {len(result['issues'])}", "", "Manual Codex authorization required before fixing."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Upload safe issue queue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-agent-triage
          path: agent-triage.json
          if-no-files-found: error
          retention-days: 7
