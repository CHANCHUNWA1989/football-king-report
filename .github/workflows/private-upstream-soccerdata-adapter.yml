name: Upstream soccerdata historical adapter
on:
  pull_request:
    paths:
      - 'ops/private_upstream_soccerdata_adapter.py'
      - 'ops/tests/test_private_upstream_soccerdata_adapter.py'
      - 'ops/private_soccerdata_model_bridge.py'
      - 'ops/tests/test_private_soccerdata_model_bridge.py'
      - 'ops/private_soccerdata_walk_forward.py'
      - 'ops/tests/test_private_soccerdata_walk_forward.py'
      - 'ops/private_soccerdata_refit_handoff.py'
      - 'ops/tests/test_private_soccerdata_refit_handoff.py'
      - 'ops/private_soccerdata_holdout_scoring.py'
      - 'ops/tests/test_private_soccerdata_holdout_scoring.py'
      - '.github/workflows/private-upstream-soccerdata-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-soccerdata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream soccerdata
        run: python -m pip install 'soccerdata>=1.8,<2' pandas
      - name: Validate upstream constructor and offline match adapter
        run: |
          python -m unittest discover -s ops/tests -p test_private_upstream_soccerdata_adapter.py -v
          python -m unittest discover -s ops/tests -p test_private_soccerdata_model_bridge.py -v
          python -m unittest discover -s ops/tests -p test_private_soccerdata_walk_forward.py -v
          python -m unittest discover -s ops/tests -p test_private_soccerdata_refit_handoff.py -v
          python -m unittest discover -s ops/tests -p test_private_soccerdata_holdout_scoring.py -v
