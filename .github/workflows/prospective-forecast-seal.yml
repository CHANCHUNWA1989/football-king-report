name: Prospective forecast seal synthetic tests

on:
  pull_request:
    paths:
      - "ops/prospective_forecast_seal.py"
      - "ops/tests/test_prospective_forecast_seal.py"
      - ".github/workflows/prospective-forecast-seal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s ops/tests -p test_prospective_forecast_seal.py -v
