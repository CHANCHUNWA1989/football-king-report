name: In-play total decay research audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/inplay_total_decay.py'
      - 'ops/tests/test_inplay_total_decay.py'
      - '.github/workflows/inplay-total-decay-tests.yml'
permissions:
  contents: read
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run deterministic tests
        run: |
          python -m compileall -q ops
          python -m unittest discover -s ops/tests -p 'test_inplay_total_decay.py' -v
