name: Agent Reach Pinned Public GitHub Smoke (research-only)

on:
  pull_request:
    paths:
      - 'ops/agent_reach_live_smoke.py'
      - 'ops/tests/test_agent_reach_live_smoke.py'
      - 'ops/agent_reach_dependency_guard.py'
      - 'ops/tests/test_agent_reach_dependency_guard.py'
      - 'ops/agent_reach_wheelhouse_guard.py'
      - 'ops/tests/test_agent_reach_wheelhouse_guard.py'
      - 'docs/AGENT_REACH_LIVE_SMOKE_V1.md'
      - 'docs/agent_reach_smoke_constraints.txt'
      - 'docs/AGENT_REACH_DEPENDENCY_AUDIT_V1.md'
      - 'docs/agent_reach_runtime_wheels.txt'
      - 'docs/agent_reach_wheelhash_lock.json'
      - 'docs/AGENT_REACH_WHEELHASH_AUDIT_V1.md'
      - '.github/workflows/agent-reach-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-network-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only checkout without persistent token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile offline research and security modules
        run: python -m compileall -q ops/agent_reach_live_smoke.py ops/agent_reach_native_github.py ops/agent_reach_quarantine.py ops/agent_reach_dependency_guard.py ops/agent_reach_wheelhouse_guard.py
      - name: Run synthetic positive and negative contract cases
        run: |
          python -m unittest discover -s ops/tests -p 'test_agent_reach_quarantine.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_native_github.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_live_smoke.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_dependency_guard.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_wheelhouse_guard.py' -v

  verified-runtime-install:
    needs: no-network-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository code only, no persistent git auth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact Agent Reach v1.6.1 release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Panniantong/Agent-Reach
          ref: 7a38047acf26a729cbb27851e3cb81639da86b29
          path: vendor/agent-reach
          persist-credentials: false
      - name: Verify upstream source commit identity
        run: |
          actual="$(git -C vendor/agent-reach rev-parse HEAD)"
          test "$actual" = "7a38047acf26a729cbb27851e3cb81639da86b29"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download exact external runtime wheels into isolated staging
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/reach-venv"
          mkdir -p "$RUNNER_TEMP/reach-wheelhouse"
          python -m pip download --only-binary=:all: --no-deps --no-cache-dir \
            -r docs/agent_reach_runtime_wheels.txt \
            -d "$RUNNER_TEMP/reach-wheelhouse"
      - name: Match wheel bytes against committed SHA256 and produce hashed install list
        shell: bash
        run: |
          set -euo pipefail
          python ops/agent_reach_wheelhouse_guard.py \
            --wheelhouse "$RUNNER_TEMP/reach-wheelhouse" \
            --manifest docs/agent_reach_wheelhash_lock.json \
            --requirements-output "$RUNNER_TEMP/agent-reach-runtime-hashes.txt"
      - name: Install only externally hash-verified runtime wheels (pip double-check)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/reach-venv/bin/python" -m pip install --no-index \
            --find-links="$RUNNER_TEMP/reach-wheelhouse" \
            --require-hashes --no-deps \
            -r "$RUNNER_TEMP/agent-reach-runtime-hashes.txt"
      - name: Install pinned Agent Reach source, no transitive package resolutions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/reach-venv/bin/python" -m pip install --no-cache-dir --no-deps ./vendor/agent-reach
          "$RUNNER_TEMP/reach-venv/bin/python" -m pip check
      - name: Verify all fourteen installed runtime versions still match the audit
        run: "$RUNNER_TEMP/reach-venv/bin/python ops/agent_reach_dependency_guard.py --constraints docs/agent_reach_smoke_constraints.txt"
      - name: Run one anonymous public GitHub read after successful hash check
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          umask 077
          PATH="$RUNNER_TEMP/reach-venv/bin:$PATH" "$RUNNER_TEMP/reach-venv/bin/python" ops/agent_reach_live_smoke.py \
            --repo Panniantong/Agent-Reach \
            --vendor-dir vendor/agent-reach \
            --output "$RUNNER_TEMP/agent-reach-public-smoke.json"
      - name: Note PR-only integrity verification and no API retries
        if: github.event_name == 'pull_request'
        run: echo '13 external runtime wheel hashes verified; Agent Reach public API NOT QUERIED on PR; formal_betting=DISABLED'
      - name: Archive sanitized metadata only (no native body)
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-reach-public-read-safe-receipt
          path: ${{ runner.temp }}/agent-reach-public-smoke.json
          retention-days: 7
          if-no-files-found: ignore
