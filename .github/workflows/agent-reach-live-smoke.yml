name: Agent Reach Pinned Public GitHub Smoke (research-only)

on:
  pull_request:
    paths:
      - 'ops/agent_reach_live_smoke.py'
      - 'ops/tests/test_agent_reach_live_smoke.py'
      - 'docs/AGENT_REACH_LIVE_SMOKE_V1.md'
      - '.github/workflows/agent-reach-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout without persistent token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile research-only adapters
        run: python -m compileall -q ops/agent_reach_live_smoke.py ops/agent_reach_native_github.py ops/agent_reach_quarantine.py
      - name: Synthetic positive and negative contract cases
        run: |
          python -m unittest discover -s ops/tests -p 'test_agent_reach_quarantine.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_native_github.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_live_smoke.py' -v

  actual-public-read:
    needs: no-network-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout repository code only, no persistent git auth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact Agent Reach v1.6.1 release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Panniantong/Agent-Reach
          ref: 7a38047acf26a729cbb27851e3cb81639da86b29
          path: vendor/agent-reach
          persist-credentials: false
      - name: Verify upstream source commit identity
        run: |
          actual="$(git -C vendor/agent-reach rev-parse HEAD)"
          test "$actual" = "7a38047acf26a729cbb27851e3cb81639da86b29"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Agent Reach source into ephemeral CI runner
        run: python -m pip install --no-cache-dir ./vendor/agent-reach
      - name: Run one anonymous public GitHub read (no credentials)
        id: read_public
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          umask 077
          python ops/agent_reach_live_smoke.py \
            --repo Panniantong/Agent-Reach \
            --vendor-dir vendor/agent-reach \
            --output "$RUNNER_TEMP/agent-reach-public-smoke.json"
      - name: Archive sanitized metadata only (no native body)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-reach-public-read-safe-receipt
          path: ${{ runner.temp }}/agent-reach-public-smoke.json
          retention-days: 7
          if-no-files-found: ignore
