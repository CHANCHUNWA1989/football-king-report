name: Agent Reach Build Wheel SHA256 Candidate Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-build-backend-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout research code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synthetic no-network hash-guard tests
        run: |
          python -m compileall -q ops/agent_reach_build_wheel_guard.py
          python -m unittest discover -s ops/tests -p 'test_agent_reach_build_wheel_guard.py' -v
      - name: Download one candidate hatchling release and all required dependencies as binary wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reach-build-wheelhouse"
          python -m pip download --only-binary=:all: --no-cache-dir \
            --dest "$RUNNER_TEMP/reach-build-wheelhouse" 'hatchling==1.27.0'
      - name: Show candidate hashes only (not source authenticity)
        shell: bash
        run: |
          set -euo pipefail
          python ops/agent_reach_build_wheel_guard.py \
            --wheelhouse "$RUNNER_TEMP/reach-build-wheelhouse" \
            --discover-output "$RUNNER_TEMP/reach-build-wheel-candidate.json"
          echo 'BEGIN_BUILD_WHEEL_CANDIDATE_JSON'
          cat "$RUNNER_TEMP/reach-build-wheel-candidate.json"
          echo 'END_BUILD_WHEEL_CANDIDATE_JSON'
      - name: Archive candidate hashes only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-reach-build-wheel-candidate
          path: ${{ runner.temp }}/reach-build-wheel-candidate.json
          retention-days: 7
