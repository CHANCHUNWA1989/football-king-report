name: Football daily research report tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/daily_research_report.py'
      - 'tests/test_daily_research_report.py'
      - 'ops/free_odds_intake.py'
      - '.github/workflows/daily-research-report-tests.yml'
  pull_request:
    paths:
      - 'ops/daily_research_report.py'
      - 'tests/test_daily_research_report.py'
      - 'ops/free_odds_intake.py'
      - '.github/workflows/daily-research-report-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run daily research report tests
        run: python -m unittest discover -s tests -p 'test_daily_research_report.py' -v
