name: Scrapling isolated research CI
on:
  pull_request:
    paths: ['research_scrapling/**', '.github/workflows/scrapling-research.yml']
  push:
    branches: ['research/scrapling-evidence-20261128']
    paths: ['research_scrapling/**', '.github/workflows/scrapling-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline source contract tests (no third-party dependency)
        run: |
          python research_scrapling/test_historical_probe.py
          python research_scrapling/test_evidence_intake.py
          python research_scrapling/test_source_health.py
      - name: Install isolated dependency
        run: python -m pip install 'scrapling[fetchers]==0.4.6'
      - name: Test parser and fail-closed gate
        run: |
          python research_scrapling/collector.py --self-test
          python research_scrapling/collector.py --config research_scrapling/disabled.json --output scrapling-status.json
          python -m pip freeze > scrapling-dependencies.txt
      - name: Qualify public historical sources (no live activation)
        run: python research_scrapling/historical_probe.py football scrapling-source-evidence.json
      - name: Expanded historical comparison
        run: python research_scrapling/football_batch.py scrapling-batch-evidence.json
      - name: Validate historical evidence intake (model disabled)
        run: python research_scrapling/evidence_intake.py football scrapling-batch-evidence.json scrapling-intake.json
      - name: Audit source health (historical metadata only)
        if: always() && !cancelled()
        run: python research_scrapling/source_health.py football scrapling-batch-evidence.json scrapling-health.json
      - name: Verify portable qualification runner offline
        run: python research_scrapling/run_qualification.py --offline-only --output qualification-offline
      - name: Build and run isolated Docker qualification (network disabled)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-evidence
          context=$(mktemp -d)
          cid=""
          trap 'if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi; rm -rf "$context"' EXIT
          cp -a research_scrapling "$context/"
          docker build --file "$context/research_scrapling/Dockerfile" --tag scrapling-research:ci "$context" 2>&1 | tee docker-evidence/build.log
          docker image inspect --format '{{.Id}} {{.Config.User}}' scrapling-research:ci > docker-evidence/image.txt
          test "$(docker image inspect --format '{{.Config.User}}' scrapling-research:ci)" = "10001"
          cid=$(docker create --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 scrapling-research:ci --offline-only --output /evidence)
          set +e
          docker start -a "$cid" > docker-evidence/runtime.log 2>&1
          rc=$?
          set -e
          docker cp "$cid:/evidence/." docker-evidence/
          test "$rc" -eq 0
          python -c 'import json; d=json.load(open("docker-evidence/qualification.json")); assert d["qualification"]=="OFFLINE_ONLY_PASS" and d["status"]=="HOLD" and d["model_input_allowed"] is False and d["live_trading"]=="DISABLED" and d["production_recommendations"]=="DISABLED"'
      - name: Existing risk regression
        if: always() && !cancelled()
        run: python -m unittest discover -s ops/tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrapling-research-evidence
          path: |
            scrapling-status.json
            scrapling-dependencies.txt
            scrapling-source-evidence.json
            scrapling-batch-evidence.json
            scrapling-intake.json
            scrapling-health.json
            qualification-offline/
            docker-evidence/
          retention-days: 7
