name: VNext API-Football offline scope hardening
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vnext-api-football-live-probe.yml'
      - 'ops/vnext_api_football_live_probe.py'
      - 'ops/tests/test_vnext_api_football_live_probe.py'
      - 'ops/secondary_sources.py'
permissions:
  contents: read
concurrency:
  group: vnext-api-football-single-call
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test provider contract without secrets or network
        run: python -m unittest discover -s ops/tests -p test_vnext_api_football_live_probe.py -v
