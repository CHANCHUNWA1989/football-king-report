name: Football offline 1X2 validation
on:
  push:
    branches: [main, feature/research-validation-20261016]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent offline 1X2 tests
        run: python -m unittest -v test_offline_1x2_validation
