name: Football research Markdown report tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/daily_research_markdown.py'
      - 'tests/test_daily_research_markdown.py'
      - '.github/workflows/daily-research-markdown-tests.yml'
  pull_request:
    paths:
      - 'ops/daily_research_markdown.py'
      - 'tests/test_daily_research_markdown.py'
      - '.github/workflows/daily-research-markdown-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_daily_research_markdown.py' -v
