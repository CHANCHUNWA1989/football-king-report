name: DHE full-season margin benchmark
on:
  pull_request:
    paths:
      - 'ops/deep_handicap_league_benchmark.py'
      - 'ops/deep_handicap_league_runner.py'
      - 'ops/tests/test_deep_handicap_league_benchmark.py'
      - 'ops/tests/test_deep_handicap_league_runner.py'
      - 'ops/live_core_multi_source.py'
      - 'ops/deep_handicap_joint_score.py'
      - 'ops/deep_handicap_historical_smoke.py'
      - '.github/workflows/deep-handicap-league-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_league_benchmark.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_league_runner.py' -v
      - run: python ops/deep_handicap_league_runner.py
