name: 足球王者｜免費API密鑰是否已設定（不讀Key）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-free-api-keys-check.yml'

jobs:
  validate-optional-source-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check all optional GitHub Secrets without API calls or key disclosure
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo "## 足球王者｜免費API密鑰配置確認"
            echo
            echo "只顯示有冇設定對應Secret，唔會輸出真實Key，唔會呼叫供應商API。"
            echo
            echo "| 來源 | GitHub Secret 名稱 | 配置狀態 |"
            echo "|---|---|---|"
            if [ -n "$THE_ODDS_API_KEY" ]; then
              echo '| The Odds API | THE_ODDS_API_KEY | 已設定 |'
            else
              echo '| The Odds API | THE_ODDS_API_KEY | 未設定 |'
            fi
            if [ -n "$API_FOOTBALL_KEY" ]; then
              echo '| API-Football | API_FOOTBALL_KEY | 已設定 |'
            else
              echo '| API-Football | API_FOOTBALL_KEY | 未設定 |'
            fi
            if [ -n "$FOOTBALL_DATA_ORG_TOKEN" ]; then
              echo '| football-data.org | FOOTBALL_DATA_ORG_TOKEN | 已設定 |'
            else
              echo '| football-data.org | FOOTBALL_DATA_ORG_TOKEN | 未設定 |'
            fi
            if [ -n "$SPORTMONKS_API_TOKEN" ]; then
              echo '| Sportmonks | SPORTMONKS_API_TOKEN | 已設定 |'
            else
              echo '| Sportmonks | SPORTMONKS_API_TOKEN | 未設定 |'
            fi
            if [ -n "$OPENFOOT_API_KEY" ]; then
              echo '| OpenFootAPI 免費 Starter | OPENFOOT_API_KEY | 已設定 |'
            else
              echo '| OpenFootAPI 免費 Starter | OPENFOOT_API_KEY | 未設定 |'
            fi
            echo
            echo "TheSportsDB 免費 V1 共用 key 123 已接駁；StatsBomb Open Data 亦毋須Key。"
            echo "API-Football Key 已設定只表示能夠驗證帳戶：2026/27免費賽季授權現時不符合，唔會假稱可用。"
            echo
            echo "注意：Secret 已設定唔代表供應商接納密鑰或提供全部聯賽。真正權限驗收要執行後備免費來源流程。"
            echo
            echo "詳情：https://github.com/CHANCHUNWA1989/football-king-report/blob/main/FREE_API_KEY_SETUP_HK.md"
          } >> "$GITHUB_STEP_SUMMARY"
          # Print only SAFE presence booleans so status can be reviewed
          # from Actions logs as well as the run's Summary.
          for key in THE_ODDS_API_KEY API_FOOTBALL_KEY FOOTBALL_DATA_ORG_TOKEN SPORTMONKS_API_TOKEN OPENFOOT_API_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "SAFE_PRESENCE_${key}=PRESENT"
            else
              echo "SAFE_PRESENCE_${key}=MISSING"
            fi
          done
          echo '配置驗收完成：不會呼叫供應商、不會列印Key，只核對當次Actions環境是否已取得Secret。'
