name: Football King forward audit regression
on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'ops/forward_settlement_audit.py'
      - '.github/workflows/forward-audit-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ops/tests -p 'test_forward_settlement_audit.py' -v
