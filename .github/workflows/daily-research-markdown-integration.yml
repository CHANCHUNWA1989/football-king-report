name: Football daily report JSON and Markdown integration
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/daily_research_cli.py'
      - 'ops/daily_research_markdown.py'
      - 'ops/daily_research_report.py'
      - 'tests/test_daily_research_markdown_integration.py'
      - '.github/workflows/daily-research-markdown-integration.yml'
  pull_request:
    paths:
      - 'ops/daily_research_cli.py'
      - 'ops/daily_research_markdown.py'
      - 'ops/daily_research_report.py'
      - 'tests/test_daily_research_markdown_integration.py'
      - '.github/workflows/daily-research-markdown-integration.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_daily_research_markdown_integration.py' -v
