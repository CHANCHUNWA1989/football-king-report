name: Optional Penaltyblog real dependency smoke

on:
  pull_request:
    paths:
      - "ops/penaltyblog_research_bridge.py"
      - "ops/tests/penaltyblog_real_dependency_smoke.py"
      - ".github/workflows/optional-penaltyblog-real-fit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-real-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional pinned upstream dependency in CI only
        run: python -m pip install 'penaltyblog==1.13.1'
      - name: Fit both upstream models on synthetic fixtures
        run: python -m ops.tests.penaltyblog_real_dependency_smoke
