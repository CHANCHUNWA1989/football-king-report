name: Deep handicap paired evaluation
on:
  pull_request:
    paths:
      - 'ops/deep_handicap_forward_evaluation.py'
      - 'ops/deep_handicap_grade_calibration.py'
      - 'ops/tests/test_deep_handicap_grade_calibration.py'
      - 'ops/tests/test_deep_handicap_forward_evaluation.py'
      - 'ops/asian_handicap_research.py'
      - '.github/workflows/deep-handicap-forward-evaluation.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m compileall -q ops
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_forward_evaluation.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_grade_calibration.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_asian_handicap_research.py' -v
