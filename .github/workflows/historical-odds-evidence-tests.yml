name: Historical odds evidence tests
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/historical_odds_evidence.py'
      - 'tests/test_historical_odds_evidence.py'
      - '.github/workflows/historical-odds-evidence-tests.yml'
  pull_request:
    paths:
      - 'ops/historical_odds_evidence.py'
      - 'tests/test_historical_odds_evidence.py'
      - '.github/workflows/historical-odds-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test historical odds evidence
        run: python -m unittest discover -s tests -p 'test_historical_odds_evidence.py' -v
