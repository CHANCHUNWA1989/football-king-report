name: Agent Reach Zero-Egress Collector Boundary (synthetic only)

on:
  pull_request:
    paths:
      - 'ops/agent_reach_egress_boundary.py'
      - 'ops/tests/test_agent_reach_egress_boundary.py'
      - 'docs/AGENT_REACH_NETWORK_BOUNDARY_V1.md'
      - '.github/workflows/agent-reach-egress-boundary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-none-and-unix-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout research-only code, no reusable token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run no-network synthetic broker tests
        run: |
          python -m compileall -q ops/agent_reach_egress_boundary.py ops/agent_reach_builder_image_guard.py
          python -m unittest discover -s ops/tests -p 'test_agent_reach_egress_boundary.py' -v
          python -m unittest discover -s ops/tests -p 'test_agent_reach_builder_image_guard.py' -v
      - name: Pull previously locked builder image by exact immutable digest
        shell: bash
        run: |
          set -euo pipefail
          pinned_ref="$(python ops/agent_reach_builder_image_guard.py \
            --manifest docs/agent_reach_builder_image_lock.json --reference-only)"
          docker pull --platform linux/amd64 "$pinned_ref"
          test "$(docker image inspect "$pinned_ref" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          echo "RESEARCH_COLLECTOR_IMAGE=$pinned_ref" >> "$GITHUB_ENV"
      - name: End-to-end Docker --network none and local Unix broker (synthetic ONLY)
        shell: bash
        run: |
          set -euo pipefail
          broker_dir="$RUNNER_TEMP/reach-broker"
          mkdir -m 700 "$broker_dir"
          socket_file="$broker_dir/broker.sock"
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONIOENCODING=utf-8 \
            python ops/agent_reach_egress_boundary.py serve --socket "$socket_file" \
            > "$broker_dir/broker.log" 2>&1 &
          broker_pid=$!
          cleanup() {
            kill "$broker_pid" 2>/dev/null || true
            wait "$broker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 100); do
            if test -S "$socket_file"; then ready=1; break; fi
            if ! kill -0 "$broker_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          docker run --rm \
            --pull never \
            --platform linux/amd64 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --pids-limit 64 \
            --memory 256m \
            --cpus 0.5 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/ops/agent_reach_egress_boundary.py,dst=/app/boundary.py,readonly" \
            --mount "type=bind,src=$broker_dir,dst=/bridge,readonly" \
            "$RESEARCH_COLLECTOR_IMAGE" \
            python /app/boundary.py client --socket /bridge/broker.sock
          wait "$broker_pid"
          trap - EXIT
          grep -Fx 'LOCAL_SYNTHETIC_BROKER_SERVED_ONCE; formal_betting=DISABLED' "$broker_dir/broker.log"
      - name: Record what is and is not demonstrated
        run: |
          echo 'CONTAINER_DIRECT_EGRESS=DENIED'
          echo 'LOCAL_AF_UNIX_BROKER=SYNTHETIC_ONLY'
          echo 'REMOTE_SPORTS_DATA_COLLECTED=false'
          echo 'HOST_EGRESS_FIREWALL_VERIFIED=false'
          echo 'PUBLISHER_RIGHTS_VERIFIED=false'
          echo 'PRODUCTION_RECOMMENDATIONS=DISABLED'
