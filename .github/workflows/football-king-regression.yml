name: Football King Regression and Failover CI

on:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/football-king-regression.yml'
      - '.github/workflows/football-king-iphone.yml'
  pull_request:
    paths:
      - 'ops/**'
      - '.github/workflows/football-king-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Simulate free fixture source routing
        run: python -m unittest discover -s ops/tests -p 'test_free_source_failover.py' -q
      - name: Check Python syntax
        run: python -m compileall -q ops
      - name: Run complete ops regression suite including outage simulations
        run: python -m unittest discover -s ops/tests -q
      - name: Run targeted zero-pick, source and failover checks
        run: |
          python -m unittest discover -s ops/tests -p 'test_research*.py' -q
          python -m unittest discover -s ops/tests -p 'test_source_overlay.py' -q
          python -m unittest discover -s ops/tests -p 'test_wide_overlay.py' -q
