name: Agent Reach Independent Review Evidence (advisory; fails closed)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-review-evidence:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'research/agent-reach-') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR research code with no persistent token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic nonauthor and stale-approval tests
        run: |
          python -m compileall -q ops/agent_reach_review_guard.py
          python -m unittest discover -s ops/tests -p 'test_agent_reach_review_guard.py' -v
      - name: Collect only current PR and submitted review metadata
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_READ_TOKEN"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("INVALID_REPO")
          if not re.fullmatch(r"[0-9]{1,9}", number) or not token:
              raise SystemExit("INVALID_PR_OR_AUTH")
          base = f"https://api.github.com/repos/{repo}/pulls/{number}"

          class DenyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("UNEXPECTED_REDIRECT")

          opener = urllib.request.build_opener(DenyRedirect())

          def fetch_url(url):
              # Read-only GitHub metadata from this repository only.
              if not url.startswith(f"https://api.github.com/repos/{repo}/"):
                  raise RuntimeError("UNEXPECTED_REVIEW_METADATA_URL")
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "football-king-review-metadata-gate"})
              with opener.open(req, timeout=15) as response:
                  data = response.read(1_000_001)
                  if len(data) > 1_000_000:
                      raise RuntimeError("REVIEW_METADATA_TOO_LARGE")
                  if 'rel="next"' in response.headers.get("Link", ""):
                      raise RuntimeError("PAGINATED_REVIEWS_CANNOT_BE_TRUSTED")
              return json.loads(data)

          def fetch(path):
              if path not in ("", "/reviews?per_page=100"):
                  raise RuntimeError("UNEXPECTED_PR_METADATA_PATH")
              return fetch_url(base + path)

          pr_before = fetch("")
          reviews = fetch("/reviews?per_page=100")
          if not isinstance(pr_before, dict) or not isinstance(reviews, list):
              raise RuntimeError("INVALID_GITHUB_PR_OR_REVIEW_DATA")
          head = pr_before.get("head")
          user = pr_before.get("user")
          sha = head.get("sha") if isinstance(head, dict) else None
          author = user.get("login") if isinstance(user, dict) else None
          if (not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha) or
                  not isinstance(author, str) or not re.fullmatch(r"[A-Za-z0-9-]{1,100}", author) or
                  len(reviews) > 100):
              raise RuntimeError("INVALID_GITHUB_PR_IDENTITY_OR_REVIEW_LIMIT")

          # Association isn't current repository permission. Query only
          # exact-head human non-author APPROVED reviewers, max ten.
          candidates = set()
          for review in reviews:
              if not isinstance(review, dict):
                  raise RuntimeError("INVALID_GITHUB_REVIEW")
              identity = review.get("user")
              if (review.get("state") != "APPROVED" or
                      review.get("commit_id") != sha or
                      not isinstance(identity, dict) or
                      identity.get("type") != "User"):
                  continue
              login = identity.get("login")
              if not isinstance(login, str) or not re.fullmatch(r"[A-Za-z0-9-]{1,100}", login):
                  raise RuntimeError("INVALID_GITHUB_REVIEW_LOGIN")
              if login.lower() != author.lower() and not login.lower().endswith("-bot"):
                  candidates.add(login.lower())
          if len(candidates) > 10:
              raise RuntimeError("TOO_MANY_REVIEW_PERMISSION_LOOKUPS")

          permissions = {}
          for login in sorted(candidates):
              permission_url = (
                  f"https://api.github.com/repos/{repo}/collaborators/"
                  f"{login}/permission")
              response = fetch_url(permission_url)  # GET only, HTTP 403 => HOLD
              if (not isinstance(response, dict) or
                      not isinstance(response.get("user"), dict) or
                      not isinstance(response["user"].get("login"), str)):
                  raise RuntimeError("INVALID_CURRENT_PERMISSION_RESPONSE")
              permissions[login] = {
                  "login": response["user"]["login"],
                  "permission": response.get("permission"),
              }

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          (temp / "reach-pr-review-gate.json").write_text(
              json.dumps(pr_before), encoding="utf-8")
          (temp / "reach-review-evidence.json").write_text(
              json.dumps(reviews), encoding="utf-8")
          (temp / "reach-review-permissions.json").write_text(
              json.dumps(permissions), encoding="utf-8")
          # Re-read the PR after permissions lookups to catch head drift.
          (temp / "reach-pr-review-post.json").write_text(
              json.dumps(fetch("")), encoding="utf-8")
          print("GITHUB_PR_DOUBLE_READ_AND_PERMISSION_EVIDENCE_CHECKED; review_body_not_logged")
          PY
      - name: Hold unless an independent human approved this exact head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python ops/agent_reach_review_guard.py \
            --pr "$RUNNER_TEMP/reach-pr-review-gate.json" \
            --reviews "$RUNNER_TEMP/reach-review-evidence.json" \
            --permissions "$RUNNER_TEMP/reach-review-permissions.json" \
            --post-pr "$RUNNER_TEMP/reach-pr-review-post.json" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --expected-pr-number "$EXPECTED_PR_NUMBER"
      - name: Explicitly avoid autonomous merge
        if: always()
        run: echo 'THIS_IS_ONLY_AN_ADVISORY_REVIEW_EVIDENCE_CHECK; ADMIN_REQUIRED_CHECKS_NOT_VERIFIED; FORMAL_BETTING=DISABLED'
