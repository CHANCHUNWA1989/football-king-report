name: Unified prediction ledger tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shared ledger regression tests
        run: python -m unittest shared.test_unified_prediction_ledger shared.test_unified_prediction_evaluation -v
