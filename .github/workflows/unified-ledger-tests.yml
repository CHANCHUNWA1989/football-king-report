name: Unified prediction ledger tests
on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/unified-evaluation-20261017
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: read
jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run shared ledger regression tests
        run: python -m unittest shared.test_unified_prediction_ledger shared.test_unified_prediction_evaluation shared.test_unified_prediction_report shared.test_execution_guard shared.test_recommendation_screen shared.test_source_freshness shared.test_evidence_gate shared.test_pipeline_contract test_settlement_input_limits -v
