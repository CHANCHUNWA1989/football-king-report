name: Football King Master Skill contracts
on:
  pull_request:
    paths:
      - '.agents/skills/football-king-master/**'
      - '.github/workflows/football-king-master-skill.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Runtime version
        run: node --version
      - name: Synthetic evidence and scoring contract
        run: node .agents/skills/football-king-master/selftest.mjs
      - name: Research routing and CI evidence contract
        run: node .agents/skills/football-king-master/dispatch.mjs --selftest
      - name: CLI routing smoke test
        run: node .agents/skills/football-king-master/dispatch.mjs --route '下一階段'
      - name: Historical source replay and negative cases
        run: node .agents/skills/football-king-master/source-audit.mjs
      - name: Paired arena synthetic contracts
        run: node .agents/skills/football-king-master/arena.mjs --selftest
      - name: Read-only archived ledger diagnostic
        run: node .agents/skills/football-king-master/arena.mjs --ledger evidence/settled.json
      - name: Isolated fault injection and rollback tests
        run: node .agents/skills/football-king-master/recovery.mjs --selftest
      - name: Read-only repository fault diagnosis
        run: node .agents/skills/football-king-master/recovery.mjs --diagnose
      - name: Integrated hub fault contracts
        run: node .agents/skills/football-king-master/hub.mjs --selftest
      - name: Execute integrated read-only research hub
        run: node .agents/skills/football-king-master/hub.mjs --run
      - name: Durable research queue concurrency and state tests
        run: python3 .agents/skills/football-king-master/test_research_queue.py
      - name: Real cross-process research queue execution
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          script=.agents/skills/football-king-master/research_queue.py
          state="$tmp/state"
          python3 "$script" init "$state"
          python3 "$script" enqueue "$state"
          python3 "$script" enqueue "$state"
          python3 "$script" run "$state" | tee "$tmp/run.json"
          python3 "$script" run "$state" | tee "$tmp/duplicate.json"
          python3 "$script" stop "$state"
          python3 "$script" status "$state" | tee "$tmp/status.json"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          run, duplicate, status=[json.loads((p/f).read_text()) for f in ('run.json','duplicate.json','status.json')]
          assert run['runOutcome']=='SUCCESS' and len(run['jobs'])==1 and run['jobs'][0]['attempts']==1
          assert duplicate['runOutcome']=='NO_CLAIM' and duplicate['jobs'][0]['status']=='SUCCEEDED'
          assert status['stopped'] is True and status['jobs'][0]['status']=='SUCCEEDED'
          assert all(x['release']=='HOLD' and x['production_recommendations']=='DISABLED' for x in (run,duplicate,status))
          print('CROSS_PROCESS_QUEUE_OK')
          PY
      - name: Anchored evidence chain and leakage fault tests
        run: node --test .agents/skills/football-king-master/evidence-chain.test.mjs
      - name: Read-only historical ledger evidence admission audit
        run: node .agents/skills/football-king-master/evidence-chain.mjs --audit
      - name: Rolling calibration and degradation contracts
        run: node .agents/skills/football-king-master/calibration.mjs --selftest
      - name: Read-only retrospective calibration replay
        run: node .agents/skills/football-king-master/calibration.mjs --ledger evidence/settled.json
      - name: Cross-review evidence binding and spoofing tests
        run: python3 .agents/skills/football-king-master/test_cross_review.py
      - name: Four-domain deterministic cross-review
        run: python3 .agents/skills/football-king-master/cross_review.py --run
      - name: Six-hour cycle state and safety contracts
        run: python3 .agents/skills/football-king-master/test_research_scheduler.py
      - name: Cloud end-to-end research cycle and duplicate stop drill
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          script=.agents/skills/football-king-master/research_scheduler.py
          python3 "$script" init "$tmp/state"
          python3 "$script" run "$tmp/state" | tee "$tmp/first.json"
          python3 "$script" run "$tmp/state" | tee "$tmp/duplicate.json"
          python3 "$script" stop "$tmp/state"
          python3 "$script" status "$tmp/state" | tee "$tmp/stopped.json"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          a,b,c=[json.loads((p/f).read_text()) for f in ('first.json','duplicate.json','stopped.json')]
          assert a['cycleOutcome']=='SUCCEEDED' and len(a['cycles'])==1
          s=a['cycles'][0]['summary']
          assert set(s['stages'])=={'diagnose','hub','evidence','model','review'}
          assert s['inputsUnchanged'] is True and s['vendorCalls']==0 and s['newForwardRecords']==0
          assert b['cycleOutcome']=='NO_CLAIM' and len(b['cycles'])==1
          assert c['stopped'] is True and c['cycles'][0]['status']=='SUCCEEDED'
          assert all(x['release']=='HOLD' and x['production_recommendations']=='DISABLED' and not x['continuousOperationVerified'] for x in (a,b,c))
          print('V3_RESEARCH_CYCLE_OK')
          PY
  scheduled-research:
    if: github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch && vars.FOOTBALL_KING_MASTER_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: football-king-master-scheduled-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse blank-state scheduled startup until durable anchor is qualified
        run: |
          echo "::error::HOLD: trusted durable latest-anchor service is not deployed; refusing fresh scheduled state"
          exit 1
  checkpoint-producer:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checkpoint-sha: ${{ steps.checkpoint.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkpoint recovery and health tests
        run: python3 .agents/skills/football-king-master/test_deployment_checkpoint.py
      - name: Run actual cycle and export checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-checkpoint"
          mkdir -m 700 "$base"
          script=.agents/skills/football-king-master/research_scheduler.py
          checkpoint=.agents/skills/football-king-master/deployment_checkpoint.py
          python3 "$script" init "$base/state"
          python3 "$script" run "$base/state"
          python3 "$checkpoint" export "$base/state" "$base/checkpoint.json"
          digest="$(sha256sum "$base/checkpoint.json" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fk-master-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fk-checkpoint/checkpoint.json
          retention-days: 1
          if-no-files-found: error
      - name: Producer failure annotation
        if: failure()
        run: |
          echo "::error::Research checkpoint producer failed; HOLD, do not deploy"
          echo "Research checkpoint producer failed. HOLD." >> "$GITHUB_STEP_SUMMARY"
  checkpoint-consumer:
    if: github.event_name == 'pull_request'
    needs: checkpoint-producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fk-master-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fk-restore
      - name: Restore on a separate runner and verify duplicate protection
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.checkpoint-producer.outputs.checkpoint-sha }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-restore"
          checkpoint=.agents/skills/football-king-master/deployment_checkpoint.py
          python3 "$checkpoint" restore "$base/state" "$base/checkpoint.json" "$EXPECTED_SHA"
          python3 - "$base/state" <<'PY'
          import sys
          sys.path.insert(0,'.agents/skills/football-king-master')
          import research_scheduler as s
          import research_queue as q
          import deployment_checkpoint as c
          p=sys.argv[1]
          st=s.status(p)
          assert len(st['cycles'])==1 and st['cycles'][0]['status']=='SUCCEEDED'
          assert st['cycles'][0]['summary']['inputsUnchanged'] is True
          assert s.claim(p,st['cycles'][0]['slot']) is None
          assert len(q.snapshot(p)['jobs'])==1 and q.snapshot(p)['jobs'][0]['status']=='SUCCEEDED'
          assert c.health(p)['level']=='RESEARCH_ONLY'
          q.stop(p)
          assert s.claim(p,st['cycles'][0]['slot']+s.PERIOD) is None
          assert c.health(p)['level']=='BLOCKED'
          print('V31_CROSS_RUNNER_RESTORE_OK')
          PY
          python3 "$checkpoint" health "$base/state"
          echo "::warning::Expected STOP drill: research execution blocked; no production release"
          echo "V3.1 checkpoint restored on separate runner; expected STOP warning verified. HOLD/DISABLED. No independent review or uptime claim." >> "$GITHUB_STEP_SUMMARY"
      - name: Real checkpoint Git bundle disaster recovery drill
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-restore"
          python3 .agents/skills/football-king-master/git_state_anchor.py drill "$base/checkpoint.json" "$base/git-drill"
          echo "V3.3 local Git checkpoint bundle recovery completed; no permanent hosted anchor or deployment authorized." >> "$GITHUB_STEP_SUMMARY"
      - name: Consumer failure annotation
        if: failure()
        run: |
          echo "::error::Research checkpoint restoration failed; HOLD, do not deploy"
          echo "Research checkpoint restoration failed. HOLD." >> "$GITHUB_STEP_SUMMARY"
  continuity-contracts:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Continuity rollback and missed-slot regression cases
        run: python3 .agents/skills/football-king-master/test_continuity.py
  historical-cross-workflow:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 788 && github.event.pull_request.head.repo.full_name == github.repository
    needs: continuity-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check pinned prior workflow provenance and availability
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-prior"
          mkdir -m 700 "$base"
          if [ "$(date -u +%s)" -ge 1795948667 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pinned historical checkpoint expired; cross-workflow qualification not repeated"
            exit 0
          fi
          gh api repos/CHANCHUNWA1989/football-king-report/actions/runs/46136054136 > "$base/run.json"
          gh api repos/CHANCHUNWA1989/football-king-report/actions/artifacts/15259284443 > "$base/artifact.json"
          python3 - "$base" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          r=json.loads((p/'run.json').read_text())
          a=json.loads((p/'artifact.json').read_text())
          repo='CHANCHUNWA1989/football-king-report'
          head='f313ee9ed3a6d7ea9eb42fe836cb75d7e3ac7224'
          assert r['id']==46136054136 and r['head_sha']==head and r['conclusion']=='success' and r['status']=='completed'
          assert r['repository']['full_name']==repo and r['workflow_id']==433590348
          assert a['id']==15259284443 and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==head
          assert a['name']=='fk-master-checkpoint-46136054136-1' and a['expired'] is False
          assert a['digest']=='sha256:51b7582116fcd776550543c823951cbaa851ed6c662e0d664d60b2b62910d2a6'
          observed=dict(repository=repo,runId=r['id'],artifactId=a['id'],headSha=head,conclusion=r['conclusion'],expired=a['expired'])
          expected=dict(repository=repo,runId=46136054136,artifactId=15259284443,headSha=head,checkpointSha256='fcb8aa02c3ccb00680edb456e4a2e2413a8388b77bb57c1a60cf21fb6da4141e',lastSlot=1795845600,cycleCount=1)
          (p/'observed.json').write_text(json.dumps(observed))
          (p/'expected.json').write_text(json.dumps(expected))
          print('PRIOR_WORKFLOW_PROVENANCE_OK')
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.provenance.outputs.available == 'true'
        with:
          artifact-ids: '15259284443'
          run-id: '46136054136'
          repository: CHANCHUNWA1989/football-king-report
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fk-prior/download
      - name: Restore prior workflow state and validate historical continuity
        if: steps.provenance.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-prior"
          checkpoint="$base/download/fk-master-checkpoint-46136054136-1/checkpoint.json"
          script=.agents/skills/football-king-master/continuity.py
          python3 "$script" restore "$checkpoint" "$base/expected.json" "$base/observed.json" "$base/state"
          python3 "$script" monitor "$checkpoint"
          python3 - "$base" <<'PY'
          import sys, pathlib
          sys.path.insert(0,'.agents/skills/football-king-master')
          import continuity as v
          import deployment_checkpoint as c
          import research_scheduler as s
          import research_queue as q
          p=pathlib.Path(sys.argv[1])
          old=(p/'download/fk-master-checkpoint-46136054136-1/checkpoint.json').read_bytes()
          assert c.export_bytes(p/'state')==old
          st=s.status(p/'state')
          last=st['cycles'][-1]['slot']
          assert s.claim(p/'state',last) is None
          assert s.claim(p/'state',last-s.PERIOD) is None
          assert len(q.snapshot(p/'state')['jobs'])==1
          # Deliberately simulated future slot, not a real scheduled run.
          h=v.monitor(v.decode(old),last+s.PERIOD+v.GRACE)
          assert h['level']=='MISSED_SCHEDULE' and h['missedSlots']==1
          print('V32_PRIOR_WORKFLOW_RESTORE_OK')
          print('V32_SIMULATED_MISSED_SLOT_ALERT_OK')
          PY
          echo "::warning::Expected simulated missed-slot drill; HOLD, no actual missed schedule or push delivery claimed"
          echo "V3.2 restored pinned prior workflow checkpoint; rollback and simulated missing-slot drill verified. HOLD/DISABLED." >> "$GITHUB_STEP_SUMMARY"
      - name: Continuity failure annotation
        if: failure()
        run: |
          echo "::error::Prior workflow continuity validation failed; HOLD"
          echo "Prior workflow continuity validation failed; HOLD." >> "$GITHUB_STEP_SUMMARY"
  git-anchor-contracts:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Atomic Git anchor and independent reviewer qualification tests
        run: python3 .agents/skills/football-king-master/test_git_state_anchor.py
  review-qualification:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 788 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read actual exact-head review metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-review-qualification"
          mkdir -m 700 "$base"
          gh api repos/CHANCHUNWA1989/football-king-report/pulls/788 > "$base/pr.json"
          gh api --paginate --slurp repos/CHANCHUNWA1989/football-king-report/pulls/788/reviews > "$base/pages.json"
          python3 - "$base" <<'PY'
          import os,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          pr=json.loads((p/'pr.json').read_text())
          assert pr['head']['sha']==os.environ['EXPECTED_HEAD']
          pages=json.loads((p/'pages.json').read_text())
          assert isinstance(pages,list) and all(isinstance(x,list) for x in pages)
          (p/'reviews.json').write_text(json.dumps([r for page in pages for r in page]))
          PY
          python3 .agents/skills/football-king-master/git_state_anchor.py review "$base/pr.json" "$base/reviews.json"
          echo "::warning::Independent Agent review still requires external authentication; deployment HOLD"
          echo "Exact-head GitHub review metadata checked. Automated candidate check is not independent Agent authentication." >> "$GITHUB_STEP_SUMMARY"
  remote-anchor-qualification:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 788 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remote anchor safety contracts
        run: python3 .agents/skills/football-king-master/test_remote_anchor.py
      - name: Read remote protection metadata and independently fetch synthetic anchor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-remote-v34"
          mkdir -m 700 "$base"
          repo=CHANCHUNWA1989/football-king-report
          branch=research/master-skill-v34-anchor-drill
          encoded=research%2Fmaster-skill-v34-anchor-drill
          gh api "repos/$repo/branches/$encoded" > "$base/branch.json"
          if ! gh api "repos/$repo/rules/branches/$encoded" > "$base/rules.json"; then
            echo null > "$base/rules.json"
            echo "::warning::Effective branch rules unavailable; protection qualification HOLD"
          fi
          git init --bare "$base/remote.git"
          git -C "$base/remote.git" -c protocol.file.allow=never fetch --no-tags --depth=2 "https://github.com/$repo.git" "refs/heads/$branch:refs/heads/$branch"
          python3 .agents/skills/football-king-master/remote_anchor.py "$base/remote.git" "$base/branch.json" "$base/rules.json"
          echo "::warning::Synthetic remote restore only; actual branch protection enforcement, independent review and deployment remain HOLD"
          echo "Remote synthetic anchor restored from GitHub; no production anchor or deployment authorization." >> "$GITHUB_STEP_SUMMARY"
  deployment-eligibility:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 788 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact-head deployment and reviewer gate tests
        run: python3 .agents/skills/football-king-master/test_deployment_gate.py
      - name: Read actual deployment qualification metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fk-deploy-gate"
          mkdir -m 700 "$base"
          repo=CHANCHUNWA1989/football-king-report
          anchor=research%2Fmaster-skill-v34-anchor-drill
          gh api "repos/$repo/pulls/788" > "$base/pr.json"
          gh api "repos/$repo/branches/main" > "$base/main.json"
          gh api "repos/$repo/branches/$anchor" > "$base/anchor.json"
          optional() {
            if ! gh api "$1" > "$2" 2>/dev/null; then
              echo null > "$2"
            fi
          }
          optional "repos/$repo/rules/branches/main" "$base/main-rules.json"
          optional "repos/$repo/rules/branches/$anchor" "$base/anchor-rules.json"
          optional "repos/$repo/branches/main/protection" "$base/main-classic.json"
          optional "repos/$repo/branches/$anchor/protection" "$base/anchor-classic.json"
          gh api --paginate --slurp "repos/$repo/pulls/788/reviews?per_page=100" > "$base/review-pages.json"
          gh api --paginate --slurp "repos/$repo/actions/runs?head_sha=$EXPECTED_HEAD&event=pull_request&per_page=100" > "$base/run-pages.json"
          if ! gh api --paginate --slurp "repos/$repo/collaborators?affiliation=direct&per_page=100" > "$base/collaborator-pages.json" 2>/dev/null; then
            echo null > "$base/collaborator-pages.json"
          fi
          python3 - "$base" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          def load(name): return json.loads((p/(name+".json")).read_text())
          def save(name,value): (p/(name+".json")).write_text(json.dumps(value))
          reviews=load("review-pages")
          assert isinstance(reviews,list) and all(isinstance(x,list) for x in reviews)
          save("reviews",[r for page in reviews for r in page])
          runs=load("run-pages")
          assert isinstance(runs,list) and all(isinstance(x.get("workflow_runs"),list) for x in runs)
          save("runs",[r for page in runs for r in page["workflow_runs"]])
          co=load("collaborator-pages")
          save("collaborators",[r for page in co for r in page] if isinstance(co,list) and all(isinstance(x,list) for x in co) else None)
          PY
          python3 .agents/skills/football-king-master/deployment_gate.py "$base" "$EXPECTED_HEAD" | tee "$base/report.json"
          python3 - "$base/report.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert r["deploymentAuthorized"] is False and r["mergeAuthorized"] is False and r["release"]=="HOLD" and r["production_recommendations"]=="DISABLED"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Deployment qualification: HOLD\n")
              for reason in r["blockers"]: f.write("- "+reason+"\n")
          PY
          echo "::warning::Deployment remains HOLD; metadata audit does not certify independent review or protection enforcement"
  asia-migration-pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Existing Asia adapter offline contract
        run: python3 -m unittest discover -s ops/tests -p test_asia_sources_connect.py -q
      - name: Synthetic migration concurrency and recovery tests
        run: python3 .agents/skills/football-king-master/test_asia_migration.py
      - name: Local protected receiver and exact-byte disaster recovery drill
