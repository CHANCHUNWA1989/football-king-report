name: Agent Reach Offline Build SHA256 + Network-Deny CI

on:
  pull_request:
    paths:
      - 'ops/agent_reach_build_wheel_guard.py'
      - 'ops/tests/test_agent_reach_build_wheel_guard.py'
      - 'docs/agent_reach_build_wheels.txt'
      - 'docs/agent_reach_build_wheelhash_lock.json'
      - 'docs/AGENT_REACH_OFFLINE_BUILD_V1.md'
      - '.github/workflows/agent-reach-offline-build-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-no-network-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout project without retained GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact audited Agent Reach Git commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Panniantong/Agent-Reach
          ref: 7a38047acf26a729cbb27851e3cb81639da86b29
          path: vendor/agent-reach
          persist-credentials: false
      - name: Check source commit cannot drift
        run: test "$(git -C vendor/agent-reach rev-parse HEAD)" = "7a38047acf26a729cbb27851e3cb81639da86b29"
      - name: Python 3.12 for hash tools only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test build SHA256 audit against synthetic tamper and traversal cases
        run: |
          python -m compileall -q ops/agent_reach_build_wheel_guard.py
          python -m unittest discover -s ops/tests -p 'test_agent_reach_build_wheel_guard.py' -v
      - name: Re-download exact approved build dependencies into isolated staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reach-build-wheelhouse"
          python -m pip download --only-binary=:all: --no-cache-dir --no-deps \
            -r docs/agent_reach_build_wheels.txt \
            --dest "$RUNNER_TEMP/reach-build-wheelhouse"
      - name: Match independent committed build wheel SHA256 and generate pip hashes
        shell: bash
        run: |
          set -euo pipefail
          python ops/agent_reach_build_wheel_guard.py \
            --wheelhouse "$RUNNER_TEMP/reach-build-wheelhouse" \
            --manifest docs/agent_reach_build_wheelhash_lock.json \
            --requirements-output "$RUNNER_TEMP/reach-build-hashed.txt"
      - name: Build Agent Reach wheel in a container without network or credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --pids-limit 96 \
            --memory 768m \
            --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user "$(id -u):$(id -g)" \
            --env PIP_NO_INDEX=1 \
            --env PIP_NO_CACHE_DIR=1 \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/vendor/agent-reach,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/reach-build-wheelhouse,dst=/wheels,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/reach-build-hashed.txt,dst=/hashes.txt,readonly" \
            python:3.12-slim sh -ec '
              python -m venv /tmp/buildenv
              /tmp/buildenv/bin/python -m pip install \
                --no-index --find-links=/wheels --require-hashes --no-deps -r /hashes.txt
              /tmp/buildenv/bin/python -m pip check
              mkdir -p /tmp/built
              /tmp/buildenv/bin/python -m pip wheel --no-deps --no-build-isolation --no-index \
                --wheel-dir=/tmp/built /src
              /tmp/buildenv/bin/python -c "import pathlib,zipfile,hashlib; ws=list(pathlib.Path(\"/tmp/built\").glob(\"agent_reach-1.6.1-*.whl\")); assert len(ws)==1; w=ws[0]; z=zipfile.ZipFile(w); assert any(x.endswith(\".dist-info/METADATA\") for x in z.namelist()); print(\"OFFLINE_SOURCE_WHEEL_BUILT; sha256=\"+hashlib.sha256(w.read_bytes()).hexdigest())"
              /tmp/buildenv/bin/python -c "import socket; sock=socket.socket(); sock.settimeout(2); code=sock.connect_ex((\"1.1.1.1\",443)); sock.close(); assert code!=0, \"UNEXPECTED_NETWORK_ACCESS\"; print(\"NETWORK_NONE_EGRESS_DENIED; betting=DISABLED\")"
            '
      - name: Record narrow scope
        run: |
          echo "BUILDER_EXACT_GIT_COMMIT=7a38047acf26a729cbb27851e3cb81639da86b29"
          echo "BUILD_DEPENDENCIES_HASH_VERIFIED=5"
          echo "CONTAINER_RUNTIME_NETWORK=none"
          echo "DOCKER_IMAGE_DIGEST_PINNED=false"
          echo "HOST_EGRESS_FIREWALL_VERIFIED=false"
          echo "FORMAL_BETTING=DISABLED"
