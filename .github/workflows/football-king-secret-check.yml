name: 足球王者｜安全檢查賠率密鑰是否存在

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-secret-check.yml'

permissions:
  contents: read

jobs:
  secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Get read-only connector code
        uses: actions/checkout@v4

      - name: Check only whether secret is present (no API calls)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${THE_ODDS_API_KEY:-}" ]; then
            echo "THE_ODDS_API_KEY_PRESENT=true"
            echo "This proves availability to this workflow, not key validity."
          else
            echo "THE_ODDS_API_KEY_PRESENT=false"
            echo "Please add it under this repository's Actions Repository secrets."
            exit 1
          fi

      - name: Validate key against FREE The Odds API sports catalog
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          # /v4/sports has no billed odds lookup; all logs are secret-safe.
          python ops/odds_market.py --mode verify
