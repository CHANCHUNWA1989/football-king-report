name: Nine-core remediation and frozen holdout
on:
  pull_request:
    paths:
      - 'ops/live_core_nine_remediation.py'
      - 'ops/live_core_nine_remediation_cli.py'
      - 'ops/live_core_frozen_2025_holdout.py'
      - 'ops/tests/test_live_core_nine_remediation*.py'
      - '.github/workflows/nine-core-remediation.yml'
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Combined offline live core tests
        run: python -m unittest discover -s ops/tests -p 'test_live_core_*.py' -v
      - name: Two pinned public-domain historical reads and frozen comparison
        run: python ops/live_core_frozen_2025_holdout.py
