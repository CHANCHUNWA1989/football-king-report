name: Football King Archive Bootstrap Remote Readonly Canary

on:
  pull_request:
    paths:
      - 'ops/archive_remote_bootstrap_probe.py'
      - 'ops/tests/test_archive_remote_bootstrap_probe.py'
      - 'ops/archive_remote_policy_probe.py'
      - 'ops/tests/test_archive_remote_policy_probe.py'
      - 'ops/pinned_history_tree_rehash.py'
      - 'ops/pinned_history_candidate_readback.py'
      - 'ops/thirteen_latest_reader_preflight.py'
      - 'ops/archive_custody_subject.py'
      - 'ops/archive_independent_review_gate.py'
      - 'ops/german_cadence_window.py'
      - '.github/workflows/football-king-german-cadence-monitor.yml'
      - 'ops/tests/test_p0_stage10.py'
      - 'docs/P0_STAGE10_PINNED_OBSERVATION.json'
      - 'ops/archive_custody_increment.py'
      - 'ops/tests/test_archive_custody_increment.py'
      - 'docs/P0_569_PINNED_89_HISTORY_TREE_2026_11_24.json'
      - 'ops/archive_external_witness.py'
      - 'ops/german_schedule_gap.py'
      - 'ops/german_publication_monitor.py'
      - 'ops/archive_witness_qualification.py'
      - 'ops/tests/test_p0_stage8.py'
      - 'docs/P0_STAGE8_GERMAN_RUN_OBSERVATION.json'
      - 'ops/tests/test_archive_external_witness.py'
      - 'ops/tests/test_archive_custody_subject.py'
      - 'ops/tests/test_thirteen_latest_reader_preflight.py'
      - 'ops/tests/test_p0_archive_integrated_replay.py'
      - 'ops/isolated_settlement_bridge.py'
      - 'ops/settled_archive_request.py'
      - 'ops/tests/test_pinned_history_tree_rehash.py'
      - 'docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json'
      - 'ops/pinned_public_snapshot_observer.py'
      - 'ops/tests/test_pinned_public_snapshot_observer.py'
      - 'docs/P0_569_PINNED_35_HISTORY_BLOBS_SHA256_2026_11_24.json'
      - '.github/workflows/football-king-archive-bootstrap-readonly.yml'
  workflow_dispatch:

# This workflow MUST remain non-mutating. No pull_request_target, push,
# secrets, write permissions, GitHub branch creation, or archive uploads.
permissions:
  contents: read

jobs:
  archive-bootstrap-ref-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR research code without persisted Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline adversarial parser tests (no network)
        run: python -m unittest ops.tests.test_archive_remote_bootstrap_probe -v
      - name: Observe actual public GitHub staging archive ref (READ ONLY)
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: python -m ops.archive_remote_bootstrap_probe --read-only
      - name: Audit effective archive rules and classic protection (READ ONLY; never release)
        run: |
          python -m unittest ops.tests.test_archive_remote_policy_probe -v
          python -m ops.archive_remote_policy_probe --observe-only

      - name: Pinned snapshot observer offline regression
        run: python -m unittest ops.tests.test_pinned_public_snapshot_observer -v
      - name: Compare real pinned public Git trees and replay both mobile builders (READ ONLY)
        run: python -m ops.pinned_public_snapshot_observer --observe-only

  archive-pinned-source-rehash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR research code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify 88-path pinned history inventory and original compressed bytes
        run: |
          set -euo pipefail
          python -m unittest ops.tests.test_pinned_history_tree_rehash -v
          # Fetch public objects only into an ephemeral local repository.
          # Full history is needed to establish the exact common ancestor.
          review_repo="$RUNNER_TEMP/pinned-history-review"
          git init -q "$review_repo"
          git -C "$review_repo" fetch --no-tags https://github.com/CHANCHUNWA1989/football-king-report.git 513f4e24f834091d3de038d55881d8ba9a744c79 3ce493fbeb9bfea29af1b93064a085afe8efb280
          python -m ops.pinned_history_tree_rehash --repo "$review_repo" --manifest docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json
          git -C "$review_repo" fetch --no-tags https://github.com/CHANCHUNWA1989/football-king-report.git 8fc67255419a81e4fad0ae5a3901be9ba99a345f
          python -m ops.pinned_history_candidate_readback --repo "$review_repo" --manifest docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json --candidate 8fc67255419a81e4fad0ae5a3901be9ba99a345f
      - name: Local-only bulk writer reader and mobile parity regression
        run: python -m unittest ops.tests.test_p0_archive_integrated_replay -v
      - name: Thirteen pinned mutable pointer observation (no source switch)
        run: |
          python -m unittest ops.tests.test_thirteen_latest_reader_preflight -v
          python -m ops.thirteen_latest_reader_preflight --repo "$RUNNER_TEMP/pinned-history-review" --source 513f4e24f834091d3de038d55881d8ba9a744c79 --archive 3ce493fbeb9bfea29af1b93064a085afe8efb280 --candidate 8fc67255419a81e4fad0ae5a3901be9ba99a345f
      - name: Build unsigned exact custody subject (never authorize write)
        run: |
          python -m unittest ops.tests.test_archive_custody_subject -v
          python -m ops.archive_custody_subject --repo "$RUNNER_TEMP/pinned-history-review" --manifest docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json --candidate 8fc67255419a81e4fad0ae5a3901be9ba99a345f
      - name: Verify real local TSA fixture and prepare unsigned witness inputs
        run: |
          python -m unittest ops.tests.test_archive_external_witness -v
          python -m ops.archive_external_witness prepare --repo "$RUNNER_TEMP/pinned-history-review" --manifest docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json --candidate 8fc67255419a81e4fad0ae5a3901be9ba99a345f --out "$RUNNER_TEMP/custody-witness-inputs"
      - name: Retain unsigned public subject and TSA request only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-unsigned-custody-witness-inputs
          path: ${{ runner.temp }}/custody-witness-inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Verify German recovery from pinned main and audit witness candidates
        run: |
          python -m unittest ops.tests.test_p0_stage8 -v
          git -C "$RUNNER_TEMP/pinned-history-review" fetch --no-tags https://github.com/CHANCHUNWA1989/football-king-report.git 6f40f84a1418ca4e2d42c8ba2bbd21a656d52a24
          python -m ops.archive_witness_qualification --repo "$RUNNER_TEMP/pinned-history-review" --main-sha 6f40f84a1418ca4e2d42c8ba2bbd21a656d52a24
          python - <<'PY'
          import json, os
          from datetime import datetime
          from ops.german_publication_monitor import inspect
          with open("docs/P0_STAGE8_GERMAN_RUN_OBSERVATION.json") as f:
              d = json.load(f)
          r = inspect(os.environ["RUNNER_TEMP"]+"/pinned-history-review",
                      "6f40f84a1418ca4e2d42c8ba2bbd21a656d52a24", d["latest"],
                      datetime.fromisoformat("2026-11-24T12:45:00+00:00"), d["previous"])
          print(json.dumps(r,sort_keys=True))
          assert r["publication_correlated"] and r["coverage_available"] == 3
          assert r["schedule_gap_exceeds_two_hours"] and not r["scheduled_cadence_restored"]
          PY
      - name: Verify linked 88 to 89 history subject, no signing
        run: |
          python -m unittest ops.tests.test_archive_custody_increment -v
          git -C "$RUNNER_TEMP/pinned-history-review" fetch --no-tags https://github.com/CHANCHUNWA1989/football-king-report.git a7059fc5af1bf4465aced0fba914c526d121c5a4
          python -m ops.archive_custody_increment --repo "$RUNNER_TEMP/pinned-history-review" --previous docs/P0_569_PINNED_88_HISTORY_TREE_2026_11_24.json --current docs/P0_569_PINNED_89_HISTORY_TREE_2026_11_24.json --out "$RUNNER_TEMP/linked-custody"
      - name: Retain unsigned linked subject and TSA query
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-unsigned-linked-custody-89
          path: ${{ runner.temp }}/linked-custody/
          if-no-files-found: error
          retention-days: 14
      - name: Independent review and multi-run cadence predeployment tests (no authorization)
        run: |
          set -euo pipefail
          python -m unittest ops.tests.test_p0_stage10 -v
          python -m ops.archive_independent_review_gate --observations docs/P0_STAGE10_PINNED_OBSERVATION.json --subject "$RUNNER_TEMP/linked-custody/linked-custody-subject.json"
          git -C "$RUNNER_TEMP/pinned-history-review" fetch --no-tags https://github.com/CHANCHUNWA1989/football-king-report.git c27590eb9ebf8e722edbb052ef38ea5f0873aaf5
          python -m ops.german_cadence_window --repo "$RUNNER_TEMP/pinned-history-review" --main-sha c27590eb9ebf8e722edbb052ef38ea5f0873aaf5 --observations docs/P0_STAGE10_PINNED_OBSERVATION.json
