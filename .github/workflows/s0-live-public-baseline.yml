name: S0 public site live baseline receipt (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/s0-live-public-baseline.yml'
      - 'ops/release_baseline.py'
      - 'ops/tests/test_release_baseline.py'
      - 'docs/s0_release_baseline_20261103.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_public_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR baseline reader without credential persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline fail-closed baseline tests
        run: python -m unittest ops.tests.test_release_baseline -v
      - name: Fetch LIVE deployed Pages and main/PR public metadata only
        shell: bash
        run: |
          set -euo pipefail
          # A failure leaves a red CI and still retains stdout evidence.
          # No tokens, GitHub writes, provider odds API, or Pages deploy.
          python ops/release_baseline.py \
            --output "$RUNNER_TEMP/s0-live-baseline.json" \
            > "$RUNNER_TEMP/s0-live-baseline.stdout.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"s0-live-baseline.json").read_text(encoding="utf-8"))
          assert r["schema"]=="football-king-s0-release-baseline-v1"
          assert r["status"]=="BASELINE_CAPTURED"
          assert r["s0_public_snapshot_captured"] is True
          assert r["ready_for_release_b"] is False
          assert r["independent_reviewer_approved"] is False
          assert r["verified_positive_ev"] is False
          assert r["permission_to_trade"] is False
          assert r["production_recommendations"]=="DISABLED"
          assert r["main"]["branch_protection_independently_enforced"] is False
          assert r["qualification"]["authenticated_samples_independently_checked_here"] is False
          print("S0_LIVE_BASELINE_CAPTURED_RESEARCH_ONLY")
          print("main_sha:",r["main"]["sha"])
          print("main_protected_flag:",r["main"]["protected_flag"])
          print("public_status_timestamp:",r["website"]["checked_utc"])
          print("site_age_hours:",r["website"]["snapshot_age_hours"])
          print("site_fresh_under_ten_hours:",r["website"]["fresh_under_ten_hours"])
          print("open_pr_count:",r["pull_requests"]["count"])
          print("public_fixtures:",r["website"]["public_matches"])
          print("preliminary_eligible_not_authenticated:",r["website"]["initial_prematch_eligible"])
          print("authenticated_forward_samples_claimed_by_site:",
                r["qualification"]["website_claimed_authenticated_forward_samples"])
          PY
      - name: Retain live public receipt and failure stdout without mutating main
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s0-live-public-baseline-receipt
          path: |
            ${{ runner.temp }}/s0-live-baseline.json
            ${{ runner.temp }}/s0-live-baseline.stdout.json
          if-no-files-found: warn
          retention-days: 14
