name: Deep handicap research diagnostics
on:
  pull_request:
    paths:
      - 'ops/deep_handicap_diagnostics.py'
      - 'ops/deep_handicap_joint_score.py'
      - 'ops/deep_handicap_live_state.py'
      - 'ops/tests/test_deep_handicap_live_state.py'
      - 'ops/live_score_identity_guard.py'
      - 'ops/tests/test_deep_handicap_joint_score.py'
      - 'ops/asian_ev_research.py'
      - 'ops/deep_handicap_private_capture.py'
      - 'ops/tests/test_deep_handicap_private_capture.py'
      - 'ops/asian_handicap_research.py'
      - 'ops/tests/test_deep_handicap_diagnostics.py'
      - '.github/workflows/deep-handicap-diagnostics.yml'
permissions:
  contents: read
jobs:
  deep-handicap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m compileall -q ops
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_diagnostics.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_joint_score.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_live_state.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_deep_handicap_private_capture.py' -v
      - run: python -m unittest discover -s ops/tests -p 'test_asian_handicap_research.py' -v
