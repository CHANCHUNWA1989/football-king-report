name: Daily four-model shadow research
on:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * *'
permissions:
  contents: read
jobs:
  shadow-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run safety tests
        run: PYTHONPATH=ops python -m unittest ops.tests.test_shadow_four_model_audit ops.tests.test_shadow_verified_adapter ops.tests.test_shadow_daily_report ops.tests.test_shadow_raw_source_collector ops.tests.test_shadow_raw_ft_parser ops.tests.test_shadow_ft_correlator ops.tests.test_shadow_source_pipeline -q
      - name: Archive raw public Bundesliga source responses (unverified)
        shell: bash
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          if [ "$MONTH" -lt 7 ]; then YEAR=$((YEAR - 1)); fi
          python ops/shadow_raw_source_collector.py --year "$YEAR" --output-dir public/shadow/raw_sources
      - name: Validate downloaded source manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/shadow/raw_sources/manifest.json').read_text())
          print('Raw source status:', [(s['provider'],s['status'],s.get('error_type')) for s in m['sources']])
          assert m['status']=='HOLD' and m['production_recommendations']=='DISABLED'
          PY
      - name: Parse source FT candidates with raw hash validation
        run: python ops/shadow_raw_ft_parser.py --raw-dir public/shadow/raw_sources --output public/shadow/raw_ft_candidates.json
      - name: Correlate Bundesliga FT candidates without certifying
        run: python ops/shadow_ft_correlator.py --input public/shadow/raw_ft_candidates.json --output public/shadow/ft_correlations.json
      - name: Summarize FT source matching and conflicts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('public/shadow/ft_correlations.json').read_text())
          print('FT reconciliation:',p['status'],'agreements:',len(p['agreements']),'conflicts:',len(p['conflicts']),'ambiguous:',p['ambiguous'])
          assert p['independently_verified'] is False
          PY
      - name: Build fail-closed report from verified inputs if present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/shadow
          if [ -s shadow/independent_ft_observations.json ]; then
            PYTHONPATH=ops python ops/shadow_archive_bridge.py --archives research_pairs --output public/shadow/sealed_from_archives.json
            PYTHONPATH=ops python ops/shadow_daily_report.py --sealed public/shadow/sealed_from_archives.json --results shadow/independent_ft_observations.json --output public/shadow/four_model_daily.json
          else
            printf '{"schema":"football-king-four-model-daily-shadow-1","status":"HOLD","reason":"MISSING_VERIFIED_INPUT_FILES","valid_fixtures":0,"target":1000,"remaining":1000,"production_recommendations":"DISABLED","models":{}}\n' > public/shadow/four_model_daily.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('public/shadow/four_model_daily.json').read_text())
          assert data['production_recommendations']=='DISABLED'
          assert data['status'] in ('HOLD','SHADOW_ONLY')
          print('Research status:',data['status'],'verified fixtures:',data['valid_fixtures'])
          PY
      - name: Upload iPhone-readable research JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-model-shadow-daily
          path: |
            public/shadow/four_model_daily.json
            public/shadow/raw_sources/
            public/shadow/raw_ft_candidates.json
            public/shadow/ft_correlations.json
          retention-days: 30
