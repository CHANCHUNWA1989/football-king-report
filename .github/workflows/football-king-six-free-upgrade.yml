name: 足球王者｜六大聯賽免費盤口與七項數據驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-six-free-upgrade.yml'
  schedule:
    # HK 11:27, one daily bounded free research sweep.
    - cron: '27 3 * * *'

concurrency:
  group: football-king-six-free-upgrade
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout code and cached sanitized research (no secret)
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full offline validation before external access
        run: python -m unittest discover -s ops/tests -q
      - name: Query only free PropLine main prematch markets (max 7 calls)
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          set -euo pipefail
          python ops/six_league_free_upgrade.py --mode collect --output six-free.json
          python ops/six_league_free_upgrade.py --mode validate --input six-free.json
      - name: Validate seven research safety gates (never authorize picks)
        run: |
          set -euo pipefail
          python ops/six_league_free_upgrade.py --mode audit --input six-free.json --output seven-gates.json
          python - <<'PY'
          import json
          o=json.load(open('seven-gates.json'))
          assert o['schema']=='football-king-seven-evidence-gates-v1'
          assert o['total']==7 and len(o['checks'])==7
          assert o['production_recommendations']=='DISABLED'
          assert o['can_promote_model'] is False and o['can_recommend_bets'] is False
          print({k:o[k] for k in ('status','passed','partial','held')})
          PY
      - name: Upload only counts and gate assessment, no prices or bookmaker names
        uses: actions/upload-artifact@v4
        with:
          name: football-king-six-league-free-quality
          path: |
            six-free.json
            seven-gates.json
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout non-secret independent archiver
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download sanitized report
        uses: actions/download-artifact@v4
        with:
          name: football-king-six-league-free-quality
          path: quality
      - name: Save independent seven-item checklist and six-league coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ops/six_league_free_upgrade.py --mode validate --input quality/six-free.json
          python - <<'PY'
          import json
          a=json.load(open('quality/six-free.json'))
          b=json.load(open('quality/seven-gates.json'))
          assert b['schema']=='football-king-seven-evidence-gates-v1'
          assert b['captured_utc']==a['captured_utc']
          assert b['total']==7 and len(b['checks'])==7
          assert b['passed']+b['partial']+b['held']==7
          assert b['production_recommendations']=='DISABLED'
          assert not b['can_promote_model'] and not b['can_recommend_bets']
          assert all(x['state'] in ('PASS','PARTIAL','HOLD') for x in b['checks'])
          PY
          for filename in six-free seven-gates; do
            if [ "$filename" = six-free ]; then
              destination=sources/six_league_free_latest.json
            else
              destination=sources/seven_quality_gates_latest.json
            fi
            complete=false
            for attempt in 1 2 3 4 5; do
              sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$destination" --jq '.sha' 2>/dev/null || true)"
              if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then sha=""; fi
              if [ -n "$sha" ]; then
                gh api "repos/$GITHUB_REPOSITORY/contents/$destination" --jq '.content' |
                  tr -d '\n' | base64 --decode > "$RUNNER_TEMP/previous.json"
                if ! python - "$RUNNER_TEMP/previous.json" "quality/$filename.json" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          def clock(v):
              d=datetime.fromisoformat(v.replace('Z','+00:00'))
              if d.tzinfo is None: raise ValueError('NAIVE')
              return d.astimezone(timezone.utc)
          old=json.load(open(sys.argv[1]))
          new=json.load(open(sys.argv[2]))
          assert old.get('schema')==new.get('schema')
          assert clock(new['captured_utc']) > clock(old['captured_utc']), 'OLDER_SNAPSHOT'
          PY
                then
                  echo "Retaining newer pre-existing status: $destination"
                  complete=true; break
                fi
              fi
              payload="$(base64 -w0 "quality/$filename.json")"
              if [ -n "$sha" ]; then
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$destination" \
                     -f sha="$sha" -f content="$payload" \
                     -f message="Refresh independent six-league research status only" >/dev/null 2>&1; then
                  complete=true; break
                fi
              else
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$destination" \
                     -f content="$payload" \
                     -f message="Store sanitized six-league quality gate audit" >/dev/null 2>&1; then
                  complete=true; break
                fi
              fi
              sleep "$((attempt*2))"
            done
            if [ "$complete" != true ]; then
              echo "SIX_LEAGUE_QUALITY_ARCHIVE_FAILED: $destination" >&2
              exit 1
            fi
            echo "Archived: $destination"
          done
