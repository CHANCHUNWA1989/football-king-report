name: 足球王者｜全球大小聯賽免費 OpenFootball + OpenLigaDB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-wide-free.yml'
  schedule:
    # 香港時間 07:33，一日一次；不會扣 The Odds API 積分
    # 免費公共領域檔案與開放德國聯賽接口獨立於原有 Odds/Shadow 運作
    - cron: '33 23 * * *'

concurrency:
  group: football-king-global-free-league-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ALL fail-closed tests without any vendor secret
        run: python -m unittest discover -s ops/tests -q
      # OpenFootball country feeds can differ in score field shape across seasons.
      - name: Collect no-key international league datasets and German smaller-league API
        shell: bash
        run: |
          set -euo pipefail
          python ops/wide_sources.py --output wide-free.json
          python ops/wide_source_guard.py --incoming wide-free.json
      - uses: actions/upload-artifact@v4
        with:
          name: football-king-global-free-league-audit
          path: wide-free.json
          retention-days: 7
          if-no-files-found: error

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: football-king-global-free-league-audit
          path: wide-audit
      - name: Verify and archive sanitized global coverage with retries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python ops/wide_source_guard.py --incoming wide-audit/wide-free.json
          gzip -n -c wide-audit/wide-free.json > "$RUNNER_TEMP/wide-free.json.gz"
          day="$(date -u +%Y/%m/%d)"
          history="sources/wide/history/$day/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json.gz"
          for dest in "$history" "sources/wide_latest.json"; do
            complete=false
            for attempt in 1 2 3 4 5; do
              sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest" --jq '.sha' 2>/dev/null || true)"
              if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then sha=""; fi
              if [[ "$dest" == "sources/wide_latest.json" ]] && [ -n "$sha" ]; then
                gh api "repos/$GITHUB_REPOSITORY/contents/$dest" --jq '.content' |
                  tr -d '\n' | base64 --decode > "$RUNNER_TEMP/old-wide.json"
                update="$(python ops/wide_source_guard.py \
                  --incoming wide-audit/wide-free.json --previous "$RUNNER_TEMP/old-wide.json" |
                  python -c 'import json,sys; print("yes" if json.load(sys.stdin)["safe_to_publish"] else "no")')"
                if [ "$update" = no ]; then
                  echo "Keep existing newer global league snapshot"
                  complete=true
                  break
                fi
              fi
              if [[ "$dest" == *.gz ]]; then
                b64="$(base64 -w0 "$RUNNER_TEMP/wide-free.json.gz")"
              else
                b64="$(base64 -w0 wide-audit/wide-free.json)"
              fi
              if [ -n "$sha" ]; then
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                  -f sha="$sha" -f content="$b64" \
                  -f message="Archive free international league coverage; research only" >/dev/null 2>&1; then
                  complete=true
                  break
                fi
              else
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                  -f content="$b64" \
                  -f message="Create no-key global league source audit" >/dev/null 2>&1; then
                  complete=true
                  break
                fi
              fi
              sleep "$((2*attempt))"
            done
            if [ "$complete" != true ]; then
              echo "FAILED_GLOBAL_LEAGUE_ARCHIVE $dest" >&2
              exit 1
            fi
            echo "Archived free international leagues: $dest"
          done

  notify_failure:
    needs: [collect, archive]
    if: ${{ always() && (needs.collect.result == 'failure' || needs.archive.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Warn independently without stopping the existing six leagues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="足球王者：全球免費大小聯賽備用同步異常"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：全球免費大小聯賽備用同步異常") | .number' | head -n 1)"
          body="OpenFootball/OpenLigaDB備用資料未完成；原有模型及市場不受影響。https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  clear_failure:
    needs: [collect, archive]
    if: ${{ needs.collect.result == 'success' && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close recovered global-data incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title=="足球王者：全球免費大小聯賽備用同步異常") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "全球大小聯賽來源同步已恢復；研究資料不構成可下注建議。"
          fi
