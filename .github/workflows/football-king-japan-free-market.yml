name: Football King Japan Free Odds Source Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/japan_free_market.py'
      - 'ops/japan_free_market_guard.py'
      - 'ops/tests/test_japan_free_market.py'
      - 'ops/tests/test_japan_free_market_guard.py'
      - '.github/workflows/football-king-japan-free-market.yml'
  schedule:
    # 09:35 HK / 10:35 Japan, once daily to protect existing Odds API
    # 500/month credits and leave the original six leagues untouched.
    - cron: '35 1 * * *'

concurrency:
  group: football-king-japan-free-market-sources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run all source adapters and publication guards against offline synthetic data
        run: |
          python -m unittest discover -s ops/tests -p 'test_japan_free_market.py' -q
          python -m unittest discover -s ops/tests -p 'test_japan_free_market_guard.py' -q
          python -m compileall -q ops/japan_free_market.py ops/japan_free_market_guard.py
      - name: Fetch only permitted J1 free prematch source metadata
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          # PropLine: 1 J1 bulk request. TheRundown: at most 2 J1 requests.
          # Odds API: up to 1 sports catalogue + 1 J1 market request;
          # stop when monthly free quota threatens six core leagues.
          # No raw odds, keys, identifiable bookmaker quotes or sportsbook
          # URL are ever persisted or printed.
          python ops/japan_free_market.py --output "$RUNNER_TEMP/japan-free.json"
          test -s "$RUNNER_TEMP/japan-free.json"
      - name: Independently reject unsafe metadata and betting claims
        run: |
          python ops/japan_free_market_guard.py --input "$RUNNER_TEMP/japan-free.json"
          python - "$RUNNER_TEMP/japan-free.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["raw_bookmaker_prices_or_names_redistributed"] is False
          assert d["production_recommendations"]=="DISABLED"
          assert d["bet_recommendation_count"]==0
          assert d["free_tier_closing_lines_available"] is False
          assert d["realtime_inplay_quotes_confirmed"] is False
          PY
      - name: Transfer only sanitized no-prices J1 provider metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-japan-free-market-status
          path: ${{ runner.temp }}/japan-free.json
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: football-king-japan-free-market-status
          path: validated
      - name: Safe, monotonically newer status metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ops/japan_free_market_guard.py --input validated/japan-free.json
          for attempt in 1 2 3 4 5; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/market/japan_free_status.json" --jq '.sha' 2>/dev/null || true)"
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/market/japan_free_status.json" \
                --jq '.content' | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/previous.json"
              python ops/japan_free_market_guard.py --input validated/japan-free.json \
                --previous "$RUNNER_TEMP/previous.json" --decision "$RUNNER_TEMP/decision.json"
            else
              sha=""
              python ops/japan_free_market_guard.py --input validated/japan-free.json \
                --decision "$RUNNER_TEMP/decision.json"
            fi
            approve="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["replace"])' "$RUNNER_TEMP/decision.json")"
            if [[ "$approve" != True ]]; then
              echo "Preserved newer J1 metadata"; exit 0
            fi
            encoded="$(base64 -w0 validated/japan-free.json)"
            if [ -n "$sha" ]; then
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/market/japan_free_status.json" \
                  -f message="Update J1 free-API coverage audit, no raw odds or betting tips" \
                  -f sha="$sha" -f content="$encoded" >/dev/null 2>&1; then
                echo "Published sanitized J1 free API research"; exit 0
              fi
            else
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/market/japan_free_status.json" \
                  -f message="Publish J1 free API audit, no bookmaker raw quotes" \
                  -f content="$encoded" >/dev/null 2>&1; then
                echo "Published sanitized J1 free API research"; exit 0
              fi
            fi
            sleep "$((attempt*2))"
          done
          echo "J1_FREE_METADATA_COMMIT_RETRY_EXHAUSTED" >&2
          exit 1
