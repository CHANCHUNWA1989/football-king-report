name: V9 offline model competition acceptance
on:
  pull_request:
    paths:
      - 'ops/v9_offline_intake_model_bridge.py'
      - 'ops/tests/test_v9_offline_model_stress.py'
      - 'ops/v2[5-8]_*.py'
      - 'ops/tests/test_v2[5-8]_*.py'
      - 'ops/v9_league_weights.py'
      - '.github/workflows/v9-offline-model-competition.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline synthetic stress and challenger contract tests
        run: |
          python -m unittest discover -s ops/tests -p test_v9_offline_model_stress.py -v
          for version in 25 26 27 28; do
            python -m unittest discover -s ops/tests -p "test_v${version}_*.py" -v
          done
