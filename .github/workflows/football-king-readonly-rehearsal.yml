name: Football King read-only live research rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/football-king-readonly-rehearsal.yml'
      - 'ops/schedule_enrichment.py'
      - 'ops/shadow_forecast.py'
      - 'ops/team_identity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-king-readonly-rehearsal
  cancel-in-progress: true

jobs:
  rehearsal:
    # Never grant permissions, secrets or network collection to fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and unpack original public source gateway
        run: |
          set -euo pipefail
          echo "12e46fb527c012598f76eadcae8b04c41bf20b9345920dd59cd3a2cd40af7c8e  packages/football_king_v4_1_iphone_verified.zip" | sha256sum -c -
          mkdir -p app _unpacked
          unzip -q packages/football_king_v4_1_iphone_verified.zip -d _unpacked
          cp -a _unpacked/football_king_v4_1/. app/
          mkdir -p "$RUNNER_TEMP/rehearsal"
      - name: Run existing public fixture gateway once and compare models
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/rehearsal"
          python ops/shadow_forecast.py --output "$d/shadow.json" --finished-output "$d/finished.json"
          python ops/opponent_forward_capture.py --shadow "$d/shadow.json" --finished "$d/finished.json" --output "$d/capture.json"
          python ops/unified_shadow_integration.py --shadow "$d/shadow.json" --collection market/collection_status.json --output "$d/unified.json"
          python ops/market_pair.py --site "$d" --market market/latest.json
          python ops/unified_market_context.py --unified "$d/unified.json" --pairs "$d/market_comparison.json" --market market/latest.json --collection market/collection_status.json --bsd sources/bsd_status_latest.json --tipsme sources/hkjc_tipsme_free_latest.json --output "$d/market_context.json"
          python ops/model_dixon_coles_forward.py --site "$d"
          python ops/opponent_forward_capture.py --shadow "$d/shadow.json" --capture "$d/capture.json" --output "$d/archive_shadow.json"
          python ops/opponent_forward_audit.py --archives shadow --source-history sources/history --sources sources/latest.json --german sources/live_germany_latest.json --output "$d/audit.json"
      - name: Check safety and expose aggregate counts only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"rehearsal"
          def read(name):
              return json.loads((d/(name+".json")).read_text())
          s,c,u,m,a=map(read,("shadow","capture","unified","market_context","audit"))
          archived=read("archive_shadow")
          for obj in (s,c,u,m,a,archived):
              assert obj["production_recommendations"]=="DISABLED"
          assert archived["opponent_adjusted_forward_challenger"]==c
          assert archived["predictions"]==s["predictions"]
          assert c["automatic_model_promotion"] is False
          for obj in (u,m,a):
              assert obj["status"]=="HOLD"
              assert obj["positive_ev_verified"] is False
              assert obj["recommendation_count"]==0
          assert a["authenticated_forward_samples"]==0
          assert m["executable_market_quotes"] is False
          assert m["new_api_calls"]==0
          counts={"shadow_forecasts":s["predictions_count"],
                  "shadow_by_league":{r["league"]:r["predictions"] for r in s["sources"]},
                  "secondary_only_schedule_repairs":sum(r.get("secondary_only_fixture_utc_agreements",0) for r in s["sources"]),
                  "opponent_captures":c["predictions_count"],
                  "unified_rows":len(u["rows"]),
                  "market_pairs":len(m["pairs"]),
                  "two_publisher_archive_scores":a["two_publisher_exact_score_count"],
                  "authenticated_forward_samples":0,
                  "status":"RESEARCH_EXECUTED" if c["predictions_count"] and u["rows"] else "HOLD_NO_ELIGIBLE_INPUT",
                  "production_recommendations":"DISABLED",
                  "deployment_performed":False,
                  "archive_written_to_main":False,
                  "attestation_performed":False}
          print("READONLY_LIVE_REHEARSAL="+json.dumps(counts,sort_keys=True))
          PY
      - name: Preserve actual research capture and a run-scoped digest manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"rehearsal"
          target=Path(os.environ["RUNNER_TEMP"])/"research-evidence"
          target.mkdir()
          raw=(d/"archive_shadow.json").read_bytes()
          assert 0<len(raw)<=8_000_000
          doc=json.loads(raw)
          cap=doc["opponent_adjusted_forward_challenger"]
          assert doc["production_recommendations"]=="DISABLED"
          assert cap["production_recommendations"]=="DISABLED"
          assert cap["independently_verified"] is False
          assert cap["recommendation_count"]==0
          stamp=datetime.now(timezone.utc)
          leads=[(datetime.fromisoformat(r["kickoff_utc"])-stamp).total_seconds()
                 for r in cap["predictions"]]
          # Persist exact captured bytes, not reconstructed forecasts. If the
          # packaging clock is already late, retain diagnostic bytes but never
          # imply the package was preserved before kickoff.
          (target/"shadow.json").write_bytes(raw)
          manifest={"schema":"football-king-readonly-research-evidence-v1",
                    "run_id":os.environ["GITHUB_RUN_ID"],
                    "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                    "checkout_commit":__import__("subprocess").check_output(
                        ["git","rev-parse","HEAD"],text=True).strip(),
                    "workflow_sha":os.environ["GITHUB_WORKFLOW_SHA"],
                    "packaged_utc":stamp.isoformat(),
                    "shadow_sha256":hashlib.sha256(raw).hexdigest(),
                    "shadow_bytes":len(raw),
                    "candidate_count":len(leads),
                    "candidate_leagues":sorted({r["league"] for r in cap["predictions"]}),
                    "minimum_recorded_kickoff_lead_seconds":min(leads) if leads else None,
                    "all_candidates_more_than_10min_at_packaging":bool(leads) and min(leads)>600,
                    "artifact_upload_time_independently_verified":False,
                    "attestation_performed":False,"authenticated_forward_samples":0,
                    "production_recommendations":"DISABLED"}
          (target/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("READONLY_RESEARCH_EVIDENCE="+json.dumps(manifest,sort_keys=True))
          PY
      - name: Retain only public research forecast bytes and manifest
        id: research_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-readonly-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/research-evidence/shadow.json
            ${{ runner.temp }}/research-evidence/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact identity for later retrieval
        env:
          EVIDENCE_ID: ${{ steps.research_evidence.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.research_evidence.outputs.artifact-digest }}
        run: |
          test -n "$EVIDENCE_ID"
          test -n "$EVIDENCE_DIGEST"
          printf 'READONLY_RESEARCH_ARTIFACT_ID=%s\nREADONLY_RESEARCH_ARTIFACT_DIGEST=%s\n' "$EVIDENCE_ID" "$EVIDENCE_DIGEST"

  archived-evidence-audit:
    # Read an existing exact run artifact; never recreate it or write to main.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve pinned research artifact and verify GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/pinned-research-audit"
          mkdir -p "$d"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249069622" > "$d/metadata.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ["RUNNER_TEMP"])/"pinned-research-audit/metadata.json").read_text())
          assert m["id"]==15249069622
          assert m["workflow_run"]["id"]==46111833696
          assert m["workflow_run"]["head_sha"]=="bf51e6b21b13343bcf010174841bd2fa466f8ce9"
          assert m["name"]=="football-king-readonly-research-46111833696-1"
          assert m["digest"]=="sha256:0a276b1cde934493cd0028a58d643c1a80e216d3c41348293948c348a2ea6918"
          assert m["expired"] is False
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249069622/zip" > "$d/research.zip"
          python ops/readonly_artifact_verify.py --artifact "$d/research.zip" --sha256 0a276b1cde934493cd0028a58d643c1a80e216d3c41348293948c348a2ea6918 --run-id 46111833696 --attempt 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15252896977" > "$d/metadata-six.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ["RUNNER_TEMP"])/"pinned-research-audit/metadata-six.json").read_text())
          assert m["id"]==15252896977
          assert m["workflow_run"]["id"]==46118581941
          assert m["workflow_run"]["head_sha"]=="ac10013aaa4c0a22f7e63e2335be4b283dbdf365"
          assert m["name"]=="football-king-readonly-research-46118581941-1"
          assert m["digest"]=="sha256:77c225d75d10e7eac5555001e6e1211a9aedb205c8f97071ce31733ccb61e291"
          assert m["expired"] is False
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15252896977/zip" > "$d/research-six.zip"
          python ops/readonly_artifact_verify.py --artifact "$d/research-six.zip" --sha256 77c225d75d10e7eac5555001e6e1211a9aedb205c8f97071ce31733ccb61e291 --run-id 46118581941 --attempt 1
      - name: Refresh existing German community source only after a captured kickoff plus two hours
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/pinned-research-audit"
          python - <<'PY'
          import json, os, sys
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          sys.path.insert(0,"ops")
          from readonly_artifact_verify import verify_artifact
          from opponent_forward_capture import TOP_KEY, utc
          d=Path(os.environ["RUNNER_TEMP"])/"pinned-research-audit"
          doc,_=verify_artifact(d/"research.zip","0a276b1cde934493cd0028a58d643c1a80e216d3c41348293948c348a2ea6918","46111833696","1")
          now=datetime.now(timezone.utc)
          eligible=sum(r["league"]=="bundesliga" and
                       timedelta(hours=2)<=now-utc(r["kickoff_utc"])<=timedelta(days=3)
                       for r in doc[TOP_KEY]["predictions"])
          (d/"refresh-needed").write_text("yes" if eligible else "no")
          print("GERMAN_POSTMATCH_REFRESH_ELIGIBLE="+str(eligible))
          PY
          if [ "$(cat "$d/refresh-needed")" = yes ]; then
            python ops/live_germany.py --output "$d/german.json"
            python ops/live_germany_guard.py --input "$d/german.json"
          else
            cp sources/live_germany_latest.json "$d/german.json"
          fi
      - name: Score only already eligible exact later result observations
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/pinned-research-audit"
          python ops/opponent_forward_audit.py --archives shadow --source-history sources/history --sources sources/latest.json --german "$d/german.json" --research-artifact "$d/research.zip" --artifact-sha256 0a276b1cde934493cd0028a58d643c1a80e216d3c41348293948c348a2ea6918 --artifact-run-id 46111833696 --artifact-attempt 1 --pinned-only --additional-research-artifact "$d/research-six.zip" 77c225d75d10e7eac5555001e6e1211a9aedb205c8f97071ce31733ccb61e291 46118581941 1 --output "$d/audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pinned-research-audit/audit.json").read_text())
          a=r["readonly_artifact_verification"]
          assert a["candidate_count"]==31
          assert a["status"]=="RESEARCH_BYTES_VERIFIED"
          both=r["readonly_artifact_verifications"]
          assert [x["candidate_count"] for x in both]==[31,49]
          assert all(x["status"]=="RESEARCH_BYTES_VERIFIED" for x in both)
          assert r["readonly_artifact_unique_fixture_count"]==49
          assert r["forecast_scope"]=="PINNED_ARTIFACTS_ONLY"
          cov=r["three_model_forecast_coverage"]
          assert cov["unique_fixtures"]==49
          assert cov["three_model_ready"]+cov["not_ready"]==49
          assert cov["uses_result_labels"] is False
          assert r["status"]=="HOLD"
          assert r["production_recommendations"]=="DISABLED"
          assert r["authenticated_forward_samples"]==0
          assert r["recommendation_count"]==0
          assert r["positive_ev_verified"] is False
          print("PINNED_RESEARCH_AUDIT="+json.dumps({
              "verified_artifact_rows":a["candidate_count"],
              "verified_six_league_rows":both[1]["candidate_count"],
              "unique_pinned_fixtures":r["readonly_artifact_unique_fixture_count"],
              "two_publisher_exact_score_count":r["two_publisher_exact_score_count"],
              "three_model_forecast_coverage":cov,
              "three_model_settled_count":r["three_model_comparison"]["n"],
              "authenticated_forward_samples":0,
              "production_recommendations":"DISABLED",
              "rejected":r["rejected"]},sort_keys=True))
          PY

      - name: Preserve pinned cohort readiness and settlement audit evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from collections import Counter,defaultdict
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          sys.path.insert(0,"ops")
          from readonly_artifact_verify import verify_artifact
          from opponent_forward_capture import TOP_KEY,utc
          from team_identity import team_id
          from source_publish_guard import verify
          d=Path(os.environ["RUNNER_TEMP"])/"pinned-research-audit"
          target=d/"evidence"
          target.mkdir()
          source=Path("sources/latest.json").read_bytes()
          snapshot=json.loads(source)
          now=datetime.now(timezone.utc)
          verify(snapshot,now=now)
          pinned,_=verify_artifact(d/"research-six.zip","77c225d75d10e7eac5555001e6e1211a9aedb205c8f97071ce31733ccb61e291","46118581941","1")
          def key(r):
              return (r["league"],team_id(r["league"],r["home"]),team_id(r["league"],r["away"]),utc(r["kickoff_utc"]))
          active={p["provider"] for p in snapshot["providers"] if p["configured"] is True and p["status"] in ("PARTIAL","PARTIAL_COVERAGE")}
          votes=defaultdict(set)
          for row in snapshot["sampled_fixtures"]:
              if row["provider"] in active:
                  votes[key(row)].add(row["provider"])
          by_league=defaultdict(Counter)
          eligible=0
          rows=pinned[TOP_KEY]["predictions"]
          assert len(rows)==49 and len({key(r) for r in rows})==49
          for r in rows:
              k=key(r)
              n=len(votes[k])
              by_league[r["league"]]["two_or_more" if n>=2 else "one" if n==1 else "none"]+=1
              eligible+=int(now>=k[3]+timedelta(hours=2))
          raw=(d/"audit.json").read_bytes()
          audit=json.loads(raw)
          assert audit["status"]=="HOLD" and audit["production_recommendations"]=="DISABLED"
          assert audit["authenticated_forward_samples"]==0 and audit["positive_ev_verified"] is False
          assert audit["readonly_artifact_unique_fixture_count"]==49
          def digest(b): return hashlib.sha256(b).hexdigest()
          manifest={"schema":"football-king-pinned-cohort-audit-evidence-v1",
                    "run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                    "checkout_sha":os.environ["GITHUB_SHA"],"created_utc":now.isoformat(),
                    "source_collected_utc":snapshot["collected_utc"],"source_sha256":digest(source),
                    "german_snapshot_sha256":digest((d/"german.json").read_bytes()),
                    "original_forecast_zip_sha256":digest((d/"research.zip").read_bytes()),
                    "six_league_forecast_zip_sha256":digest((d/"research-six.zip").read_bytes()),
                    "audit_sha256":digest(raw),"unique_frozen_fixtures":49,
                    "schedule_coverage_by_league":{k:dict(v) for k,v in sorted(by_league.items())},
                    "elapsed_two_hour_candidates":eligible,
                    "two_publisher_exact_score_count":audit["two_publisher_exact_score_count"],
                    "authenticated_forward_samples":0,"production_recommendations":"DISABLED",
                    "forecast_scope":audit["forecast_scope"],
                    "three_model_forecast_coverage":audit["three_model_forecast_coverage"],
                    "three_model_settled_count":audit["three_model_comparison"]["n"],
                    "scope":"CURRENT_SNAPSHOT_COVERAGE_NOT_RESULT_AUTHENTICATION"}
          (target/"audit.json").write_bytes(raw)
          (target/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("PINNED_COHORT_EVIDENCE="+json.dumps(manifest,sort_keys=True))
          PY
      - name: Upload immutable run-scoped research audit
        id: pinned_audit_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-king-pinned-cohort-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pinned-research-audit/evidence/audit.json
            ${{ runner.temp }}/pinned-research-audit/evidence/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify research audit artifact identity
        env:
          EVIDENCE_ID: ${{ steps.pinned_audit_artifact.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.pinned_audit_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_ID"
          test -n "$EVIDENCE_DIGEST"
          printf 'PINNED_COHORT_AUDIT_ARTIFACT_ID=%s\n' "$EVIDENCE_ID"
          printf 'PINNED_COHORT_AUDIT_ARTIFACT_DIGEST=%s\n' "$EVIDENCE_DIGEST"
