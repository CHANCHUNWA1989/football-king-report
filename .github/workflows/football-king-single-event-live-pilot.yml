name: Football King P0 private durable result evidence pilot

on:
  push:
    branches:
      - fix/sportsdb-single-result-raw-capture-20261108
    paths:
      - .github/workflows/football-king-single-event-live-pilot.yml

# One isolated two-event P0 run on this experimental branch only.
# No schedule, no betting, no release, no publicly uploaded raw payload.
permissions:
  contents: read

concurrency:
  group: football-king-private-result-pilot
  cancel-in-progress: false

jobs:
  live-private-archive:
    if: github.repository == 'CHANCHUNWA1989/football-king-report'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact experimental source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run fail-closed parser, private storage and replay tests
        run: |
          python -m compileall -q ops
          python -m unittest ops.tests.test_sportsdb_event_capture ops.tests.test_sportsdb_result_private_archive -q
      - name: Refuse provider GET unless pre-existing private target is configured
        env:
          PRIVATE_ARCHIVE_REPOSITORY: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY }}
          PRIVATE_ARCHIVE_REPOSITORY_ID: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY_ID }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from ops.private_response_archive import configuration
          configuration(required=True)
          print("PRIVATE_ARCHIVE_CONFIG_PRESENT; target privacy will be independently rechecked before PUT")
          PY
      - name: One exact official API GET per allowed match into private temporary directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/football-sportsdb-pilot-$GITHUB_RUN_ID"
          test ! -e "$root"
          mkdir -m 700 "$root"
          for id in 2508371 2508372; do
            python -m ops.sportsdb_event_capture \
              --event-id "$id" \
              --private-output-dir "$root/$id"
            PRIVATE_CAPTURE="$root/$id" EVENT_ID="$id" python - <<'PY'
          import json, os
          from ops.sportsdb_event_capture import verify_capture
          result = verify_capture(os.environ["PRIVATE_CAPTURE"],
                                  event_id=os.environ["EVENT_ID"], require_live=True)
          assert result["raw_integrity_replayed"] is True
          assert result["independently_verified"] is False
          print(json.dumps({
              "status": "HOLD", "provider_event_id": result["provider_event_id"],
              "raw_sha256": result["raw_sha256"], "raw_bytes": result["raw_bytes"],
              "local_original_readback": True,
              "independently_verified": False,
              "production_recommendations": "DISABLED",
          }, sort_keys=True))
          PY
          done
      - name: Private create-only archive and pinned remote readback for both raw responses
        shell: bash
        env:
          PRIVATE_ARCHIVE_REPOSITORY: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY }}
          PRIVATE_ARCHIVE_REPOSITORY_ID: ${{ secrets.PRIVATE_ARCHIVE_REPOSITORY_ID }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          for id in 2508371 2508372; do
            python -m ops.sportsdb_result_private_archive \
              --private-dir "$RUNNER_TEMP/football-sportsdb-pilot-$GITHUB_RUN_ID/$id" \
              --event-id "$id" \
              --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          done
      - name: Delete temporary original source bytes (even on failure)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/football-sportsdb-pilot-$GITHUB_RUN_ID"
          echo "PRIVATE_TEMP_CLEANED; no public artifact was uploaded"
