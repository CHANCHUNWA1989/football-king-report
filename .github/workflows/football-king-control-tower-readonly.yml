name: Football King Control Tower (read-only evidence)

on:
  schedule:
    # Best effort; schedule only activates after merge to default branch.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/control_tower_monitor.py'
      - 'ops/tests/test_control_tower_monitor.py'
      - '.github/workflows/football-king-control-tower-readonly.yml'
      - 'docs/CONTROL_TOWER_READONLY_20261103.md'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: control-tower-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout read-only research code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline fail-closed tests
        run: python -m unittest discover -s ops/tests -p test_control_tower_monitor.py -v
      - name: Produce public-only observed evidence artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ops/control_tower_monitor.py --market market/latest.json --output "$RUNNER_TEMP/control-tower-public.json"
      - name: Retain artifact, do not deploy or write to main
        uses: actions/upload-artifact@v4
        with:
          name: control-tower-public-evidence
          path: ${{ runner.temp }}/control-tower-public.json
          if-no-files-found: error
          retention-days: 7
