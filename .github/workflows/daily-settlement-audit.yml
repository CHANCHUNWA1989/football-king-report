name: Daily settled evidence integrity audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    paths:
      - 'evidence/settled.json'
      - 'research_quality/settlement_audit.py'
      - 'research_quality/market_baseline_audit.py'
      - 'research_quality/probability_diagnostics.py'
      - 'tests/test_settlement_audit.py'
      - '.github/workflows/daily-settlement-audit.yml'
  push:
    paths:
      - 'evidence/settled.json'
      - 'research_quality/settlement_audit.py'
      - 'research_quality/market_baseline_audit.py'
      - 'research_quality/probability_diagnostics.py'
      - 'tests/test_settlement_audit.py'
      - '.github/workflows/daily-settlement-audit.yml'
permissions:
  contents: read
concurrency:
  group: daily-settlement-evidence-audit
  cancel-in-progress: false
jobs:
  research-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test audit safety invariants
        run: python -m unittest discover -s tests -p test_settlement_audit.py -v
      - name: Audit existing sealed settlement research only
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from research_quality.settlement_audit import audit
          result = audit('evidence/settled.json')
          assert result['status'] == 'RESEARCH_ONLY'
          assert result['production_recommendations'] == 'DISABLED'
          assert result['independently_verified'] is False
          assert result['total'] == result['accepted'] + result['rejected']
          Path('settlement_audit_report.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write('## Daily settlement evidence audit (research only)\n\n')
              out.write(f"Records: {result['total']}; accepted: {result['accepted']}; rejected: {result['rejected']}\n\n")
              out.write('Independent final-score verification: **NOT ATTESTED**. Production recommendations: **DISABLED / HOLD**.\n')
          print('SETTLEMENT_AUDIT', json.dumps(result, sort_keys=True))
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-settlement-evidence-audit
          path: settlement_audit_report.json
          retention-days: 14
