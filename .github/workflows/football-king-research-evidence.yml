name: 足球王者｜自動研究證據驗收
on:
  workflow_dispatch:
  schedule:
    - cron: '50 2 * * *'
  push:
    paths:
      - 'ops/run_research_pipeline.py'
      - 'ops/reconcile_shadow_results.py'
      - 'ops/research_input_audit.py'
      - 'ops/evidence_readiness_inventory.py'
      - 'ops/bridge_shadow_forecasts.py'
      - 'ops/shadow_archive_bridge.py'
      - 'ops/unified_evidence_manifest.py'
      - 'research_pairs/**'
      - 'research/inputs/**'
      - '.github/workflows/football-king-research-evidence.yml'

permissions:
  contents: read

concurrency:
  group: football-king-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      THE_ODDS_API_KEY: ''
      API_FOOTBALL_KEY: ''
      FOOTBALL_DATA_ORG_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent offline research regression
        run: |
          python -m unittest discover -s ops/tests -p 'test_research_input_audit.py' -v
          python -m unittest discover -s ops/tests -p 'test_reconcile_shadow_results.py' -v
          python -m unittest discover -s ops/tests -p 'test_run_research_pipeline.py' -v
          python -m unittest discover -s ops/tests -p 'test_evidence_readiness_inventory.py' -v
          python -m unittest discover -s ops/tests -p 'test_bridge_shadow_forecasts.py' -v
          python -m unittest discover -s ops/tests -p 'test_unified_evidence_manifest.py' -v
      - name: Export already sealed forward predictions from existing four-model archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/football-king-evidence"
          PYTHONPATH=ops python ops/shadow_archive_bridge.py --archives research_pairs --output "$RUNNER_TEMP/football-king-evidence/sealed_four_model_archive.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads((Path(os.environ['RUNNER_TEMP']) / 'football-king-evidence/sealed_four_model_archive.json').read_text(encoding='utf-8'))
          assert isinstance(rows, list)
          assert all(isinstance(x, dict) and x.get('production_recommendations') == 'DISABLED' for x in rows)
          print('Archived pre-match four-model research fixtures:', len(rows))
          print('These are NOT independently settled fixtures.')
          PY
      - name: Normalize archived model forecasts when present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/football-king-evidence"
          if [[ -s research/inputs/shadow_snapshot.json ]]; then
            python ops/bridge_shadow_forecasts.py --input research/inputs/shadow_snapshot.json --output "$RUNNER_TEMP/football-king-evidence/model_forecasts.json"
          fi
      - name: Produce research-only report from archived inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/football-king-evidence"
          forecast_input=""
          if [[ -s research/inputs/forecasts.json ]]; then
            forecast_input="research/inputs/forecasts.json"
          elif [[ -s "$RUNNER_TEMP/football-king-evidence/model_forecasts.json" ]]; then
            forecast_input="$RUNNER_TEMP/football-king-evidence/model_forecasts.json"
          fi
          if [[ -n "$forecast_input" && -s research/inputs/results.json ]]; then
            python ops/run_research_pipeline.py \
              --forecasts "$forecast_input" \
              --results research/inputs/results.json \
              --consensus market/latest.json \
              --summary market/private_summary_latest.json \
              --gates sources/seven_quality_gates_latest.json \
              --output-dir "$RUNNER_TEMP/football-king-evidence"
          else
            python - <<'PY'
          import json, os
          from pathlib import Path
          from sys import path
          path.insert(0, 'ops')
          from run_research_pipeline import run
          out = Path(os.environ['RUNNER_TEMP']) / 'football-king-evidence'
          model = out / 'model_forecasts.json'
          forecast_file = Path('research/inputs/forecasts.json')
          if forecast_file.is_file() and forecast_file.stat().st_size:
              forecasts = json.loads(forecast_file.read_text(encoding='utf-8'))
          elif model.is_file() and model.stat().st_size:
              forecasts = json.loads(model.read_text(encoding='utf-8'))
          else:
              forecasts = []
          report, html = run(forecasts, [])
          (out / 'shadow_score.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'index.html').write_text(html, encoding='utf-8')
          assert report['status'] == 'HOLD' and report['accepted'] == 0
          PY
          fi
      - name: Audit real coverage and independent settlement gap
        run: |
          python ops/evidence_readiness_inventory.py \
            --market market/latest.json \
            --summary market/private_summary_latest.json \
            --gates sources/seven_quality_gates_latest.json \
            --output "$RUNNER_TEMP/football-king-evidence/readiness.json"
      - name: Create consolidated research manifest from actual pipeline outputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/football-king-evidence"
          if [[ ! -s "$root/model_forecasts.json" ]]; then
            printf '[]\n' > "$root/model_forecasts.json"
          fi
          python ops/unified_evidence_manifest.py \
            --sealed "$root/sealed_four_model_archive.json" \
            --model "$root/model_forecasts.json" \
            --score "$root/shadow_score.json" \
            --readiness "$root/readiness.json" \
            --output "$root/unified_manifest.json"
      - name: Verify production recommendation stays disabled
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'football-king-evidence'
          report = json.loads((root / 'shadow_score.json').read_text(encoding='utf-8'))
          assert report['production_recommendations'] == 'DISABLED'
          assert report['status'] in ('HOLD', 'RESEARCH_ONLY')
          assert '正式推薦：未開放' in (root / 'index.html').read_text(encoding='utf-8')
          print('RESEARCH_ONLY / NO LIVE BETTING RECOMMENDATIONS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-king-independent-evidence-report
          path: ${{ runner.temp }}/football-king-evidence/
          retention-days: 14
