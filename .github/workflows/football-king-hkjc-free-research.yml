name: 足球王者｜香港賽馬會第三方免費足球盤口研究接駁
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-king-hkjc-free-research.yml'
      - 'ops/hkjc_free_research.py'
      - 'ops/tests/test_hkjc_free_research.py'
  schedule:
    # Hong Kong 13:18 daily. Third-party HKJC research, not HKJC account login.
    - cron: '18 5 * * *'

concurrency:
  group: football-king-hkjc-tipsme-free
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline free source safety unit tests
        run: |
          python -m unittest discover -s ops/tests -p test_hkjc_free_research.py -q
      - name: Use owner-held Tipsme Free key, do not scrape or log credentials
        env:
          TIPSME_API_KEY: ${{ secrets.TIPSME_API_KEY }}
        run: |
          set -euo pipefail
          python ops/hkjc_free_research.py --output hkjc-free-research.json
          python - <<'PY'
          import json
          doc=json.load(open('hkjc-free-research.json',encoding='utf-8'))
          assert doc['schema']=='football-king-hkjc-tipsme-free-research-v1'
          assert 0<=doc['requests_attempted']<=6
          assert doc['raw_quotes_published'] is False
          assert doc['not_hkjc_account_connected'] is True
          assert doc['can_execute_bet'] is False
          assert doc['production_recommendations']=='DISABLED'
          print({'status':doc['status'],'requests':doc['requests_attempted'],
                 'boards':doc['hkjc_boards_checked']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-king-hkjc-tipsme-free-metadata
          path: hkjc-free-research.json
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: collect
    if: github.repository == 'CHANCHUNWA1989/football-king-report' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: football-king-hkjc-tipsme-free-metadata
          path: status
      - name: Verify isolated branch archive safety contracts offline
        run: python -m unittest discover -s ops/tests -p 'test_hkjc_isolated_archive.py' -q
      - name: Archive only sanitized metadata to fixed research branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python ops/hkjc_isolated_archive.py \
            --input status/hkjc-free-research.json \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
