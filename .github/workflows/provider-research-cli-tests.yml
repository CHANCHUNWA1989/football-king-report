name: Football one-command provider research integration
on:
  push:
    branches:
      - feature/quarter-line-ev-research-20261021
    paths:
      - 'ops/provider_research_cli.py'
      - 'ops/offline_provider_export.py'
      - 'ops/daily_research_report.py'
      - 'ops/daily_research_markdown.py'
      - 'tests/test_provider_research_cli.py'
      - '.github/workflows/provider-research-cli-tests.yml'
  pull_request:
    paths:
      - 'ops/provider_research_cli.py'
      - 'ops/offline_provider_export.py'
      - 'ops/daily_research_report.py'
      - 'ops/daily_research_markdown.py'
      - 'tests/test_provider_research_cli.py'
      - '.github/workflows/provider-research-cli-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_provider_research_cli.py' -v
