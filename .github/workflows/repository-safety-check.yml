name: Repository Safety Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: repository-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate all Python source syntax without executing code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          paths = sorted(p for p in Path('.').rglob('*.py') if not excluded.intersection(p.parts))
          if not paths:
              raise SystemExit('No Python source files found: refusing false green')
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Validated {len(paths)} Python files')
          PY
      - name: Require and execute both root and ops test suites (no false-green zero tests)
        run: python -m ops.ci_test_scope_guard
