name: Repository Safety Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: repository-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate all Python source syntax without executing code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          paths = sorted(p for p in Path('.').rglob('*.py') if not excluded.intersection(p.parts))
          if not paths:
              raise SystemExit('No Python source files found: refusing false green')
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Validated {len(paths)} Python files')
          PY
      - name: Run offline standard-library regression tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p 'test*.py' -v
          else
            echo 'No tests directory: source syntax only'
          fi
