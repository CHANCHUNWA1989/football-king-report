name: Repository Safety Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = [p for p in Path('.').rglob('*.py') if not any(x in p.parts for x in ('.git','.venv','venv','node_modules'))]
          for p in files: ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          print(f'Validated {len(files)} Python files')
          PY
      - name: Run regression tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -p 'test*.py' -v; else echo 'No tests directory'; fi
